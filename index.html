<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>
    John Paolo Ramirez | Environmental · Geospatial · Data
</title>

<meta
    name="description"
    content="Portfolio of John Paolo Ramirez — environmental, geospatial and data analyst working with GIS, remote sensing, Google Earth Engine, Python, R, environmental assessment and scientific research."
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
>

<style>

/* =========================================================
   COLOR SYSTEM
   Inspired by the teal / green references
========================================================= */

:root {

    --bg: #02353C;
    --bg-soft: #074249;

    --panel: #0A4146;
    --panel-hover: #105158;
    --panel-soft: #0C4A50;

    --text: #F5FFFD;

    --muted: #C1DDD8;
    --muted-2: #8FB8B3;

    --mint: #C1F6ED;

    --green: #2EAF7D;
    --green-2: #449342;
    --green-bright: #58DE8A;

    --aqua: #3FD0C9;

    --line: rgba(193,246,237,.15);

    --radius: 29px;
}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
}

body {
    background:
        radial-gradient(
            circle at 0% 0%,
            rgba(63,208,201,.13),
            transparent 30%
        ),
        radial-gradient(
            circle at 100% 100%,
            rgba(46,175,125,.15),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #02353C,
            #03383E 55%,
            #063C3F
        );

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}

button,
a {
    font: inherit;
}

button {
    color: inherit;
}

img {
    display: block;
    max-width: 100%;
}


/* =========================================================
   APP
========================================================= */

.app {
    width: 100%;
    height: 100svh;

    padding:
        clamp(11px, 1.7vw, 25px);

    display: flex;
    flex-direction: column;

    gap:
        clamp(9px, 1.2vw, 16px);
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar {
    min-height: 38px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;
}

.brand {
    display: flex;
    align-items: center;

    gap: 9px;

    color: var(--green-bright);

    font-size: .69rem;
    font-weight: 900;

    letter-spacing: .17em;
    text-transform: uppercase;
}

.hint {
    color: var(--muted-2);

    font-size: .68rem;
}


/* =========================================================
   DASHBOARD
========================================================= */

.dashboard {
    min-height: 0;

    flex: 1;

    display: grid;

    grid-template-columns:
        repeat(12, minmax(0,1fr));

    grid-template-rows:
        repeat(2, minmax(0,1fr));

    gap:
        clamp(9px, 1.25vw, 17px);
}


/* =========================================================
   PANELS
========================================================= */

.panel {
    position: relative;

    min-width: 0;
    min-height: 0;

    overflow: hidden;

    padding:
        clamp(19px, 2.2vw, 34px);

    border:
        1px solid var(--line);

    border-radius: var(--radius);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.025),
            transparent 45%
        ),
        var(--panel);

    text-align: left;

    cursor: pointer;

    isolation: isolate;

    box-shadow:
        0 18px 38px
        rgba(0,25,28,.13);

    transition:
        transform .34s cubic-bezier(.2,.8,.2,1),
        border-color .3s ease,
        background .3s ease,
        box-shadow .3s ease;
}

.panel:hover {
    transform:
        translateY(-4px);

    background:
        var(--panel-hover);

    border-color:
        rgba(88,222,138,.32);

    box-shadow:
        0 22px 48px
        rgba(0,20,23,.23);
}

.panel:focus-visible {
    outline:
        2px solid
        var(--green-bright);

    outline-offset:
        3px;
}


/* =========================================================
   PANEL LAYOUT
========================================================= */

.panel-profile {
    grid-column: span 7;
}

.panel-projects {
    grid-column: span 5;
}

.panel-skills,
.panel-gallery,
.panel-mini {
    grid-column: span 4;
}


/* =========================================================
   PANEL COMMON
========================================================= */

.panel-kicker {
    position: relative;

    z-index: 5;

    display: inline-flex;
    align-items: center;

    gap: 7px;

    color:
        var(--green-bright);

    font-size:
        .64rem;

    font-weight:
        900;

    text-transform:
        uppercase;

    letter-spacing:
        .14em;
}

.panel-arrow {
    position: absolute;

    z-index: 20;

    top: 22px;
    right: 23px;

    width: 40px;
    height: 40px;

    border:
        1px solid
        var(--line);

    border-radius:
        50%;

    display: flex;
    align-items: center;
    justify-content: center;

    color:
        var(--mint);

    background:
        rgba(2,53,60,.25);

    transition:
        transform .3s ease,
        color .3s ease,
        border-color .3s ease,
        background .3s ease;
}

.panel:hover
.panel-arrow {
    transform:
        rotate(45deg);

    color:
        white;

    border-color:
        rgba(88,222,138,.35);

    background:
        rgba(46,175,125,.16);
}


/* =========================================================
   SHARED TITLES

   IMPORTANT:
   No punctuation on closed panels.
   Punctuation gets introduced once expanded.
========================================================= */

.shared-title {
    position: relative;

    z-index: 5;

    margin: 0;

    color:
        var(--text);

    font-weight: 900;

    letter-spacing: -.064em;

    line-height: .91;

    transform-origin:
        top left;
}

.title-line {
    display: block;
}

.shared-title .accent,
.flying-title .accent {
    color:
        var(--green-bright);
}


/* homepage title sizes */

.panel-profile
.shared-title {
    font-size:
        clamp(2.8rem, 5.55vw, 6.8rem);
}

.panel-projects
.shared-title {
    font-size:
        clamp(2.15rem, 4vw, 4.7rem);
}

.panel-skills
.shared-title {
    font-size:
        clamp(1.38rem, 2.45vw, 2.9rem);

    line-height: 1;
}

.panel-gallery
.shared-title,
.panel-mini
.shared-title {
    font-size:
        clamp(1.8rem, 3vw, 3.5rem);
}


/* =========================================================
   PROFILE PANEL
========================================================= */

.panel-profile {
    display: flex;
    flex-direction: column;
    justify-content: space-between;

    background:
        radial-gradient(
            circle at 82% 15%,
            rgba(63,208,201,.15),
            transparent 40%
        ),
        linear-gradient(
            140deg,
            #0A4146,
            #0B484A
        );
}

.profile-content {
    position: relative;

    z-index: 5;

    max-width: 66%;
}

.profile-copy {
    margin-top: 14px;

    max-width: 680px;

    color:
        var(--muted);

    font-size:
        clamp(.82rem, 1.1vw, 1rem);

    line-height: 1.55;
}

.bottom-note {
    position: relative;

    z-index: 5;

    color:
        var(--muted-2);

    font-size: .67rem;
}


/* =========================================================
   PROFILE PLANETARY / ORGANIC VISUAL
========================================================= */

.planet-system {
    position: absolute;

    z-index: 1;

    right: 2%;
    top: 7%;

    width: 38%;
    height: 86%;

    pointer-events: none;
}


/* orbits */

.orbit {
    position: absolute;

    border:
        1px solid
        rgba(193,246,237,.12);

    border-radius: 50%;

    animation:
        orbitRotate linear infinite;
}

.orbit-one {
    width: 280px;
    height: 280px;

    right: 7%;
    top: 5%;

    animation-duration:
        19s;
}

.orbit-two {
    width: 205px;
    height: 205px;

    right: 19%;
    top: 18%;

    animation-duration:
        14s;

    animation-direction:
        reverse;
}

.orbit-three {
    width: 345px;
    height: 175px;

    right: -3%;
    bottom: 2%;

    transform:
        rotate(-22deg);

    animation-duration:
        24s;
}

@keyframes orbitRotate {
    to {
        transform:
            rotate(360deg);
    }
}


/* planet */

.planet {
    position: absolute;

    border-radius: 50%;

    box-shadow:
        inset -25px -28px 50px
        rgba(1,63,59,.23),
        inset 18px 18px 34px
        rgba(255,255,255,.16),
        0 18px 35px
        rgba(0,30,30,.18);

    filter:
        saturate(.95);

    animation:
        planetFloat
        ease-in-out
        infinite alternate;
}

.planet-large {
    width: 155px;
    height: 155px;

    right: 17%;
    top: 10%;

    background:
        radial-gradient(
            circle at 32% 25%,
            #C1F6ED,
            #5DD596 42%,
            #2EAF7D 72%,
            #196750 100%
        );

    animation-duration:
        7.5s;
}

.planet-medium {
    width: 108px;
    height: 108px;

    right: 2%;
    top: 51%;

    background:
        radial-gradient(
            circle at 32% 25%,
            #94DEA5,
            #53C884 50%,
            #257E63 100%
        );

    animation-duration:
        6.3s;

    animation-delay:
        -2s;
}

.planet-small {
    width: 62px;
    height: 62px;

    right: 44%;
    top: 57%;

    background:
        radial-gradient(
            circle at 34% 26%,
            #C1F6ED,
            #3FD0C9 47%,
            #18776F 100%
        );

    animation-duration:
        5s;

    animation-delay:
        -1.4s;
}

.planet-tiny {
    width: 29px;
    height: 29px;

    right: 49%;
    top: 18%;

    background:
        #58DE8A;

    box-shadow:
        0 0 22px
        rgba(88,222,138,.34);

    animation-duration:
        4.3s;
}


@keyframes planetFloat {

    from {
        transform:
            translate3d(0,-8px,0)
            scale(.98);
    }

    to {
        transform:
            translate3d(9px,11px,0)
            scale(1.04);
    }

}


/* small moving particles */

.planet-particle {
    position: absolute;

    width: 7px;
    height: 7px;

    border-radius:
        50%;

    background:
        var(--mint);

    opacity:
        .5;

    animation:
        particlePulse
        3s ease-in-out
        infinite;
}

.pp1 {
    right: 52%;
    top: 38%;
}

.pp2 {
    right: 5%;
    top: 32%;

    animation-delay:
        -1s;
}

.pp3 {
    right: 32%;
    bottom: 9%;

    animation-delay:
        -2s;
}

@keyframes particlePulse {

    0%,
    100% {
        transform:
            scale(.7);

        opacity:
            .2;
    }

    50% {
        transform:
            scale(1.45);

        opacity:
            .9;
    }

}


/* =========================================================
   PROJECT PANEL
========================================================= */

.panel-projects {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.project-preview {
    display: grid;

    gap: 7px;
}

.preview-line {
    padding-top: 9px;

    border-top:
        1px solid
        var(--line);

    display: flex;
    justify-content: space-between;

    gap: 12px;

    font-size:
        .68rem;
}

.preview-line strong {
    color:
        var(--text);
}

.preview-line span {
    color:
        var(--muted-2);
}


/* =========================================================
   SKILLS PANEL
========================================================= */

.panel-skills {
    display: flex;
    flex-direction: column;
    justify-content: space-between;

    background:
        radial-gradient(
            circle at 10% 100%,
            rgba(63,208,201,.12),
            transparent 43%
        ),
        var(--panel);
}

.skill-preview {
    display: flex;
    flex-wrap: wrap;

    gap: 6px;
}

.skill-preview span {
    padding:
        6px 9px;

    border:
        1px solid
        var(--line);

    border-radius:
        999px;

    color:
        var(--muted);

    font-size:
        .62rem;

    font-weight:
        720;
}


/* =========================================================
   SELECTED WORK PANEL
========================================================= */

.panel-gallery {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.gallery-panel-copy {
    position: relative;

    z-index: 3;
}

.thumb-strip {
    height: 38%;

    min-height: 85px;

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 7px;
}

.thumb {
    position: relative;

    overflow: hidden;

    border:
        1px solid
        var(--line);

    border-radius:
        12px;

    background:
        #07383D;
}

.thumb img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    transition:
        transform .35s ease;
}

.panel-gallery:hover
.thumb:nth-child(1) img {
    transform:
        scale(1.08)
        translateY(-2px);
}

.panel-gallery:hover
.thumb:nth-child(2) img {
    transform:
        scale(1.08)
        translateY(2px);
}

.panel-gallery:hover
.thumb:nth-child(3) img {
    transform:
        scale(1.08)
        translateX(2px);
}


/* =========================================================
   MINI PROJECT PANEL
========================================================= */

.panel-mini {
    display: flex;
    flex-direction: column;
    justify-content: space-between;

    background:
        radial-gradient(
            circle at 90% 8%,
            rgba(88,222,138,.12),
            transparent 40%
        ),
        var(--panel);
}

.mini-preview {
    display: grid;

    gap: 7px;
}

.mini-preview-row {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 12px;

    padding-top: 8px;

    border-top:
        1px solid
        var(--line);

    color:
        var(--muted);

    font-size: .64rem;
}

.mini-preview-row strong {
    color:
        var(--text);

    font-weight:
        760;
}

.mini-preview-row i {
    color:
        var(--green-bright);

    font-size:
        .58rem;
}


/* =========================================================
   EXPANSION BACKDROP
========================================================= */

.expansion-backdrop {
    position: fixed;

    inset: 0;

    z-index: 4990;

    background:
        rgba(1,29,33,.72);

    backdrop-filter:
        blur(14px);

    -webkit-backdrop-filter:
        blur(14px);

    opacity: 0;

    transition:
        opacity .4s ease;
}

.expansion-backdrop.open {
    opacity: 1;
}


/* =========================================================
   EXPANDING PANEL
========================================================= */

.expansion {
    position: fixed;

    z-index: 5000;

    overflow: hidden;

    border:
        1px solid
        rgba(193,246,237,.17);

    background:
        linear-gradient(
            145deg,
            #074047,
            #07383E
        );

    box-shadow:
        0 38px 110px
        rgba(0,20,24,.58);

    will-change:
        left,
        top,
        width,
        height,
        border-radius;

    transition:
        left .6s cubic-bezier(.2,.8,.2,1),
        top .6s cubic-bezier(.2,.8,.2,1),
        width .6s cubic-bezier(.2,.8,.2,1),
        height .6s cubic-bezier(.2,.8,.2,1),
        border-radius .6s cubic-bezier(.2,.8,.2,1);
}


/* =========================================================
   FLYING / SHARED TITLE
========================================================= */

.flying-title {
    position: fixed;

    z-index: 5100;

    margin: 0;

    pointer-events: none;

    color:
        var(--text);

    font-weight:
        900;

    line-height:
        .91;

    letter-spacing:
        -.064em;

    transform-origin:
        top left;

    will-change:
        left,
        top,
        font-size,
        line-height,
        width;

    transition:
        left .6s cubic-bezier(.2,.8,.2,1),
        top .6s cubic-bezier(.2,.8,.2,1),
        font-size .6s cubic-bezier(.2,.8,.2,1),
        line-height .6s cubic-bezier(.2,.8,.2,1),
        width .6s cubic-bezier(.2,.8,.2,1);
}


/* reflow title when opened */

.flying-title.compact
.title-line {
    display: inline;
}


/* ---------------------------------------------------------
   punctuation ONLY when opened
--------------------------------------------------------- */

/* Profile: no periods */
.flying-title[data-key="profile"].compact
.title-line:not(:last-child)::after {
    content: " ";
}


/* Projects */
.flying-title[data-key="projects"].compact
.title-line:not(:last-child)::after {
    content: " ";
}

.flying-title[data-key="projects"].compact
.title-line:last-child::after {
    content: ".";
}


/* Skills */
.flying-title[data-key="skills"].compact
.title-line::after {
    content: ". ";
}


/* Gallery */
.flying-title[data-key="gallery"].compact
.title-line::after {
    content: ". ";
}


/* Mini */
.flying-title[data-key="mini"].compact
.title-line:not(:last-child)::after {
    content: " ";
}

.flying-title[data-key="mini"].compact
.title-line:last-child::after {
    content: ".";
}


/* =========================================================
   EXPANDED CONTENT
========================================================= */

.expanded-content {
    position: absolute;

    inset: 0;

    overflow-y: auto;
    overflow-x: hidden;

    padding:
        130px
        clamp(23px,4vw,60px)
        44px;

    opacity: 0;

    transform:
        translateY(18px);

    transition:
        opacity .3s ease .37s,
        transform .42s ease .34s;
}

.expansion.content-visible
.expanded-content {
    opacity: 1;

    transform:
        translateY(0);
}

.expanded-content::-webkit-scrollbar {
    width: 7px;
}

.expanded-content::-webkit-scrollbar-track {
    background: transparent;
}

.expanded-content::-webkit-scrollbar-thumb {
    background:
        rgba(193,246,237,.32);

    border-radius: 10px;
}


/* =========================================================
   EXPANDED HEADER
========================================================= */

.expanded-header-row {
    position: relative;

    z-index: 4;

    display: flex;
    align-items: end;
    justify-content: space-between;

    gap: 25px;

    margin-bottom: 30px;
}

.expanded-kicker {
    color:
        var(--green-bright);

    font-size: .73rem;

    font-weight:
        900;

    letter-spacing:
        .15em;

    text-transform:
        uppercase;
}

.expanded-description {
    max-width: 830px;

    margin-top: 9px;

    color:
        var(--muted);

    font-size:
        clamp(.96rem,1.2vw,1.1rem);

    line-height: 1.7;
}


/* =========================================================
   CLOSE BUTTON
========================================================= */

.expansion-close {
    position: fixed;

    z-index: 5200;

    width: 48px;
    height: 48px;

    border:
        1px solid
        rgba(193,246,237,.18);

    border-radius: 50%;

    background:
        rgba(2,53,60,.82);

    color:
        white;

    cursor: pointer;

    opacity: 0;

    transform:
        scale(.8);

    backdrop-filter:
        blur(15px);

    transition:
        opacity .25s ease .39s,
        transform .35s ease .37s,
        background .2s ease;
}

.expansion-close.visible {
    opacity: 1;

    transform:
        scale(1);
}

.expansion-close:hover {
    background:
        var(--green);
}


/* =========================================================
   MOVING BLOBS INSIDE EXPANDED PANELS
========================================================= */

.expanded-blob {
    position: absolute;

    width: 350px;
    height: 270px;

    right: -85px;
    top: -70px;

    opacity: .16;

    pointer-events: none;

    background:
        radial-gradient(
            circle at 30% 25%,
            #C1F6ED,
            #58DE8A 43%,
            #2EAF7D 68%,
            #176B57 100%
        );

    border-radius:
        55% 45% 60% 40%
        /
        44% 58% 42% 56%;

    animation:
        expandedBlob 8s
        ease-in-out
        infinite alternate;
}

.expanded-blob-small {
    position: absolute;

    width: 78px;
    height: 78px;

    right: 20%;
    top: 100px;

    opacity: .12;

    background:
        var(--aqua);

    border-radius:
        57% 43% 39% 61%
        /
        43% 55% 45% 57%;

    animation:
        expandedBlobSmall
        6.5s ease-in-out
        infinite alternate;
}

@keyframes expandedBlob {

    0% {
        transform:
            translate(0,0)
            rotate(-4deg)
            scale(1);

        border-radius:
            55% 45% 60% 40%
            /
            44% 58% 42% 56%;
    }

    50% {
        transform:
            translate(-30px,25px)
            rotate(5deg)
            scale(1.07);

        border-radius:
            39% 61% 48% 52%
            /
            57% 41% 59% 43%;
    }

    100% {
        transform:
            translate(-8px,12px)
            rotate(-1deg)
            scale(.97);

        border-radius:
            62% 38% 54% 46%
            /
            39% 61% 43% 57%;
    }
}

@keyframes expandedBlobSmall {

    from {
        transform:
            translate(0,0)
            rotate(0deg);
    }

    to {
        transform:
            translate(-45px,30px)
            rotate(35deg)
            scale(1.18);
    }

}


/* =========================================================
   GENERAL TAGS
========================================================= */

.tags {
    margin-top: 19px;

    display: flex;
    flex-wrap: wrap;

    gap: 7px;
}

.tags span {
    padding:
        7px 10px;

    border-radius:
        999px;

    background:
        rgba(193,246,237,.07);

    color:
        var(--mint);

    font-size:
        .71rem;

    font-weight:
        720;
}


/* =========================================================
   HORIZONTAL / ITUNES-STYLE CAROUSEL
========================================================= */

.carousel-section {
    position: relative;

    z-index: 3;
}

.carousel-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;

    margin-bottom: 18px;
}

/* =========================================================
   EXPANDED TITLE SIZE

   Profile stays large.
   Projects ≈ half original size.
   Skills/Gallery/Mini remain larger than before.
========================================================= */

function getExpandedTitleSize(
    key,
    originalSize
) {

    const mobile =
        window.innerWidth <= 800;


    if (mobile) {

        if (key === "profile") {
            return Math.min(
                Math.max(
                    originalSize * .70,
                    29
                ),
                40
            );
        }

        if (key === "projects") {
            return Math.min(
                Math.max(
                    originalSize * .55,
                    25
                ),
                34
            );
        }

        if (key === "skills") {
            return Math.min(
                Math.max(
                    originalSize * .70,
                    20
                ),
                29
            );
        }

        if (key === "gallery") {
            return Math.min(
                Math.max(
                    originalSize * .63,
                    22
                ),
                31
            );
        }

        if (key === "mini") {
            return Math.min(
                Math.max(
                    originalSize * .63,
                    22
                ),
                31
            );
        }

    }


    else {

        if (key === "profile") {
            return Math.min(
                Math.max(
                    originalSize * .62,
                    46
                ),
                60
            );
        }

        if (key === "projects") {
            return Math.min(
                Math.max(
                    originalSize * .52,
                    36
                ),
                47
            );
        }

        if (key === "skills") {
            return Math.min(
                Math.max(
                    originalSize * .72,
                    31
                ),
                40
            );
        }

        if (key === "gallery") {
            return Math.min(
                Math.max(
                    originalSize * .66,
                    32
                ),
                42
            );
        }

        if (key === "mini") {
            return Math.min(
                Math.max(
                    originalSize * .66,
                    31
                ),
                40
            );
        }

    }


    return 32;
}


/* =========================================================
   OPEN PANEL
========================================================= */

function openPanel(panel) {

    if (activePanel) {
        return;
    }


    activePanel =
        panel;


    const key =
        panel.dataset.panel;


    const panelRect =
        panel.getBoundingClientRect();


    const originalTitle =
        panel.querySelector(
            "[data-title]"
        );


    const titleRect =
        originalTitle
        .getBoundingClientRect();


    const panelStyle =
        getComputedStyle(panel);


    const titleStyle =
        getComputedStyle(originalTitle);


    const originalFontSize =
        parseFloat(
            titleStyle.fontSize
        );


    /* -----------------------------------------------------
       BACKDROP
    ----------------------------------------------------- */

    backdrop.hidden =
        false;


    requestAnimationFrame(
        () => {

            backdrop.classList.add(
                "open"
            );

        }
    );


    /* -----------------------------------------------------
       CREATE EXPANSION
    ----------------------------------------------------- */

    expansion =
        document.createElement(
            "div"
        );


    expansion.className =
        "expansion";


    expansion.style.left =
        `${panelRect.left}px`;


    expansion.style.top =
        `${panelRect.top}px`;


    expansion.style.width =
        `${panelRect.width}px`;


    expansion.style.height =
        `${panelRect.height}px`;


    expansion.style.borderRadius =
        panelStyle.borderRadius;


    expansion.innerHTML =
        `
        <div class="expanded-blob"></div>

        <div class="expanded-blob-small"></div>

        <div class="expanded-content">

            <div class="expanded-header-row">

                <div>

                    <div class="expanded-kicker">

                        ${content[key].kicker}

                    </div>

                    <div class="expanded-description">

                        ${content[key].description}

                    </div>

                </div>

            </div>

            ${content[key].html}

        </div>
        `;


    document.body.appendChild(
        expansion
    );


    /* -----------------------------------------------------
       FLYING TITLE
    ----------------------------------------------------- */

    flyingTitle =
        document.createElement(
            originalTitle.tagName
        );


    flyingTitle.className =
        "flying-title";


    flyingTitle.dataset.key =
        key;


    flyingTitle.innerHTML =
        originalTitle.innerHTML;


    flyingTitle.style.left =
        `${titleRect.left}px`;


    flyingTitle.style.top =
        `${titleRect.top}px`;


    flyingTitle.style.width =
        `${titleRect.width}px`;


    flyingTitle.style.fontSize =
        titleStyle.fontSize;


    flyingTitle.style.lineHeight =
        titleStyle.lineHeight;


    document.body.appendChild(
        flyingTitle
    );


    /* hide source */

    originalTitle.style.opacity =
        "0";


    panel.style.opacity =
        "0";


    /* -----------------------------------------------------
       DESTINATION
    ----------------------------------------------------- */

    const margin =
        window.innerWidth <= 800
            ? 6
            : 22;


    const finalLeft =
        margin;


    const finalTop =
        margin;


    const finalWidth =
        window.innerWidth
        - margin * 2;


    const finalHeight =
        window.innerHeight
        - margin * 2;


    const finalTitleLeft =
        finalLeft
        + (
            window.innerWidth <= 800
                ? 18
                : 54
        );


    const finalTitleTop =
        finalTop
        + (
            window.innerWidth <= 800
                ? 20
                : 28
        );


    const finalTitleSize =
        getExpandedTitleSize(
            key,
            originalFontSize
        );


    const finalTitleWidth =
        Math.min(
            finalWidth * .80,
            1100
        );


    /* -----------------------------------------------------
       RUN EXPANSION
    ----------------------------------------------------- */

    requestAnimationFrame(
        () => {

            expansion.style.left =
                `${finalLeft}px`;


            expansion.style.top =
                `${finalTop}px`;


            expansion.style.width =
                `${finalWidth}px`;


            expansion.style.height =
                `${finalHeight}px`;


            expansion.style.borderRadius =
                window.innerWidth <= 800
                    ? "23px"
                    : "38px";


            flyingTitle.style.left =
                `${finalTitleLeft}px`;


            flyingTitle.style.top =
                `${finalTitleTop}px`;


            flyingTitle.style.fontSize =
                `${finalTitleSize}px`;


            flyingTitle.style.lineHeight =
                "1.04";


            flyingTitle.style.width =
                `${finalTitleWidth}px`;


            flyingTitle.classList.add(
                "compact"
            );

        }
    );


    /* -----------------------------------------------------
       CLOSE BUTTON
    ----------------------------------------------------- */

    closeButton =
        document.createElement(
            "button"
        );


    closeButton.className =
        "expansion-close";


    closeButton.innerHTML =
        `
        <i class="fa-solid fa-xmark"></i>
        `;


    closeButton.setAttribute(
        "aria-label",
        "Close panel"
    );


    document.body.appendChild(
        closeButton
    );


    positionCloseButton();


    closeButton.addEventListener(
        "click",
        closeActivePanel
    );


    /* -----------------------------------------------------
       REVEAL CONTENT
    ----------------------------------------------------- */

    setTimeout(
        () => {

            if (!expansion) {
                return;
            }


            expansion.classList.add(
                "content-visible"
            );


            closeButton.classList.add(
                "visible"
            );


            bindCarousels();


            bindGalleryItems();

        },

        430
    );

}


/* =========================================================
   CLOSE PANEL
========================================================= */

function closeActivePanel() {

    if (
        !activePanel
        || !expansion
        || !flyingTitle
    ) {
        return;
    }


    const panel =
        activePanel;


    const originalTitle =
        panel.querySelector(
            "[data-title]"
        );


    panel.style.opacity =
        "1";


    originalTitle.style.opacity =
        "0";


    const destination =
        panel.getBoundingClientRect();


    const titleDestination =
        originalTitle
        .getBoundingClientRect();


    const titleStyle =
        getComputedStyle(
            originalTitle
        );


    expansion.classList.remove(
        "content-visible"
    );


    if (closeButton) {

        closeButton.classList.remove(
            "visible"
        );

    }


    backdrop.classList.remove(
        "open"
    );


    flyingTitle.classList.remove(
        "compact"
    );


    /* -----------------------------------------------------
       REVERSE PANEL
    ----------------------------------------------------- */

    expansion.style.left =
        `${destination.left}px`;


    expansion.style.top =
        `${destination.top}px`;


    expansion.style.width =
        `${destination.width}px`;


    expansion.style.height =
        `${destination.height}px`;


    expansion.style.borderRadius =
        getComputedStyle(panel)
        .borderRadius;


    /* -----------------------------------------------------
       REVERSE TITLE
    ----------------------------------------------------- */

    flyingTitle.style.left =
        `${titleDestination.left}px`;


    flyingTitle.style.top =
        `${titleDestination.top}px`;


    flyingTitle.style.width =
        `${titleDestination.width}px`;


    flyingTitle.style.fontSize =
        titleStyle.fontSize;


    flyingTitle.style.lineHeight =
        titleStyle.lineHeight;


    /* -----------------------------------------------------
       CLEAN UP
    ----------------------------------------------------- */

    setTimeout(
        () => {

            originalTitle.style.opacity =
                "";


            expansion.remove();


            flyingTitle.remove();


            if (closeButton) {

                closeButton.remove();

            }


            backdrop.hidden =
                true;


            expansion =
                null;


            flyingTitle =
                null;


            closeButton =
                null;


            activePanel =
                null;

        },

        625
    );

}


/* =========================================================
   CLOSE BUTTON POSITION
========================================================= */

function positionCloseButton() {

    if (!closeButton) {
        return;
    }


    const margin =
        window.innerWidth <= 800
            ? 15
            : 40;


    closeButton.style.top =
        `${margin}px`;


    closeButton.style.right =
        `${margin}px`;

}


/* =========================================================
   PANEL CLICK
========================================================= */

panels.forEach(
    panel => {

        panel.addEventListener(
            "click",
            () => {

                openPanel(
                    panel
                );

            }
        );

    }
);


/* =========================================================
   BACKDROP CLOSE
========================================================= */

backdrop.addEventListener(
    "click",
    closeActivePanel
);


/* =========================================================
   CAROUSEL CONTROLS
========================================================= */

function bindCarousels() {

    if (!expansion) {
        return;
    }


    expansion
        .querySelectorAll(
            "[data-carousel-next]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();


                        const track =
                            expansion.querySelector(
                                `#${
                                    button.dataset
                                    .carouselNext
                                }`
                            );


                        if (!track) {
                            return;
                        }


                        const card =
                            track.querySelector(
                                ".scroll-card"
                            );


                        const distance =
                            card
                                ? card.getBoundingClientRect().width
                                  + 16
                                : 500;


                        track.scrollBy({

                            left:
                                distance,

                            behavior:
                                "smooth"

                        });

                    }
                );

            }
        );


    expansion
        .querySelectorAll(
            "[data-carousel-prev]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();


                        const track =
                            expansion.querySelector(
                                `#${
                                    button.dataset
                                    .carouselPrev
                                }`
                            );


                        if (!track) {
                            return;
                        }


                        const card =
                            track.querySelector(
                                ".scroll-card"
                            );


                        const distance =
                            card
                                ? card.getBoundingClientRect().width
                                  + 16
                                : 500;


                        track.scrollBy({

                            left:
                                -distance,

                            behavior:
                                "smooth"

                        });

                    }
                );

            }
        );

}


/* =========================================================
   GALLERY LIGHTBOX BINDING
========================================================= */

function bindGalleryItems() {

    if (!expansion) {
        return;
    }


    expansion
        .querySelectorAll(
            ".gallery-item"
        )
        .forEach(
            item => {

                if (
                    item.dataset.bound
                ) {
                    return;
                }


                item.dataset.bound =
                    "true";


                item.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();


                        lightboxImage.src =
                            item.dataset.image;


                        lightbox.classList.add(
                            "open"
                        );

                    }
                );

            }
        );

}


/* =========================================================
   LIGHTBOX
========================================================= */

function closeLightbox() {

    lightbox.classList.remove(
        "open"
    );


    lightboxImage.src =
        "";

}


lightboxClose.addEventListener(
    "click",
    closeLightbox
);


lightbox.addEventListener(
    "click",
    event => {

        if (
            event.target === lightbox
        ) {

            closeLightbox();

        }

    }
);


/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key !== "Escape"
        ) {
            return;
        }


        if (
            lightbox.classList
            .contains("open")
        ) {

            closeLightbox();

            return;
        }


        closeActivePanel();

    }
);


/* =========================================================
   WINDOW RESIZE
========================================================= */

window.addEventListener(
    "resize",
    positionCloseButton
);

</script>

</body>
</html>
