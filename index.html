<style>

/* =========================================================
SECTION 01 — COLORS / THEME
Edit the site-wide background, text, green, aqua and panel colors here.
========================================================= */

:root {
    --bg: #02353C;
    --bg2: #064149;

    --panel: #0A474D;
    --panel2: #0B5156;
    --panel3: #0B5A5D;

    --text: #F7FFFD;

    --muted: #C0DBD7;
    --muted2: #88B2AD;

    --mint: #C1F6ED;

    --green: #2EAF7D;
    --green2: #449342;
    --greenBright: #59E18D;

    --aqua: #3FD0C9;

    --line: rgba(193,246,237,.17);

    --radius: 29px;
}


/* =========================================================
RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
}

body {

    background:

        radial-gradient(
            circle at 3% 3%,
            rgba(63,208,201,.12),
            transparent 31%
        ),

        radial-gradient(
            circle at 97% 94%,
            rgba(46,175,125,.14),
            transparent 34%
        ),

        linear-gradient(
            145deg,
            #02353C,
            #043D43 55%,
            #063E42
        );

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    -webkit-font-smoothing: antialiased;

    text-rendering: optimizeLegibility;
}

button,
a {
    font: inherit;
}

button {
    color: inherit;
}

img {
    display: block;
    max-width: 100%;
}


/* =========================================================
MAIN APP
========================================================= */

.app {
    width: 100%;
    height: 100svh;

    padding:
        clamp(10px, 1.6vw, 24px);

    display: flex;
    flex-direction: column;

    gap:
        clamp(8px, 1.15vw, 15px);
}


/* =========================================================
TOP BAR
========================================================= */

.topbar {
    min-height: 38px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;
}

.brand {
    display: flex;
    align-items: center;

    gap: 9px;

    color:
        var(--greenBright);

    font-size: .69rem;
    font-weight: 900;

    letter-spacing: .17em;

    text-transform: uppercase;
}

.hint {
    color:
        var(--muted2);

    font-size: .68rem;
}


/* =========================================================
SECTION 02 — HOME DASHBOARD / PANEL LAYOUT
Controls the home-page grid and panel sizing.
========================================================= */

.dashboard {
    min-height: 0;

    flex: 1;

    display: grid;

    grid-template-columns:
        repeat(12, minmax(0,1fr));

    grid-template-rows:
        repeat(2, minmax(0,1fr));

    gap:
        clamp(8px,1.2vw,16px);
}


/* =========================================================
PANEL
========================================================= */

.panel {
    position: relative;

    min-width: 0;
    min-height: 0;

    overflow: hidden;

    padding:
        clamp(18px,2vw,32px);

    border:
        1px solid
        var(--line);

    border-radius:
        var(--radius);

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.025),
            transparent 46%
        ),

        var(--panel);

    color:
        var(--text);

    text-align: left;

    cursor: pointer;

    isolation: isolate;

    box-shadow:
        0 18px 40px
        rgba(0,24,27,.14);

    transition:

        transform .32s
        cubic-bezier(.2,.8,.2,1),

        border-color .3s ease,

        background .3s ease,

        box-shadow .3s ease;
}

.panel:hover {
    transform:
        translateY(-4px);

    background:
        var(--panel2);

    border-color:
        rgba(89,225,141,.30);

    box-shadow:
        0 22px 50px
        rgba(0,20,23,.23);
}

.panel:focus-visible {
    outline:
        2px solid
        var(--greenBright);

    outline-offset:
        3px;
}


/* =========================================================
PANEL GRID
========================================================= */

.panel-profile {
    grid-column:
        span 7;
}

.panel-projects {
    grid-column:
        span 5;
}

.panel-skills,
.panel-gallery,
.panel-mini {
    grid-column:
        span 4;
}


/* =========================================================
PANEL COMMON
========================================================= */

.panel-kicker {
    position: relative;

    z-index: 5;

    display:
        inline-flex;

    align-items:
        center;

    gap: 7px;

    color:
        var(--greenBright);

    font-size: .63rem;

    font-weight: 900;

    letter-spacing: .14em;

    text-transform: uppercase;
}

.panel-arrow {
    position: absolute;

    z-index: 15;

    top: 21px;
    right: 22px;

    width: 39px;
    height: 39px;

    border:
        1px solid
        var(--line);

    border-radius:
        50%;

    display: flex;

    align-items: center;
    justify-content: center;

    color:
        var(--mint);

    background:
        rgba(2,53,60,.28);

    transition:
        transform .3s ease,
        background .3s ease;
}

.panel:hover
.panel-arrow {
    transform:
        rotate(45deg);

    background:
        rgba(46,175,125,.18);
}


/* =========================================================
SHARED TITLES
========================================================= */

.shared-title {
    position: relative;

    z-index: 5;

    margin: 0;

    color:
        var(--text);

    font-weight: 900;

    letter-spacing: -.064em;

    line-height: .91;

    transform-origin:
        top left;
}

.title-line {
    display: block;
}

.shared-title .accent,
.flying-title .accent {
    color:
        var(--greenBright);
}


/* HOME SIZES */

.panel-profile
.shared-title {
    font-size:
        clamp(2.8rem,5.55vw,6.7rem);
}

.panel-projects
.shared-title {
    font-size:
        clamp(2.1rem,3.95vw,4.6rem);
}

.panel-skills
.shared-title {
    font-size:
        clamp(1.35rem,2.4vw,2.8rem);

    line-height: 1;
}

.panel-gallery
.shared-title,
.panel-mini
.shared-title {
    font-size:
        clamp(1.75rem,2.9vw,3.4rem);
}


/* =========================================================
PROFILE PANEL
========================================================= */

.panel-profile {
    display: flex;
    flex-direction: column;

    justify-content:
        space-between;

    background:

        radial-gradient(
            circle at 82% 16%,
            rgba(63,208,201,.15),
            transparent 40%
        ),

        linear-gradient(
            138deg,
            #09454B,
            #0B4D50
        );
}

.profile-content {
    position: relative;

    z-index: 5;

    max-width: 68%;
}

.profile-copy {
    margin-top: 14px;

    max-width: 680px;

    color:
        var(--muted);

    font-size:
        clamp(.82rem,1.05vw,1rem);

    line-height: 1.55;
}

.bottom-note {
    position: relative;

    z-index: 5;

    color:
        var(--muted2);

    font-size: .66rem;
}


/* =========================================================
SECTION 03 — HOME PANEL VISUALS / PROFILE PLANETS
Decorative moving planets and particles on the main profile card.
========================================================= */

.planet-system {
    position: absolute;

    right: 1%;
    top: 4%;

    width: 40%;
    height: 91%;

    z-index: 1;

    pointer-events: none;
}

.orbit {
    position: absolute;

    border:
        1px solid
        rgba(193,246,237,.12);

    border-radius: 50%;

    animation:
        orbitSpin linear infinite;
}

.orbit1 {
    width: 285px;
    height: 285px;

    right: 6%;
    top: 3%;

    animation-duration:
        20s;
}

.orbit2 {
    width: 205px;
    height: 205px;

    right: 20%;
    top: 18%;

    animation-duration:
        14s;

    animation-direction:
        reverse;
}

.orbit3 {
    width: 350px;
    height: 180px;

    right: -7%;
    bottom: 2%;

    transform:
        rotate(-21deg);

    animation-duration:
        24s;
}

@keyframes orbitSpin {
    to {
        transform:
            rotate(360deg);
    }
}

.planet {
    position: absolute;

    border-radius: 50%;

    box-shadow:

        inset -24px -25px 45px
        rgba(0,69,62,.25),

        inset 18px 16px 32px
        rgba(255,255,255,.13),

        0 20px 36px
        rgba(0,28,31,.18);

    animation:
        planetFloat
        ease-in-out
        infinite alternate;
}

.planet1 {
    width: 155px;
    height: 155px;

    right: 16%;
    top: 9%;

    background:

        radial-gradient(
            circle at 30% 24%,
            #C1F6ED,
            #65DA9B 43%,
            #2EAF7D 72%,
            #166750
        );

    animation-duration:
        7s;
}

.planet2 {
    width: 108px;
    height: 108px;

    right: 1%;
    top: 50%;

    background:

        radial-gradient(
            circle at 30% 23%,
            #98DEA6,
            #55C685 48%,
            #267F65
        );

    animation-duration:
        6.2s;

    animation-delay:
        -1.8s;
}

.planet3 {
    width: 63px;
    height: 63px;

    right: 45%;
    top: 59%;

    background:

        radial-gradient(
            circle at 34% 26%,
            #C1F6ED,
            #3FD0C9 45%,
            #18766F
        );

    animation-duration:
        5.1s;
}

.planet4 {
    width: 29px;
    height: 29px;

    right: 51%;
    top: 18%;

    background:
        var(--greenBright);

    animation-duration:
        4.2s;

    box-shadow:
        0 0 24px
        rgba(89,225,141,.35);
}

@keyframes planetFloat {
    from {
        transform:
            translate3d(0,-7px,0)
            scale(.98);
    }

    to {
        transform:
            translate3d(10px,11px,0)
            scale(1.04);
    }
}

.particle {
    position: absolute;

    width: 7px;
    height: 7px;

    border-radius: 50%;

    background:
        var(--mint);

    animation:
        particlePulse
        3s ease-in-out
        infinite;
}

.particle1 {
    right: 52%;
    top: 40%;
}

.particle2 {
    right: 5%;
    top: 31%;

    animation-delay:
        -1s;
}

.particle3 {
    right: 33%;
    bottom: 8%;

    animation-delay:
        -2s;
}

@keyframes particlePulse {
    0%,
    100% {
        opacity: .18;

        transform:
            scale(.7);
    }

    50% {
        opacity: .9;

        transform:
            scale(1.4);
    }
}


/* =========================================================
PROJECT PANEL
========================================================= */

.panel-projects {
    display: flex;
    flex-direction: column;

    justify-content:
        space-between;
}

.project-preview {
    display: grid;

    gap: 7px;
}

.preview-line {
    padding-top: 8px;

    display: flex;

    justify-content:
        space-between;

    gap: 12px;

    border-top:
        1px solid
        var(--line);

    font-size: .67rem;
}

.preview-line strong {
    color:
        var(--text);
}

.preview-line span {
    color:
        var(--muted2);
}


/* =========================================================
SKILLS
========================================================= */

.panel-skills {
    display: flex;
    flex-direction: column;

    justify-content:
        space-between;
}

.skill-preview {
    display: flex;
    flex-wrap: wrap;

    gap: 6px;
}

.skill-preview span {
    padding:
        6px 9px;

    border:
        1px solid
        var(--line);

    border-radius:
        999px;

    color:
        var(--muted);

    font-size: .61rem;

    font-weight: 720;
}


/* =========================================================
SELECTED WORK
========================================================= */

.panel-gallery {
    display: flex;
    flex-direction: column;

    justify-content:
        space-between;
}

.thumb-strip {
    height: 38%;

    min-height: 82px;

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 7px;
}

.thumb {
    position: relative;

    overflow: hidden;

    border:
        1px solid
        var(--line);

    border-radius: 11px;

    background:
        #07393E;
}

.thumb img {
    width: 100%;
    height: 100%;

    object-fit: cover;

    transition:
        transform .35s ease;
}

.panel-gallery:hover
.thumb img {
    transform:
        scale(1.06);
}


/* =========================================================
MINI PROJECTS PANEL
========================================================= */

.panel-mini {
    display: flex;
    flex-direction: column;

    justify-content:
        space-between;
}

.mini-preview {
    display: grid;

    gap: 7px;
}

.mini-preview-row {
    padding-top: 8px;

    display: flex;

    align-items: center;

    justify-content:
        space-between;

    border-top:
        1px solid
        var(--line);

    color:
        var(--muted);

    font-size: .63rem;
}

.mini-preview-row strong {
    color:
        var(--text);
}


/* =========================================================
SECTION 04 — EXPANDED PANEL / OPEN-CLOSE ANIMATION
Backdrop, expansion shell, flying title, close button and open-panel visuals.
========================================================= */

.expansion-backdrop {
    position: fixed;

    inset: 0;

    z-index: 4990;

    background:
        rgba(1,29,33,.72);

    backdrop-filter:
        blur(13px);

    -webkit-backdrop-filter:
        blur(13px);

    opacity: 0;

    transition:
        opacity .4s ease;
}

.expansion-backdrop.open {
    opacity: 1;
}


/* =========================================================
EXPANDING PANEL
========================================================= */

.expansion {
    position: fixed;

    z-index: 5000;

    overflow: hidden;

    border:
        1px solid
        rgba(193,246,237,.18);

    background:

        radial-gradient(
            circle at 85% 0%,
            rgba(46,175,125,.16),
            transparent 34%
        ),

        linear-gradient(
            145deg,
            #064149,
            #07434A
        );

    box-shadow:
        0 40px 110px
        rgba(0,20,24,.58);

    will-change:
        left,
        top,
        width,
        height,
        border-radius;

    transition:

        left .62s
        cubic-bezier(.18,.8,.2,1),

        top .62s
        cubic-bezier(.18,.8,.2,1),

        width .62s
        cubic-bezier(.18,.8,.2,1),

        height .62s
        cubic-bezier(.18,.8,.2,1),

        border-radius .62s
        cubic-bezier(.18,.8,.2,1);
}


/* =========================================================
BLURRED TITLE BACKGROUND
========================================================= */

.expanded-title-shield {
    position: absolute;

    z-index: 5050;

    top: 0;
    left: 0;
    right: 0;

    height: 124px;

    pointer-events: none;

    opacity: 0;

    background:

        linear-gradient(
            180deg,
            rgba(5,65,72,.96) 0%,
            rgba(5,65,72,.91) 66%,
            rgba(5,65,72,.55) 86%,
            rgba(5,65,72,0) 100%
        );

    backdrop-filter:
        blur(24px)
        saturate(125%);

    -webkit-backdrop-filter:
        blur(24px)
        saturate(125%);

    transition:
        opacity .25s ease .32s;
}

.expansion.content-visible
.expanded-title-shield {
    opacity: 1;
}


/* =========================================================
FLYING TITLE
========================================================= */

.flying-title {
    position: fixed;

    z-index: 5100;

    margin: 0;

    pointer-events: none;

    color:
        var(--text);

    font-weight: 900;

    line-height: .91;

    letter-spacing: -.064em;

    transform-origin:
        top left;

    will-change:
        left,
        top,
        font-size,
        width;

    transition:

        left .62s
        cubic-bezier(.18,.8,.2,1),

        top .62s
        cubic-bezier(.18,.8,.2,1),

        font-size .62s
        cubic-bezier(.18,.8,.2,1),

        line-height .62s
        cubic-bezier(.18,.8,.2,1),

        width .62s
        cubic-bezier(.18,.8,.2,1);
}

.flying-title.compact
.title-line {
    display: inline;
}

.flying-title[data-key="profile"].compact
.title-line:not(:last-child)::after {
    content: " ";
}

.flying-title[data-key="projects"].compact
.title-line:not(:last-child)::after {
    content: " ";
}

.flying-title[data-key="projects"].compact
.title-line:last-child::after {
    content: ".";
}

.flying-title[data-key="skills"].compact
.title-line::after {
    content: ". ";
}

.flying-title[data-key="gallery"].compact
.title-line::after {
    content: ". ";
}

.flying-title[data-key="mini"].compact
.title-line:not(:last-child)::after {
    content: " ";
}

.flying-title[data-key="mini"].compact
.title-line:last-child::after {
    content: ".";
}


/* =========================================================
OPEN PANEL CONTENT
========================================================= */

.expanded-content {
    position: absolute;

    inset: 0;

    overflow-y: auto;
    overflow-x: hidden;

    padding:
        145px
        clamp(20px,3.6vw,55px)
        40px;

    opacity: 0;

    transform:
        translateY(18px);

    transition:
        opacity .28s ease .39s,
        transform .4s ease .35s;
}

.expansion.content-visible
.expanded-content {
    opacity: 1;

    transform:
        translateY(0);
}

.expanded-content::-webkit-scrollbar {
    width: 7px;
}

.expanded-content::-webkit-scrollbar-track {
    background: transparent;
}

.expanded-content::-webkit-scrollbar-thumb {
    background:
        rgba(193,246,237,.32);

    border-radius: 10px;
}


/* =========================================================
CLEAN REVERSE / CLOSE ANIMATION
========================================================= */

.expansion.is-closing .expanded-content {
    opacity: 0;

    transform: translateY(8px);

    transition:
        opacity .15s ease,
        transform .15s ease;

    pointer-events: none;
}

.expansion.is-closing .expanded-title-shield {
    opacity: 0;

    transition:
        opacity .14s ease;
}

.expansion.is-closing .expanded-blob,
.expansion.is-closing .expanded-blob-small {
    opacity: 0;

    transition:
        opacity .14s ease;
}

.expansion.geometry-closing .expanded-content,
.expansion.geometry-closing .expanded-title-shield,
.expansion.geometry-closing .expanded-blob,
.expansion.geometry-closing .expanded-blob-small {
    visibility: hidden;
}

.panel.panel-return-target {
    opacity: 0 !important;

    pointer-events: none;
}


/* =========================================================
OPEN HEADER
========================================================= */

.expanded-header-row {
    position: relative;

    z-index: 2;

    margin-bottom: 28px;
}

.expanded-kicker {
    color:
        var(--greenBright);

    font-size: .72rem;

    font-weight: 900;

    letter-spacing: .14em;

    text-transform: uppercase;
}

.expanded-description {
    max-width: 850px;

    margin-top: 9px;

    color:
        var(--muted);

    font-size:
        clamp(.96rem,1.15vw,1.07rem);

    line-height: 1.7;
}


/* =========================================================
CLOSE
========================================================= */

.expansion-close {
    position: fixed;

    z-index: 5200;

    width: 48px;
    height: 48px;

    display: flex;

    align-items: center;
    justify-content: center;

    border:
        1px solid
        rgba(193,246,237,.20);

    border-radius: 50%;

    background:
        rgba(2,53,60,.82);

    color: white;

    cursor: pointer;

    backdrop-filter:
        blur(14px);

    opacity: 0;

    transform:
        scale(.8);

    transition:
        opacity .25s ease .39s,
        transform .35s ease .37s,
        background .2s ease;
}

.expansion-close.visible {
    opacity: 1;

    transform:
        scale(1);
}

.expansion-close:hover {
    background:
        var(--green);
}


/* =========================================================
OPEN PANEL MOVING FORMS
========================================================= */

.expanded-blob {
    position: absolute;

    width: 350px;
    height: 275px;

    right: -90px;
    top: -75px;

    opacity: .14;

    pointer-events: none;

    background:

        radial-gradient(
            circle at 30% 25%,
            #C1F6ED,
            #58DE8A 43%,
            #2EAF7D 69%,
            #176B57
        );

    border-radius:
        55% 45% 60% 40%
        /
        44% 58% 42% 56%;

    animation:
        openBlob
        8s ease-in-out
        infinite alternate;
}

.expanded-blob-small {
    position: absolute;

    width: 82px;
    height: 82px;

    right: 20%;
    top: 96px;

    opacity: .11;

    background:
        var(--aqua);

    border-radius: 50%;

    animation:
        openBlobSmall
        6.2s ease-in-out
        infinite alternate;
}

@keyframes openBlob {
    from {
        transform:
            translate(0,0)
            rotate(-4deg)
            scale(1);
    }

    to {
        transform:
            translate(-32px,25px)
            rotate(6deg)
            scale(1.08);

        border-radius:
            40% 60% 48% 52%
            /
            58% 40% 60% 42%;
    }
}

@keyframes openBlobSmall {
    from {
        transform:
            translate(0,0)
            scale(.9);
    }

    to {
        transform:
            translate(-44px,30px)
            scale(1.15);
    }
}

/* =========================================================
SECTION 05 — COVER-FLOW CARDS / SIZE / SPACING / MOTION
========================================================= */

.flow-section {
    position: relative;

    z-index: 3;
}

.flow-help {
    margin-bottom: 10px;

    color: var(--muted2);

    font-size: .78rem;

    text-align: center;
}

.cover-flow {
    --card-width: clamp(300px, 27vw, 360px);

    display: flex;
    align-items: center;

    gap: clamp(12px, 1.5vw, 20px);

    overflow-x: auto;
    overflow-y: visible;

    padding:
        22px
        calc((100% - var(--card-width)) / 2)
        20px;

    scroll-snap-type: x mandatory;

    scroll-padding-inline:
        calc((100% - var(--card-width)) / 2);

    scroll-behavior: smooth;

    overscroll-behavior-x: contain;

    scrollbar-width: none;

    -webkit-overflow-scrolling: touch;

    perspective: 1450px;

    touch-action: pan-x;

    contain: layout style;
}

.cover-flow::-webkit-scrollbar {
    display: none;
}

.flow-card {
    position: relative;

    flex: 0 0 var(--card-width);

    width: var(--card-width);

    aspect-ratio: 2 / 3;

    min-width: 0;

    scroll-snap-align: center;

    scroll-snap-stop: always;

    overflow: hidden;

    padding: clamp(24px, 2vw, 31px);

    display: flex;
    flex-direction: column;

    border:
        1px solid
        rgba(193,246,237,.18);

    border-radius: 28px;

    background:

        radial-gradient(
            circle at 85% 8%,
            rgba(89,225,141,.08),
            transparent 36%
        ),

        linear-gradient(
            145deg,
            rgba(193,246,237,.05),
            rgba(46,175,125,.025)
        ),

        rgba(10,76,81,.96);

    box-shadow:
        0 20px 45px
        rgba(0,25,28,.20);

    transform-style: preserve-3d;

    transform-origin: center center;

    opacity: .58;

    transition:
        opacity .10s linear,
        filter .10s linear,
        border-color .20s ease,
        box-shadow .20s ease;

    will-change:
        transform,
        opacity,
        filter;

    backface-visibility: hidden;

    -webkit-backface-visibility: hidden;
}

.flow-card.is-center {
    border-color:
        rgba(89,225,141,.48);

    box-shadow:
        0 30px 72px
        rgba(0,24,27,.32),
        0 0 0 1px
        rgba(89,225,141,.07);
}

.card-label {
    color: var(--greenBright);

    font-size: .79rem;

    font-weight: 900;

    letter-spacing: .095em;

    line-height: 1.35;

    text-transform: uppercase;
}

.flow-card h3 {

}

    line-height: 1.62;
}

.flow-card .tags {

}

.skill-heading {

    align-items: center;

    gap: 14px;
}

.card-icon {

/* =========================================================

}

.case-callout {
    margin-top: 18px;

    padding: 16px 18px;

    border-left:
        3px solid var(--greenBright);

    border-radius:
        0 14px 14px 0;

    background:
        rgba(89,225,141,.07);

    color:

    font-size: .94rem;

    line-height: 1.58;
}

.case-figure-wide {
    margin-top:
        clamp(20px,3vw,34px);
}

.case-gif-grid {
    margin-top:
        clamp(20px,3vw,34px);

    display: grid;

    grid-template-columns:
        minmax(0,1.2fr)
        minmax(280px,.8fr);

    gap:
        clamp(18px,2.4vw,30px);

    align-items: stretch;
}

.case-gif-grid .case-media {
    display: flex;

    flex-direction: column;

    justify-content: center;
}

.case-gif-grid .case-media img {
    max-height: 680px;
}


/* =========================================================
INTERACTIVE CONSENSUS GRAPH + MAP
========================================================= */

.consensus-interactive {
    display: grid;

    grid-template-columns:
        minmax(370px,.78fr)
        minmax(0,1.22fr);

    gap:
        clamp(22px,3vw,42px);

    align-items: stretch;
}

.consensus-chart {
    padding:
        clamp(24px,3vw,38px);

    border:
        1px solid rgba(193,246,237,.14);

    border-radius: 28px;

    background:
        rgba(6,76,81,.66);
}

.consensus-chart h3 {
    margin:
        0 0 6px;

    font-size:
        clamp(1.45rem,2vw,2rem);
}

.consensus-chart > p {
    margin:
        0 0 25px;

    color:
        var(--muted);

    line-height: 1.55;
}

.consensus-bars {
    display: grid;

    gap: 11px;
}

.consensus-bar {
    width: 100%;

    display: grid;

    grid-template-columns:
        72px
        minmax(0,1fr)
        56px;

    align-items: center;

    gap: 10px;

    padding:
        8px 10px;

    border:
        1px solid transparent;

    border-radius: 14px;

    background:
        transparent;

    color:
        var(--text);

    cursor: pointer;

    text-align: left;

    transition:
        background .2s ease,
        border-color .2s ease,
        transform .2s ease;
}

.consensus-bar:hover,
.consensus-bar.active {
    background:
        rgba(193,246,237,.065);

    border-color:
        rgba(89,225,141,.19);

    transform:
        translateX(3px);
}

.consensus-bar-label {
    font-size: .84rem;

    font-weight: 820;
}

.consensus-bar-track {
    height: 22px;

    overflow: hidden;

    border-radius: 999px;

    background:
        rgba(193,246,237,.08);
}

.consensus-bar-fill {
    display: block;

    height: 100%;

    width:
        var(--bar-width);

    min-width: 8px;

    border-radius: inherit;

    background:
        linear-gradient(
            90deg,
            var(--green),
            var(--greenBright)
        );

    transform-origin: left center;

    transition:
        filter .2s ease,
        transform .2s ease;
}

.consensus-bar:not(.active)
.consensus-bar-fill {
    filter:
        saturate(.55)
        brightness(.82);
}

.consensus-bar.active
.consensus-bar-fill {
    transform:
        scaleY(1.12);
}

.consensus-bar-count {
    color:
        var(--mint);

    font-size: .82rem;

    font-weight: 850;

    text-align: right;
}

.consensus-map-card {
    overflow: hidden;

    display: flex;

    flex-direction: column;

    border:
        1px solid rgba(89,225,141,.24);

    border-radius: 28px;

    background:
        rgba(255,255,255,.97);
}

.consensus-map-card img {
    width: 100%;

    min-height: 420px;

    max-height: 670px;

    object-fit: contain;

    cursor: zoom-in;
}

.consensus-map-copy {
    padding:
        19px 22px 23px;

    background:
        rgba(4,61,67,.98);
}

.consensus-map-copy h3 {
    margin: 0;

    font-size:
        clamp(1.3rem,1.8vw,1.8rem);
}

.consensus-map-copy p {
    margin:
        10px 0 0;

    color:
        var(--muted);

    line-height: 1.6;
}

.case-conclusion {
    padding:
        clamp(34px,5vw,64px);

    border:
        1px solid rgba(89,225,141,.20);

    border-radius: 34px;

    background:

        radial-gradient(
            circle at 90% 20%,
            rgba(89,225,141,.13),
            transparent 34%
        ),

        rgba(6,76,81,.70);
}

.case-conclusion h2 {
    max-width: 900px;

    margin: 0;

    font-size:
        clamp(2.5rem,4.4vw,4.8rem);

    line-height: .98;
}

.case-conclusion p {
    max-width: 1000px;

    margin:
        22px 0 0;

    color:
        rgba(229,247,243,.92);

    font-size:
        clamp(1.06rem,1.3vw,1.3rem);

    line-height: 1.72;
}

const panels =
document.querySelectorAll(
    "[data-panel]"
);

const backdrop =
document.getElementById(
    "expansionBackdrop"
);

const lightbox =
document.getElementById(
    "lightbox"
);

const lightboxImage =
document.getElementById(
    "lightboxImage"
);

const lightboxClose =
document.getElementById(
    "lightboxClose"
);

let activePanel =
null;

let expansion =
null;

let flyingTitle =
null;

let closeButton =
null;

let activeCaseStudy =
null;

let caseStudyObserver =
null;


/* =========================================================
EXPANDED TITLE SIZE
========================================================= */

function getExpandedTitleSize(
    key,
    originalSize
) {

    const mobile =
        window.innerWidth <= 800;

    if (mobile) {

        if (key === "profile") {
            return Math.min(
                Math.max(
                    originalSize * .73,
                    31
                ),
                38
            );
        }

        if (key === "projects") {
            return Math.min(
                Math.max(
                    originalSize * .58,
                    25
                ),
                32
            );
        }

        if (key === "skills") {
            return Math.min(
                Math.max(
                    originalSize * .76,
                    20
                ),
                27
            );
        }

        if (
            key === "gallery"
            ||
            key === "mini"
        ) {
            return Math.min(
                Math.max(
                    originalSize * .70,
                    23
                ),
                30
            );
        }
    }

    else {

        if (key === "profile") {
            return Math.min(
                Math.max(
                    originalSize * 1.02,
                    100
                ),
                126
            );
        }

        if (key === "projects") {
            return Math.min(
                Math.max(
                    originalSize * 1.22,
                    96
                ),
                116
            );
        }

        if (key === "skills") {
            return Math.min(
                Math.max(
                    originalSize * 1.46,
                    72
                ),
                84
            );
        }

        if (key === "gallery") {
            return Math.min(
                Math.max(
                    originalSize * 1.30,
                    86
                ),
                102
            );
        }

        if (key === "mini") {
            return Math.min(
                Math.max(
                    originalSize * 1.08,
                    72
                ),
                84
            );
        }
    }

    return 32;
}


function getLeftRailScene(key) {
    return "";
}


/* =========================================================
SECTION 14 — PANEL OPEN / CLOSE JAVASCRIPT
========================================================= */

function openPanel(panel) {

    if (activePanel) {
        return;
    }

    activePanel =
        panel;

    const key =
        panel.dataset.panel;

    const originalTitle =
        panel.querySelector(
            "[data-title]"
        );

    const titleStyle =
        getComputedStyle(
            originalTitle
        );

    const originalFontSize =
        parseFloat(
            titleStyle.fontSize
        );

    backdrop.hidden =
        false;

    requestAnimationFrame(
        () =>
            backdrop.classList.add(
                "open"
            )
    );

    const margin =
        window.innerWidth <= 800
        ? 6
        : 18;

    const finalLeft =
        margin;

    const finalTop =
        margin;

    const finalWidth =
        window.innerWidth
        -
        margin * 2;

    const finalHeight =
        window.innerHeight
        -
        margin * 2;

    expansion =
        document.createElement(
            "div"
        );

    expansion.className =
        `expansion expansion-${key} fast-shell`;

    expansion.style.left =
        `${finalLeft}px`;

    expansion.style.top =
        `${finalTop}px`;

    expansion.style.width =
        `${finalWidth}px`;

    expansion.style.height =
        `${finalHeight}px`;

    expansion.style.borderRadius =
        window.innerWidth <= 800
        ? "23px"
        : "32px";

    expansion.innerHTML = `

        <div class="expanded-blob"></div>

        <div class="expanded-blob-small"></div>

        ${
            key === "profile"

            ? `<div class="planet-system profile-scatter-system">${panel.querySelector(".planet-system")?.innerHTML || ""}</div>`

            : ""
        }

        <div class="expanded-title-shield"></div>

        <div class="expanded-content">

            <div class="expanded-header-row">

                <div>

                    <div class="expanded-kicker">
                        ${content[key].kicker}
                    </div>

                    <div class="expanded-description">
                        ${content[key].description}
                    </div>

                    ${getLeftRailScene(key)}

                </div>

            </div>

            ${content[key].html}

        </div>
    `;

    document.body.appendChild(
        expansion
    );


    const finalTitleLeft =
        finalLeft
        +
        (
            window.innerWidth <= 800

            ? 18

            : Math.max(
                42,
                window.innerWidth * .027
            )
        );


    const finalTitleSize =
        getExpandedTitleSize(
            key,
            originalFontSize
        );


    const titleLineCount =
        originalTitle
        .querySelectorAll(
            ".title-line"
        )
        .length
        ||
        1;


    const estimatedTitleHeight =
        finalTitleSize
        *
        1.04
        *
        titleLineCount;


    const finalTitleTop =
        window.innerWidth <= 800

        ? finalTop + 21

        :

        (
            key === "profile"

            ?

            finalTop
            +
            finalHeight * .49
            -
            estimatedTitleHeight / 2

            :

            finalTop
            +
            finalHeight * .42
            -
            estimatedTitleHeight / 2
        );


    const finalTitleWidth =
        window.innerWidth <= 800

        ?

        Math.min(
            finalWidth * .78,
            1100
        )

        :

        Math.min(
            finalWidth * .335,
            625
        );


    if (
        window.innerWidth > 800
    ) {

        const titleToCopyGap =

            key === "skills"

            ? 78

            : key === "mini"

            ? 54

            : key === "profile"

            ? 42

            : 38;


        const railCopyTop =
            Math.min(
                finalHeight - 185,

                Math.max(

                    112,

                    (
                        finalTitleTop
                        -
                        finalTop
                    )
                    +
                    estimatedTitleHeight
                    +
                    titleToCopyGap
                )
            );


        expansion.style.setProperty(
            "--rail-copy-top",
            `${railCopyTop}px`
        );
    }


    flyingTitle =
        document.createElement(
            originalTitle.tagName
        );

    flyingTitle.className =
        "flying-title fast-title compact";

    flyingTitle.dataset.key =
        key;

    flyingTitle.innerHTML =
        originalTitle.innerHTML;

    flyingTitle.style.left =
        `${finalTitleLeft}px`;

    flyingTitle.style.top =
        `${finalTitleTop}px`;

    flyingTitle.style.width =
        `${finalTitleWidth}px`;

    flyingTitle.style.fontSize =
        `${finalTitleSize}px`;

    flyingTitle.style.lineHeight =
        "1.04";

    document.body.appendChild(
        flyingTitle
    );


    originalTitle.style.opacity =
        "0";

    panel.style.opacity =
        "0";


    closeButton =
        document.createElement(
            "button"
        );

    closeButton.className =
        "expansion-close";

    closeButton.type =
        "button";

    closeButton.setAttribute(
        "aria-label",
        "Close expanded section"
    );

    closeButton.setAttribute(
        "title",
        "Close section"
    );

    closeButton.innerHTML =
        `<i class="fa-solid fa-xmark" aria-hidden="true"></i>`;

    document.body.appendChild(
        closeButton
    );

    positionCloseButton();


    closeButton.addEventListener(

        ||
        !expansion

        return;
    }


    const panel =
        activePanel;


    const originalTitle =
        panel.querySelector(
            "[data-title]"
        );


    const view =
        activeCaseStudy;


    if (view) {

        if (
            view._caseStoryCleanup
        ) {

            view._caseStoryCleanup();

            view._caseStoryCleanup =
                null;
        }


        if (
            view._caseStoryObserver
        ) {

            view._caseStoryObserver.disconnect();

            view._caseStoryObserver =
                null;
        }


        view.classList.remove(
            "open"
        );

        view.remove();

        activeCaseStudy =
            null;
    }


    if (caseStudyObserver) {

        caseStudyObserver.disconnect();

        caseStudyObserver =
            null;
    }


    document.body.classList.remove(
        "research-case-open"
    );


    expansion.classList.remove(
        "case-study-active"
    );


    expansion.classList.add(
        "fast-closing"
    );


    if (flyingTitle) {

        flyingTitle.classList.remove(
            "case-study-hidden"
        );

        flyingTitle.classList.add(
            "fast-closing"
        );
    }


    closeButton?.classList.remove(
        "visible"
    );


    backdrop.classList.remove(
        "open"
    );


    const finishClose =
        () => {

            panel.style.opacity =
                "";

            if (originalTitle) {

                originalTitle.style.opacity =
                    "";
            }

            expansion?.remove();

            flyingTitle?.remove();

            closeButton?.remove();

            backdrop.hidden =
                true;

            expansion =
                null;

            flyingTitle =
                null;

            closeButton =
                null;

/* =========================================================
SECTION 15 — COVER-FLOW JAVASCRIPT — CARD MOVEMENT

MAIN MOVEMENT SETTINGS

ROTATION_MAX_DEG
DEPTH_PER_CARD_PX
CENTER_LIFT_Z_PX
SCALE_DROP_PER_CARD
VERTICAL_DROP_PX

Lower values = calmer / flatter motion.
========================================================= */

function initialiseCoverFlows() {

    if (!expansion) {
        return;
    }


    const ROTATION_MAX_DEG =
        9;

    const DEPTH_PER_CARD_PX =
        62;

    const CENTER_LIFT_Z_PX =
        34;

    const SCALE_DROP_PER_CARD =
        0.045;

    const VERTICAL_DROP_PX =
        4;


    expansion
    .querySelectorAll(
        "[data-cover-flow]"
    )
    .forEach(
        track => {


            const cards =
                Array.from(
                    track.querySelectorAll(
                        ".flow-card"
                    )
                );


            if (!cards.length) {
                return;
            }


            const dotsContainer =
                expansion.querySelector(
                    `[data-dots-for="${track.id}"]`
                );


            let dots =
                [];

            let ticking =
                false;

            let closestIndex =
                0;


            function centerCard(
                card,
                smooth = true
            ) {

                const target =
                    card.offsetLeft
                    -
                    (
                        track.clientWidth
                        -
                        card.offsetWidth
                    ) / 2;


                const maxScroll =
                    Math.max(
                        0,
                        track.scrollWidth
                        -
                        track.clientWidth
                    );


                track.scrollTo({

                    left:
                        Math.min(
                            maxScroll,
                            Math.max(
                                0,
                                target
                            )
                        ),

                    behavior:
                        smooth
                        ? "smooth"
                        : "auto"

                });
            }


            track._centerCard =
                centerCard;


            if (dotsContainer) {

                dotsContainer.innerHTML =
                    "";


                cards.forEach(
                    (card, index) => {

                        const dot =
                            document.createElement(
                                "button"
                            );

                        dot.className =
                            "flow-dot";

                        dot.type =
                            "button";

                        dot.setAttribute(
                            "aria-label",
                            `Go to card ${index + 1}`
                        );


                        dot.addEventListener(

                            "click",

                            event => {

                                event.stopPropagation();

                                centerCard(
                                    card,
                                    true
                                );
                            }
                        );


                        dotsContainer.appendChild(
                            dot
                        );

                        dots.push(
                            dot
                        );
                    }
                );
            }


            function updateFlow() {


                const viewportCenter =
                    track.scrollLeft
                    +
                    track.clientWidth / 2;


                const styles =
                    getComputedStyle(
                        track
                    );


                const gap =
                    parseFloat(
                        styles.columnGap
                        ||
                        styles.gap
                        ||
                        "0"
                    )
                    ||
                    0;


                const cardSpacing =
                    cards[0].offsetWidth
                    +
                    gap;


                let nearestDistance =
                    Infinity;


                closestIndex =
                    0;


                cards.forEach(
                    (card, index) => {


                        const cardCenter =
                            card.offsetLeft
                            +
                            card.offsetWidth / 2;


                        const rawOffset =
                            (
                                cardCenter
                                -
                                viewportCenter
                            )
                            /
                            Math.max(
                                cardSpacing,
                                1
                            );


                        const offset =
                            Math.max(
                                -2.25,
                                Math.min(
                                    2.25,
                                    rawOffset
                                )
                            );


                        const absOffset =
                            Math.abs(
                                offset
                            );


                        const distance =
                            Math.abs(
                                cardCenter
                                -
                                viewportCenter
                            );


                        if (
                            distance
                            <
                            nearestDistance
                        ) {

                            nearestDistance =
                                distance;

                            closestIndex =
                                index;
                        }


                        const centreStrength =
                            Math.max(
                                0,
                                1
                                -
                                Math.min(
                                    absOffset,
                                    1
                                )
                            );


                        const translateZ =
                            -
                            (
                                DEPTH_PER_CARD_PX
                                *
                                absOffset
                            )
                            +
                            (
                                CENTER_LIFT_Z_PX
                                *
                                centreStrength
                            );


                        const scale =
                            1.03
                            -
                            Math.min(
                                absOffset,
                                2
                            )
                            *
                            SCALE_DROP_PER_CARD;


                        const rotateY =
                            Math.max(
                                -ROTATION_MAX_DEG,

                                Math.min(

                                    ROTATION_MAX_DEG,

                                    offset * -6.5
                                )
                            );


                        const translateY =
                            Math.min(
                                absOffset,
                                2
                            )
                            *
                            VERTICAL_DROP_PX;


                        const opacity =
                            Math.max(
                                0.52,
                                1
                                -
                                Math.min(
                                    absOffset,
                                    2.25
                                )
                                *
                                0.19
                            );


                        const brightness =
                            Math.max(
                                0.82,
                                1
                                -
                                Math.min(
                                    absOffset,
                                    2
                                )
                                *
                                0.08
                            );


                        card.style.transform =

                            `translate3d(0, ${translateY}px, ${translateZ}px) `
                            +
                            `rotateY(${rotateY}deg) scale(${scale})`;


                        card.style.opacity =
                            opacity.toFixed(3);


                        card.style.filter =

                            `brightness(${brightness.toFixed(3)}) `
                            +
                            `saturate(${(0.92 + centreStrength * 0.08).toFixed(3)})`;


                        card.style.zIndex =
                            String(
                                Math.round(
                                    100
                                    -
                                    absOffset * 18
                                )
                            );
                    }
                );


                cards.forEach(
                    (card, index) => {

                        const centered =
                            index ===
                            closestIndex;


                        card.classList.toggle(
                            "is-center",
                            centered
                        );


                        card.setAttribute(

                            "aria-current",

                            centered
                            ? "true"
                            : "false"
                        );
                    }
                );


                dots.forEach(
                    (dot, index) => {

                        dot.classList.toggle(
                            "active",
                            index === closestIndex
                        );
                    }
                );


                ticking =
                    false;
            }


            function requestUpdate() {

                if (ticking) {
                    return;
                }

                ticking =
                    true;

                requestAnimationFrame(
                    updateFlow
                );
            }


            track.addEventListener(
                "scroll",
                requestUpdate,
                {
                    passive: true
                }
            );


            cards.forEach(
                card => {

                    card.addEventListener(

                        "click",

                        event => {

                            if (
                                card.classList.contains(
                                    "is-center"
                                )
                            ) {
                                return;
                            }


                            event.preventDefault();

                            event.stopPropagation();


                            centerCard(
                                card,
                                true
                            );
                        }
                    );
                }
            );


            requestAnimationFrame(

                () => {

                    centerCard(
                        cards[0],
                        false
                    );

                    requestAnimationFrame(
                        updateFlow
                    );
                }
            );


            setTimeout(
                requestUpdate,
                120
            );
        }
    );
}


/* =========================================================
SECTION 16 — LIGHTBOX JAVASCRIPT
========================================================= */

function bindGalleryItems() {

    if (!expansion) {
        return;
    }


    expansion
    .querySelectorAll(
        ".gallery-item"
    )
    .forEach(

        item => {

            if (
                item.dataset.bound
            ) {
                return;
            }


            item.dataset.bound =
                "true";


            item.addEventListener(

                "click",

                event => {


                    if (
                        !item.classList.contains(
                            "is-center"
                        )
                    ) {

                        const track =
                            item.closest(
                                "[data-cover-flow]"
                            );


                        if (
                            track
                            &&
                            typeof track._centerCard
                            === "function"
                        ) {

                            track._centerCard(
                                item,
                                true
                            );
                        }

                        return;
                    }


                    event.stopPropagation();


                    lightboxImage.src =
                        item.dataset.image;


                    lightbox.classList.add(
                        "open"
                    );
                }
            );
        }
    );
}

/* =========================================================
CASE STUDY LAUNCHERS
========================================================= */

function bindCaseStudyLaunchers() {

    if (!expansion) {
        return;
    }


    expansion
    .querySelectorAll(
        "[data-case-study]"
    )
    .forEach(

        card => {

            if (
                card.dataset.caseBound
                ===
                "true"
            ) {
                return;
            }


            card.dataset.caseBound =
                "true";


            const activate =
                event => {


                    if (
                        !card.classList.contains(
                            "is-center"
                        )
                    ) {
                        return;
                    }


                    event.preventDefault();

                    event.stopPropagation();


                    openCaseStudy(
                        card.dataset.caseStudy
                    );
                };


            card.addEventListener(
                "click",
                activate
            );


            card.addEventListener(

                "keydown",

                event => {

                    if (
                        event.key === "Enter"
                        ||
                        event.key === " "
                    ) {

                        activate(
                            event
                        );
                    }
                }
            );
        }
    );
}


/* =========================================================
OPEN CASE STUDY
========================================================= */

function openCaseStudy(key) {

    if (
        !expansion
        ||
        activeCaseStudy
        ||
        ![
            "conservation-policy",
            "urban-heat"
        ].includes(
            key
        )
    ) {
        return;
    }


    activeCaseStudy =
        document.createElement(
            "div"
        );


    activeCaseStudy.className =
        "case-study-view";


    activeCaseStudy.setAttribute(
        "role",
        "document"
    );


    activeCaseStudy.dataset.caseStudy =
        key;


    activeCaseStudy.innerHTML =

        key === "urban-heat"

        ? getUrbanHeatCaseStudyHTML()

        : getConservationCaseStudyHTML();


    expansion.appendChild(
        activeCaseStudy
    );


    expansion.classList.add(
        "case-study-active"
    );


    document.body.classList.add(
        "research-case-open"
    );


    closeButton?.classList.remove(
        "visible"
    );


    if (flyingTitle) {

        flyingTitle.classList.add(
            "case-study-hidden"
        );
    }


    requestAnimationFrame(
        () => {

            activeCaseStudy.classList.add(
                "open"
            );
        }
    );


    const back =
        activeCaseStudy.querySelector(
            "[data-case-back]"
        );


    if (back) {

        back.addEventListener(

            "click",

            event => {

                event.preventDefault();

                event.stopPropagation();

                closeCaseStudy();
            }
        );
    }


    const caseClose =
        activeCaseStudy.querySelector(
            "[data-case-close]"
        );


    if (caseClose) {

        caseClose.addEventListener(

            "click",

            event => {

                event.preventDefault();

                event.stopPropagation();

                closeActivePanel();
            }
        );
    }


    hydrateCaseStudyMedia(
        activeCaseStudy
    );


    bindCaseStudyInteractions(
        activeCaseStudy
    );


    bindCaseScrollytelling(
        activeCaseStudy
    );


    activeCaseStudy.scrollTop =
        0;
}


/* =========================================================
CLOSE CASE STUDY
========================================================= */

function closeCaseStudy() {

    if (!activeCaseStudy) {
        return;
    }


    const view =
        activeCaseStudy;


    if (
        view._caseStoryCleanup
    ) {

        view._caseStoryCleanup();

        view._caseStoryCleanup =
            null;
    }


    if (
        view._caseStoryObserver
    ) {

        view._caseStoryObserver.disconnect();

        view._caseStoryObserver =
            null;
    }


    if (caseStudyObserver) {

        caseStudyObserver.disconnect();

        caseStudyObserver =
            null;
    }


    view.classList.remove(
        "open"
    );


    expansion?.classList.remove(
        "case-study-active"
    );


    document.body.classList.remove(
        "research-case-open"
    );


    if (flyingTitle) {

        flyingTitle.classList.remove(
            "case-study-hidden"
        );
    }


    setTimeout(
        () => {


            if (
                view.isConnected
            ) {

                view.remove();
            }


            if (
                activeCaseStudy
                ===
                view
            ) {

                activeCaseStudy =
                    null;
            }


            closeButton?.classList.add(
                "visible"
            );


            positionCloseButton();

        },
        140
    );
}


/* =========================================================
CASE STUDY MEDIA
========================================================= */

function hydrateCaseStudyMedia(view) {

    const images =
        Array.from(
            view.querySelectorAll(
                "img[data-src]"
            )
        );


    const loadImage =
        img => {


            const source =
                img.dataset.src;


            if (!source) {
                return;
            }


            img.src =
                source;


            img.removeAttribute(
                "data-src"
            );
        };


    if (
        !(
            "IntersectionObserver"
            in
            window
        )
    ) {

        images.forEach(
            loadImage
        );

        return;
    }


    caseStudyObserver =
        new IntersectionObserver(

            entries => {


                entries.forEach(
                    entry => {


                        if (
                            !entry.isIntersecting
                        ) {
                            return;
                        }


                        loadImage(
                            entry.target
                        );


                        caseStudyObserver?.unobserve(
                            entry.target
                        );
                    }
                );
            },

            {
                root:
                    view,

                rootMargin:
                    "260px 0px",

                threshold:
                    0.01
            }
        );


    images.forEach(
        img => {

            caseStudyObserver.observe(
                img
            );
        }
    );
}


/* =========================================================
SCROLLYTELLING
========================================================= */

function bindCaseScrollytelling(view) {

    const steps =
        Array.from(
            view.querySelectorAll(
                "[data-story-step]"
            )
        );


    const scenes =
        Array.from(
            view.querySelectorAll(
                ".case-story-scene[data-scene]"
            )
        );


    const progressDots =
        Array.from(
            view.querySelectorAll(
                "[data-story-jump]"
            )
        );


    const progressCount =
        view.querySelector(
            "[data-story-progress-count]"
        );


    const progressCurrent =
        view.querySelector(
            "[data-story-progress-current]"
        );


    const topbar =
        view.querySelector(
            ".case-study-topbar"
        );


    if (
        !steps.length
        ||
        !scenes.length
    ) {
        return;
    }


    const sceneLabels = {

        ecology:
            "01 · Pollinator ecology",

        policy:
            "02 · Policy setup",

        tradeoff:
            "03 · Habitat & connectivity",

        targeting:
            "04 · Same-budget experiment",

        participation:
            "05 · Participation",

        spatial:
            "06 · Spatial allocation",

        consensus:
            "07 · Consensus",

        robustness:
            "08 · Robustness",

        "heat-baseline":
            "01 · Baseline heat",

        "heat-gapfill":
            "02 · Gap-filled LST",

        "heat-tree":
            "03 · Tree priority",

        "heat-urgency":
            "04 · Heat priority",

        "heat-scale":
            "05 · 300 m context",

        "heat-final":
            "06 · Final priority",

        "heat-hotspots":
            "07 · Critical hotspots"
    };


    let activeSceneName =
        "";


    let rafId =
        0;


    const storyImages =
        Array.from(
            view.querySelectorAll(
                ".case-story-scene img"
            )
        );


    storyImages.forEach(
        img => {


            img.loading =
                "eager";


            img.decoding =
                "async";


            const source =

                img.getAttribute(
                    "src"
                )

                ||

                img.dataset.sceneSrc

                ||

                img.dataset.src;


            if (!source) {
                return;
            }


            if (
                !img.getAttribute(
                    "src"
                )
            ) {

                img.src =
                    source;
            }


            const preloader =
                new Image();


            preloader.src =
                source;
        }
    );


    const getHeaderOffset =
        () => {


            const height =

                topbar

                ?

                topbar
                .getBoundingClientRect()
                .height

                :

                72;


            return height + 12;
        };


    const getReadingLineY =
        () => {


            const viewRect =
                view.getBoundingClientRect();


            const headerBottom =
                viewRect.top
                +
                getHeaderOffset();


            const visibleBottom =
                Math.min(
                    viewRect.bottom,
                    window.innerHeight
                );


            const usableHeight =
                Math.max(
                    220,
                    visibleBottom
                    -
                    headerBottom
                );


            return (
                headerBottom
                +
                usableHeight * 0.42
            );
        };


    const getActiveStep =
        () => {


            const readingY =
                getReadingLineY();


            for (
                const step
                of
                steps
            ) {


                const rect =
                    step.getBoundingClientRect();


                if (
                    readingY >= rect.top
                    &&
                    readingY < rect.bottom
                ) {

                    return step;
                }
            }


            let nearest =
                steps[0];


            let nearestDistance =
                Infinity;


            for (
                const step
                of
                steps
            ) {


                const rect =
                    step.getBoundingClientRect();


                const centre =
                    rect.top
                    +
                    rect.height / 2;


                const distance =
                    Math.abs(
                        centre
                        -
                        readingY
                    );


                if (
                    distance
                    <
                    nearestDistance
                ) {

                    nearest =
                        step;

                    nearestDistance =
                        distance;
                }
            }


            return nearest;
        };


    const activateScene =
        sceneName => {


            if (
                !sceneName
                ||
                sceneName
                ===
                activeSceneName
            ) {
                return;
            }


            activeSceneName =
                sceneName;


            const activeIndex =
                Math.max(

                    0,

                    steps.findIndex(
                        step =>
                            step.dataset.sceneTarget
                            ===
                            sceneName
                    )
                );


            steps.forEach(
                step => {


                    step.classList.toggle(

                        "active",

                        step.dataset.sceneTarget
                        ===
                        sceneName
                    );
                }
            );


            scenes.forEach(
                scene => {


                    const active =
                        scene.dataset.scene
                        ===
                        sceneName;


                    scene.classList.toggle(
                        "active",
                        active
                    );


                    scene.setAttribute(

                        "aria-hidden",

                        active
                        ? "false"
                        : "true"
                    );
                }
            );


            progressDots.forEach(
                dot => {


                    const active =
                        dot.dataset.storyJump
                        ===
                        sceneName;


                    dot.classList.toggle(
                        "active",
                        active
                    );


                    if (active) {

                        dot.setAttribute(
                            "aria-current",
                            "step"
                        );
                    }

                    else {

                        dot.removeAttribute(
                            "aria-current"
                        );
                    }
                }
            );


            if (progressCount) {

                progressCount.textContent =
                    `${activeIndex + 1} / ${steps.length}`;
            }


            if (progressCurrent) {

                progressCurrent.textContent =
                    sceneLabels[sceneName]
                    ||
                    `Section ${activeIndex + 1}`;
            }
        };


    const updateFromScroll =
        () => {


            rafId =
                0;


            const activeStep =
                getActiveStep();


            if (!activeStep) {
                return;
            }


            activateScene(
                activeStep.dataset.sceneTarget
            );
        };


    const scheduleUpdate =
        () => {


            if (rafId) {
                return;
            }


            rafId =
                requestAnimationFrame(
                    updateFromScroll
                );
        };


    const getScrollTopForStep =
        step => {


            const rect =
                step.getBoundingClientRect();


            const currentReadingY =
                getReadingLineY();


            const targetCentre =
                rect.top
                +
                rect.height * 0.50;


            return Math.max(

                0,

                view.scrollTop
                +
                targetCentre
                -
                currentReadingY
            );
        };


    progressDots.forEach(
        dot => {


            dot.addEventListener(

                "click",

                () => {


                    const target =
                        steps.find(
                            step =>
                                step.dataset.sceneTarget
                                ===
                                dot.dataset.storyJump
                        );


                    if (!target) {
                        return;
                    }


                    activateScene(
                        target.dataset.sceneTarget
                    );


                    view.scrollTo({

                        top:
                            getScrollTopForStep(
                                target
                            ),

                        behavior:
                            "auto"

                    });


                    requestAnimationFrame(
                        updateFromScroll
                    );
                }
            );
        }
    );


    view.addEventListener(

        "scroll",

        scheduleUpdate,

        {
            passive: true
        }
    );


    window.addEventListener(

        "resize",

        scheduleUpdate,

        {
            passive: true
        }
    );


    activateScene(
        steps[0].dataset.sceneTarget
    );


    requestAnimationFrame(
        updateFromScroll
    );


    view._caseStoryCleanup =
        () => {


            view.removeEventListener(
                "scroll",
                scheduleUpdate
            );


            window.removeEventListener(
                "resize",
                scheduleUpdate
            );


            if (rafId) {

                cancelAnimationFrame(
                    rafId
                );
            }
        };
}


/* =========================================================
CASE STUDY INTERACTIONS
========================================================= */

function bindCaseStudyInteractions(view) {

    const bars =
        Array.from(
            view.querySelectorAll(
                ".consensus-bar"
            )
        );


    const mapImage =
        view.querySelector(
            "#consensusMapImage"
        );


    const mapTitle =
        view.querySelector(
            "#consensusMapTitle"
        );


    const mapDescription =
        view.querySelector(
            "#consensusMapDescription"
        );


    bars.forEach(
        bar => {


            bar.addEventListener(

                "click",

                () => {


                    bars.forEach(
                        item => {

                            item.classList.remove(
                                "active"
                            );

                            item.setAttribute(
                                "aria-pressed",
                                "false"
                            );
                        }
                    );


                    bar.classList.add(
                        "active"
                    );


                    bar.setAttribute(
                        "aria-pressed",
                        "true"
                    );


                    if (mapImage) {

                        mapImage.dataset.rawFallbackTried =
                            "false";

                        mapImage.removeAttribute(
                            "data-src"
                        );

                        mapImage.src =
                            bar.dataset.map;
                    }


                    if (mapTitle) {

                        mapTitle.textContent =
                            bar.dataset.title;
                    }


                    if (mapDescription) {

                        mapDescription.textContent =
                            bar.dataset.copy;
                    }
                }
            );
        }
    );


    view
    .querySelectorAll(
        "[data-case-lightbox]"
    )
    .forEach(
        img => {


            img.addEventListener(

                "click",

                () => {


                    const source =

                        img.currentSrc

                        ||

                        img.src

                        ||

                        img.dataset.src;


                    if (!source) {
                        return;
                    }


                    lightboxImage.src =
                        source;


                    lightbox.classList.add(
                        "open"
                    );
                }
            );
        }
    );
}


/* =========================================================
SECTION 19 — GLOBAL EVENTS / UTILITIES
========================================================= */

function portfolioImageFallback(img) {

    if (
        !img
        ||
        img.dataset.rawFallbackTried
        ===
        "true"
    ) {
        return;
    }


    try {


        const current =
            new URL(
                img.currentSrc
                ||
                img.src,
                window.location.href
            );


        const filename =
            current.pathname
            .split("/")
            .pop();


        if (!filename) {
            return;
        }


        img.dataset.rawFallbackTried =
            "true";


        img.src =
            `https://raw.githubusercontent.com/Johnny1996ornot/Portfolio/main/${filename}`;
    }

    catch (error) {

        /* Avoid retry loop. */

    }
}


/* =========================================================
LIGHTBOX
========================================================= */

function closeLightbox() {

    lightbox.classList.remove(
        "open"
    );


    lightboxImage.src =
        "";
}


lightboxClose.addEventListener(
    "click",
    closeLightbox
);


lightbox.addEventListener(

    "click",

    event => {


        if (
            event.target
            ===
            lightbox
        ) {

            closeLightbox();
        }
    }
);


/* =========================================================
ESCAPE
========================================================= */

document.addEventListener(

    "keydown",

    event => {


        if (
            event.key
            !==
            "Escape"
        ) {
            return;
        }


        if (
            lightbox.classList
            .contains(
                "open"
            )
        ) {

            closeLightbox();

            return;
        }


        if (activeCaseStudy) {

            closeCaseStudy();

            return;
        }


        closeActivePanel();
    }
);

RESIZE

window.addEventListener(
    "resize",
    positionCloseButton
