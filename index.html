<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>John Paolo Ramirez | Environmental · Geospatial · Data</title>

<meta
    name="description"
    content="Portfolio of John Paolo Ramirez — environmental, geospatial and data analyst working with GIS, remote sensing, Google Earth Engine, Python, R, environmental assessment and scientific research."
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
>

<style>

/* =========================================================
   THEME
========================================================= */

:root {
    --bg: #070c09;
    --panel: #101713;
    --panel-hover: #162019;
    --panel-2: #151e19;

    --text: #f3f6f3;
    --muted: #a5b0a8;
    --muted-2: #75827a;

    --green: #84dd91;
    --green-2: #53ba69;
    --green-dark: #21643e;

    --blue: #123e72;

    --line: rgba(255,255,255,.095);

    --radius: 29px;
}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
}

body {
    background:
        radial-gradient(
            circle at 0% 0%,
            rgba(80,190,104,.055),
            transparent 32%
        ),
        radial-gradient(
            circle at 100% 100%,
            rgba(30,80,145,.065),
            transparent 32%
        ),
        var(--bg);

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}

button,
a {
    font: inherit;
}

button {
    color: inherit;
}

img {
    display: block;
    max-width: 100%;
}


/* =========================================================
   APP
========================================================= */

.app {
    width: 100%;
    height: 100svh;

    padding:
        clamp(11px, 1.7vw, 25px);

    display: flex;
    flex-direction: column;

    gap:
        clamp(9px, 1.2vw, 16px);
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar {
    min-height: 38px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;
}

.brand {
    display: flex;
    align-items: center;

    gap: 9px;

    color: var(--green);

    font-size: .69rem;
    font-weight: 900;

    letter-spacing: .17em;
    text-transform: uppercase;
}

.hint {
    color: var(--muted-2);

    font-size: .68rem;
}


/* =========================================================
   DASHBOARD
========================================================= */

.dashboard {
    min-height: 0;
    flex: 1;

    display: grid;

    grid-template-columns:
        repeat(12, minmax(0,1fr));

    grid-template-rows:
        repeat(2, minmax(0,1fr));

    gap:
        clamp(9px, 1.25vw, 17px);
}


/* =========================================================
   PANEL
========================================================= */

.panel {
    position: relative;

    min-width: 0;
    min-height: 0;

    overflow: hidden;

    padding:
        clamp(19px, 2.2vw, 34px);

    border:
        1px solid var(--line);

    border-radius: var(--radius);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.018),
            transparent 50%
        ),
        var(--panel);

    text-align: left;

    cursor: pointer;

    isolation: isolate;

    transition:
        transform .34s cubic-bezier(.2,.8,.2,1),
        border-color .3s ease,
        background .3s ease;
}

.panel:hover {
    transform: translateY(-4px);

    border-color:
        rgba(132,221,145,.22);

    background:
        var(--panel-hover);
}

.panel:focus-visible {
    outline: 2px solid var(--green);
    outline-offset: 3px;
}

.panel-profile {
    grid-column: span 7;
}

.panel-projects {
    grid-column: span 5;
}

.panel-skills {
    grid-column: span 5;
}

.panel-gallery {
    grid-column: span 7;
}


/* =========================================================
   PANEL COMMON
========================================================= */

.panel-kicker {
    display: inline-flex;
    align-items: center;

    gap: 7px;

    color: var(--green);

    font-size: .64rem;
    font-weight: 900;

    text-transform: uppercase;
    letter-spacing: .14em;
}

.panel-arrow {
    position: absolute;

    top: 22px;
    right: 23px;

    width: 40px;
    height: 40px;

    border:
        1px solid var(--line);

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: var(--muted-2);

    transition:
        transform .3s ease,
        color .3s ease,
        border-color .3s ease;
}

.panel:hover .panel-arrow {
    transform: rotate(45deg);

    color: var(--green);

    border-color:
        rgba(132,221,145,.24);
}


/* =========================================================
   SHARED TITLE
   This exact element is cloned during expansion.
========================================================= */

.shared-title {
    margin: 0;

    font-weight: 900;

    letter-spacing: -.064em;

    line-height: .91;

    transform-origin: top left;
}

.panel-profile .shared-title {
    font-size:
        clamp(2.8rem, 5.6vw, 6.8rem);
}

.panel-projects .shared-title,
.panel-gallery .shared-title {
    font-size:
        clamp(2.15rem, 4vw, 4.7rem);
}

.panel-skills .shared-title {
    font-size:
        clamp(1.75rem, 3.2vw, 3.8rem);

    line-height: .96;
}

.shared-title .accent {
    color: var(--green);
}


/* =========================================================
   PROFILE
========================================================= */

.panel-profile {
    display: flex;
    flex-direction: column;
    justify-content: space-between;

    background:
        radial-gradient(
            circle at 83% 15%,
            rgba(132,221,145,.10),
            transparent 41%
        ),
        var(--panel);
}

.profile-copy {
    margin-top: 14px;

    max-width: 680px;

    color: var(--muted);

    font-size:
        clamp(.82rem, 1.1vw, 1rem);

    line-height: 1.55;
}

.bottom-note {
    color: var(--muted-2);

    font-size: .67rem;
}

.profile-ring {
    position: absolute;

    width: 270px;
    height: 270px;

    right: -62px;
    bottom: -90px;

    border:
        1px solid
        rgba(132,221,145,.10);

    border-radius: 50%;

    animation:
        spinRing 18s linear infinite;
}

.profile-ring::before {
    content: "";

    position: absolute;

    inset: 48px;

    border:
        1px solid
        rgba(132,221,145,.13);

    border-radius: 50%;
}

.profile-ring::after {
    content: "";

    position: absolute;

    width: 11px;
    height: 11px;

    left: 11px;
    top: 128px;

    border-radius: 50%;

    background: var(--green);

    box-shadow:
        0 0 20px
        rgba(132,221,145,.45);
}

@keyframes spinRing {
    to {
        transform: rotate(360deg);
    }
}


/* =========================================================
   PROJECTS
========================================================= */

.panel-projects {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.project-preview {
    display: grid;
    gap: 7px;
}

.preview-line {
    padding-top: 9px;

    border-top:
        1px solid var(--line);

    display: flex;
    justify-content: space-between;

    gap: 12px;

    font-size: .68rem;
}

.preview-line strong {
    color: var(--text);
}

.preview-line span {
    color: var(--muted-2);
}


/* =========================================================
   SKILLS
========================================================= */

.panel-skills {
    display: flex;
    flex-direction: column;
    justify-content: space-between;

    background:
        radial-gradient(
            circle at 10% 100%,
            rgba(20,68,125,.16),
            transparent 42%
        ),
        var(--panel);
}

.skill-preview {
    display: flex;
    flex-wrap: wrap;

    gap: 6px;
}

.skill-preview span {
    padding:
        6px 9px;

    border:
        1px solid var(--line);

    border-radius: 999px;

    color: var(--muted);

    font-size: .64rem;
    font-weight: 720;
}


/* =========================================================
   GALLERY
========================================================= */

.panel-gallery {
    display: grid;

    grid-template-columns:
        minmax(0,.73fr)
        minmax(0,1.27fr);

    gap: 20px;
}

.gallery-panel-copy {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.preview-stack {
    position: relative;

    min-height: 0;

    overflow: hidden;

    border-radius: 21px;

    background: #0b110e;
}

.stack-img {
    position: absolute;

    overflow: hidden;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius: 14px;

    background: #121814;

    box-shadow:
        0 16px 32px
        rgba(0,0,0,.3);

    transition:
        transform .4s ease;
}

.stack-img img {
    width: 100%;
    height: 100%;

    object-fit: cover;
}

.stack-a {
    width: 57%;
    height: 62%;

    left: 5%;
    top: 8%;

    z-index: 3;

    transform: rotate(-3deg);
}

.stack-b {
    width: 53%;
    height: 55%;

    right: 4%;
    bottom: 8%;

    z-index: 4;

    transform: rotate(4deg);
}

.stack-c {
    width: 42%;
    height: 43%;

    right: 8%;
    top: 5%;

    z-index: 2;

    transform: rotate(7deg);
}

.panel-gallery:hover .stack-a {
    transform:
        rotate(-6deg)
        translate(-5px,-4px);
}

.panel-gallery:hover .stack-b {
    transform:
        rotate(7deg)
        translate(7px,5px);
}

.panel-gallery:hover .stack-c {
    transform:
        rotate(10deg)
        translate(5px,-6px);
}


/* =========================================================
   EXPANDING PANEL OVERLAY
========================================================= */

.expansion {
    position: fixed;

    z-index: 5000;

    overflow: hidden;

    border:
        1px solid var(--line);

    background:
        #0d1510;

    box-shadow:
        0 35px 100px
        rgba(0,0,0,.60);

    will-change:
        left,
        top,
        width,
        height,
        border-radius;

    transition:
        left .58s cubic-bezier(.2,.8,.2,1),
        top .58s cubic-bezier(.2,.8,.2,1),
        width .58s cubic-bezier(.2,.8,.2,1),
        height .58s cubic-bezier(.2,.8,.2,1),
        border-radius .58s cubic-bezier(.2,.8,.2,1);
}


/* dim behind */

.expansion-backdrop {
    position: fixed;

    inset: 0;

    z-index: 4990;

    background:
        rgba(2,7,4,.72);

    backdrop-filter:
        blur(12px);

    opacity: 0;

    transition:
        opacity .4s ease;
}

.expansion-backdrop.open {
    opacity: 1;
}


/* =========================================================
   TRAVELING TITLE
========================================================= */

.flying-title {
    position: fixed;

    z-index: 5100;

    margin: 0;

    pointer-events: none;

    color: var(--text);

    font-weight: 900;

    line-height: .91;

    letter-spacing: -.064em;

    transform-origin: top left;

    will-change:
        left,
        top,
        font-size,
        line-height;

    transition:
        left .58s cubic-bezier(.2,.8,.2,1),
        top .58s cubic-bezier(.2,.8,.2,1),
        font-size .58s cubic-bezier(.2,.8,.2,1),
        line-height .58s cubic-bezier(.2,.8,.2,1);
}

.flying-title .accent {
    color: var(--green);
}


/* =========================================================
   EXPANDED CONTENT
========================================================= */

.expanded-content {
    position: absolute;

    inset: 0;

    overflow-y: auto;
    overflow-x: hidden;

    padding:
        110px
        clamp(24px,4vw,60px)
        clamp(32px,4vw,60px);

    opacity: 0;

    transform:
        translateY(16px);

    transition:
        opacity .28s ease .34s,
        transform .4s ease .30s;
}

.expansion.content-visible
.expanded-content {
    opacity: 1;

    transform: translateY(0);
}

.expanded-content::-webkit-scrollbar {
    width: 7px;
}

.expanded-content::-webkit-scrollbar-track {
    background: transparent;
}

.expanded-content::-webkit-scrollbar-thumb {
    background:
        #3b4940;

    border-radius: 10px;
}


/* =========================================================
   EXPANDED HEADER
========================================================= */

.expanded-header-row {
    display: flex;
    justify-content: space-between;
    align-items: start;

    gap: 20px;

    margin-bottom: 36px;
}

.expanded-kicker {
    color: var(--green);

    font-size: .73rem;
    font-weight: 900;

    letter-spacing: .15em;
    text-transform: uppercase;
}

.expanded-description {
    max-width: 800px;

    margin-top: 10px;

    color: var(--muted);

    font-size:
        clamp(.96rem,1.15vw,1.08rem);

    line-height: 1.7;
}


/* close */

.expansion-close {
    position: fixed;

    z-index: 5200;

    width: 46px;
    height: 46px;

    border:
        1px solid var(--line);

    border-radius: 50%;

    background:
        rgba(15,24,18,.92);

    color: white;

    cursor: pointer;

    opacity: 0;

    transform:
        scale(.8);

    transition:
        opacity .25s ease .38s,
        transform .35s ease .36s,
        background .2s ease;
}

.expansion-close.visible {
    opacity: 1;

    transform:
        scale(1);
}

.expansion-close:hover {
    background:
        var(--panel-hover);
}


/* =========================================================
   ANIMATED BLOB INSIDE OPENED PANEL
========================================================= */

.expanded-blob {
    position: absolute;

    width: 330px;
    height: 250px;

    right: -90px;
    top: -60px;

    opacity: .14;

    pointer-events: none;

    background:
        radial-gradient(
            circle at 30% 25%,
            #a8e7ab,
            #68c77c 46%,
            #286d46 100%
        );

    border-radius:
        55% 45% 60% 40%
        /
        44% 58% 42% 56%;

    animation:
        expandedBlob 8s
        ease-in-out
        infinite alternate;
}

.expanded-blob-small {
    position: absolute;

    width: 78px;
    height: 78px;

    right: 20%;
    top: 100px;

    opacity: .08;

    background: var(--green);

    border-radius:
        57% 43% 39% 61%
        /
        43% 55% 45% 57%;

    animation:
        expandedBlobSmall 6.5s
        ease-in-out
        infinite alternate;
}

@keyframes expandedBlob {

    0% {
        transform:
            translate(0,0)
            rotate(-4deg)
            scale(1);

        border-radius:
            55% 45% 60% 40%
            /
            44% 58% 42% 56%;
    }

    50% {
        transform:
            translate(-30px,25px)
            rotate(5deg)
            scale(1.07);

        border-radius:
            39% 61% 48% 52%
            /
            57% 41% 59% 43%;
    }

    100% {
        transform:
            translate(-8px,12px)
            rotate(-1deg)
            scale(.97);

        border-radius:
            62% 38% 54% 46%
            /
            39% 61% 43% 57%;
    }
}

@keyframes expandedBlobSmall {

    from {
        transform:
            translate(0,0)
            rotate(0deg);
    }

    to {
        transform:
            translate(-45px,30px)
            rotate(35deg)
            scale(1.18);
    }
}


/* =========================================================
   CONTENT CARDS
========================================================= */

.content-grid {
    display: grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap: 14px;
}

.content-card {
    min-height: 200px;

    padding: 24px;

    border:
        1px solid var(--line);

    border-radius: 20px;

    background:
        var(--panel);

    transition:
        transform .28s ease,
        border-color .28s ease,
        background .28s ease;
}

.content-card:hover {
    transform:
        translateY(-3px);

    border-color:
        rgba(132,221,145,.23);

    background:
        var(--panel-hover);
}

.content-card h3 {
    margin:
        13px 0 0;

    font-size:
        clamp(1.15rem,1.65vw,1.45rem);

    line-height: 1.25;
}

.content-card p {
    margin:
        10px 0 0;

    color: var(--muted);

    font-size: .9rem;

    line-height: 1.65;
}

.card-icon {
    width: 43px;
    height: 43px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 12px;

    background:
        rgba(132,221,145,.10);

    color: var(--green);
}

.card-label {
    color: var(--green);

    font-size: .7rem;
    font-weight: 900;

    letter-spacing: .11em;
    text-transform: uppercase;
}

.tags {
    margin-top: 17px;

    display: flex;
    flex-wrap: wrap;

    gap: 6px;
}

.tags span {
    padding:
        6px 9px;

    border-radius: 999px;

    background:
        var(--panel-2);

    color:
        #c1cac4;

    font-size: .69rem;
    font-weight: 720;
}


/* =========================================================
   CONTACT CARDS
========================================================= */

.contact-card-link {
    min-height: 160px;

    padding: 24px;

    display: flex;
    flex-direction: column;
    justify-content: space-between;

    border:
        1px solid var(--line);

    border-radius: 20px;

    background:
        var(--panel);

    text-decoration: none;

    transition:
        transform .28s ease,
        border-color .28s ease;
}

.contact-card-link:hover {
    transform:
        translateY(-3px);

    border-color:
        rgba(132,221,145,.25);
}

.contact-card-link i {
    color: var(--green);

    font-size: 1.25rem;
}

.contact-small {
    color: var(--muted-2);

    font-size: .7rem;
    text-transform: uppercase;
    letter-spacing: .1em;
}

.contact-large {
    margin-top: 8px;

    font-size:
        clamp(.95rem,1.4vw,1.2rem);

    font-weight: 780;

    word-break: break-word;
}


/* =========================================================
   GALLERY
========================================================= */

.gallery-grid {
    display: grid;

    grid-template-columns:
        repeat(2,minmax(0,1fr));

    gap: 15px;
}

.gallery-item {
    position: relative;

    min-height: 300px;

    overflow: hidden;

    border:
        1px solid var(--line);

    border-radius: 20px;

    background:
        #101613;

    cursor: zoom-in;

    transition:
        transform .28s ease,
        border-color .28s ease;
}

.gallery-item:hover {
    transform:
        translateY(-3px);

    border-color:
        rgba(132,221,145,.25);
}

.gallery-item img {
    position: absolute;

    inset: 0;

    width: 100%;
    height: 100%;

    object-fit: contain;

    padding: 13px;
}

.gallery-caption {
    position: absolute;

    left: 14px;
    right: 14px;
    bottom: 14px;

    z-index: 3;

    padding:
        12px 14px;

    border-radius: 13px;

    background:
        rgba(4,10,6,.78);

    backdrop-filter:
        blur(12px);

    font-size: .79rem;
    font-weight: 760;
}


/* =========================================================
   LIGHTBOX
========================================================= */

.lightbox {
    position: fixed;

    inset: 0;

    z-index: 10000;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 22px;

    background:
        rgba(0,0,0,.94);

    backdrop-filter:
        blur(14px);
}

.lightbox.open {
    display: flex;
}

.lightbox img {
    max-width: 95vw;
    max-height: 90svh;

    object-fit: contain;

    border-radius: 13px;
}

.lightbox-close {
    position: fixed;

    top: 19px;
    right: 19px;

    width: 46px;
    height: 46px;

    border:
        1px solid
        rgba(255,255,255,.16);

    border-radius: 50%;

    background:
        rgba(255,255,255,.07);

    color: white;

    cursor: pointer;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 800px) {

    :root {
        --radius: 20px;
    }

    .app {
        padding: 9px;

        gap: 8px;
    }

    .topbar {
        min-height: 29px;
    }

    .brand {
        font-size: .5rem;

        letter-spacing: .08em;
    }

    .hint {
        display: none;
    }

    .dashboard {
        grid-template-columns:
            1fr 1fr;

        grid-template-rows:
            1fr 1fr;

        gap: 8px;
    }

    .panel-profile,
    .panel-projects,
    .panel-skills,
    .panel-gallery {
        grid-column: span 1;
    }

    .panel {
        padding: 14px;

        border-radius: 19px;
    }

    .panel-kicker {
        font-size: .46rem;

        letter-spacing: .07em;
    }

    .panel-arrow {
        top: 10px;
        right: 10px;

        width: 28px;
        height: 28px;

        font-size: .64rem;
    }

    .panel-profile .shared-title {
        font-size:
            clamp(1.8rem,10vw,3.2rem);
    }

    .panel-projects .shared-title,
    .panel-gallery .shared-title {
        font-size:
            clamp(1.4rem,7.7vw,2.4rem);
    }

    .panel-skills .shared-title {
        font-size:
            clamp(1rem,5.5vw,1.7rem);

        line-height: 1;
    }

    .profile-copy {
        margin-top: 7px;

        max-width: 90%;

        font-size: .55rem;

        line-height: 1.35;
    }

    .bottom-note {
        font-size: .48rem;
    }

    .profile-ring {
        width: 110px;
        height: 110px;

        right: -42px;
        bottom: -42px;
    }

    .profile-ring::before {
        inset: 20px;
    }

    .profile-ring::after {
        width: 6px;
        height: 6px;

        left: 2px;
        top: 51px;
    }

    .preview-line {
        font-size: .46rem;

        padding-top: 5px;
    }

    .preview-line:nth-child(n+3) {
        display: none;
    }

    .skill-preview {
        gap: 4px;
    }

    .skill-preview span {
        padding: 4px 6px;

        font-size: .44rem;

/* =========================================================
   ELEMENTS
========================================================= */

const panels =
    document.querySelectorAll(
        "[data-panel]"
    );

const backdrop =
    document.getElementById(
        "expansionBackdrop"
    );

let activePanel = null;
let expansion = null;
let flyingTitle = null;
let closeButton = null;


/* =========================================================
   OPEN PANEL — SHARED ELEMENT TRANSITION
========================================================= */

function openPanel(panel) {

    if (activePanel) {
        return;
    }


    activePanel = panel;


    const key =
        panel.dataset.panel;


    const panelRect =
        panel.getBoundingClientRect();


    const originalTitle =
        panel.querySelector(
            "[data-title]"
        );


    const titleRect =
        originalTitle
            .getBoundingClientRect();


    const panelStyle =
        getComputedStyle(panel);


    const titleStyle =
        getComputedStyle(
            originalTitle
        );


    /* -----------------------------------------------------
       BACKDROP
    ----------------------------------------------------- */

    backdrop.hidden =
        false;


    requestAnimationFrame(
        () => {

            backdrop.classList.add(
                "open"
            );

        }
    );


    /* -----------------------------------------------------
       CREATE EXPANDING PANEL
    ----------------------------------------------------- */

    expansion =
        document.createElement(
            "div"
        );


    expansion.className =
        "expansion";


    expansion.style.left =
        `${panelRect.left}px`;


    expansion.style.top =
        `${panelRect.top}px`;


    expansion.style.width =
        `${panelRect.width}px`;


    expansion.style.height =
        `${panelRect.height}px`;


    expansion.style.borderRadius =
        panelStyle.borderRadius;


    expansion.innerHTML =
        `
        <div class="expanded-blob"></div>
        <div class="expanded-blob-small"></div>

        <div class="expanded-content">

            <div class="expanded-header-row">

                <div>

                    <div class="expanded-kicker">
                        ${content[key].kicker}
                    </div>

                    <div class="expanded-description">
                        ${content[key].description}
                    </div>

                </div>

            </div>

            ${content[key].html}

        </div>
        `;


    document.body.appendChild(
        expansion
    );


    /* -----------------------------------------------------
       CREATE TITLE CLONE
    ----------------------------------------------------- */

    flyingTitle =
        document.createElement(
            originalTitle.tagName
        );


    flyingTitle.className =
        "flying-title";


    flyingTitle.innerHTML =
        originalTitle.innerHTML;


    flyingTitle.style.left =
        `${titleRect.left}px`;


    flyingTitle.style.top =
        `${titleRect.top}px`;


    flyingTitle.style.width =
        `${titleRect.width}px`;


    flyingTitle.style.fontSize =
        titleStyle.fontSize;


    flyingTitle.style.lineHeight =
        titleStyle.lineHeight;


    document.body.appendChild(
        flyingTitle
    );


    /* hide original so duplicate is not visible */

    originalTitle.style.opacity =
        "0";


    panel.style.opacity =
        "0";


    /* -----------------------------------------------------
       FINAL TARGET
    ----------------------------------------------------- */

    const margin =
        window.innerWidth <= 800
            ? 6
            : 24;


    const finalLeft =
        margin;


    const finalTop =
        margin;


    const finalWidth =
        window.innerWidth
        - margin * 2;


    const finalHeight =
        window.innerHeight
        - margin * 2;


    /* final title target */

    const finalTitleLeft =
        finalLeft
        + (
            window.innerWidth <= 800
                ? 18
                : 58
        );


    const finalTitleTop =
        finalTop
        + (
            window.innerWidth <= 800
                ? 22
                : 31
        );


    const finalTitleSize =
        window.innerWidth <= 800
            ? 21
            : 27;


    /* -----------------------------------------------------
       ANIMATE
    ----------------------------------------------------- */

    requestAnimationFrame(
        () => {

            expansion.style.left =
                `${finalLeft}px`;


            expansion.style.top =
                `${finalTop}px`;


            expansion.style.width =
                `${finalWidth}px`;


            expansion.style.height =
                `${finalHeight}px`;


            expansion.style.borderRadius =
                window.innerWidth <= 800
                    ? "23px"
                    : "38px";


            flyingTitle.style.left =
                `${finalTitleLeft}px`;


            flyingTitle.style.top =
                `${finalTitleTop}px`;


            flyingTitle.style.fontSize =
                `${finalTitleSize}px`;


            flyingTitle.style.lineHeight =
                "1.04";


            flyingTitle.style.width =
                `${
                    Math.min(
                        finalWidth * .62,
                        650
                    )
                }px`;

        }
    );


    /* -----------------------------------------------------
       CLOSE BUTTON
    ----------------------------------------------------- */

    closeButton =
        document.createElement(
            "button"
        );


    closeButton.className =
        "expansion-close";


    closeButton.innerHTML =
        `<i class="fa-solid fa-xmark"></i>`;


    closeButton.setAttribute(
        "aria-label",
        "Close panel"
    );


    document.body.appendChild(
        closeButton
    );


    positionCloseButton();


    closeButton.addEventListener(
        "click",
        closeActivePanel
    );


    /* -----------------------------------------------------
       AFTER OPEN
    ----------------------------------------------------- */

    setTimeout(
        () => {

            if (!expansion) {
                return;
            }

            expansion.classList.add(
                "content-visible"
            );


            closeButton.classList.add(
                "visible"
            );


            bindGalleryItems();

        },

        410
    );

}


/* =========================================================
   CLOSE PANEL — REVERSE TO ORIGINAL TILE
========================================================= */

function closeActivePanel() {

    if (
        !activePanel
        || !expansion
        || !flyingTitle
    ) {
        return;
    }


    const panel =
        activePanel;


    const originalTitle =
        panel.querySelector(
            "[data-title]"
        );


    /* show source panel but keep title hidden
       while animation flies back */

    panel.style.opacity =
        "1";


    originalTitle.style.opacity =
        "0";


    const destination =
        panel.getBoundingClientRect();


    const titleDestination =
        originalTitle
            .getBoundingClientRect();


    const titleStyle =
        getComputedStyle(
            originalTitle
        );


    expansion.classList.remove(
        "content-visible"
    );


    if (closeButton) {

        closeButton.classList.remove(
            "visible"
        );

    }


    backdrop.classList.remove(
        "open"
    );


    /* -----------------------------------------------------
       REVERSE PANEL
    ----------------------------------------------------- */

    expansion.style.left =
        `${destination.left}px`;


    expansion.style.top =
        `${destination.top}px`;


    expansion.style.width =
        `${destination.width}px`;


    expansion.style.height =
        `${destination.height}px`;


    expansion.style.borderRadius =
        getComputedStyle(panel)
            .borderRadius;


    /* -----------------------------------------------------
       REVERSE TITLE
    ----------------------------------------------------- */

    flyingTitle.style.left =
        `${titleDestination.left}px`;


    flyingTitle.style.top =
        `${titleDestination.top}px`;


    flyingTitle.style.width =
        `${titleDestination.width}px`;


    flyingTitle.style.fontSize =
        titleStyle.fontSize;


    flyingTitle.style.lineHeight =
        titleStyle.lineHeight;


    /* -----------------------------------------------------
       CLEAN UP
    ----------------------------------------------------- */

    setTimeout(
        () => {

            originalTitle.style.opacity =
                "";


            expansion.remove();


            flyingTitle.remove();


            if (closeButton) {
                closeButton.remove();
            }


            backdrop.hidden =
                true;


            expansion =
                null;


            flyingTitle =
                null;


            closeButton =
                null;


            activePanel =
                null;

        },

        610
    );

}


/* =========================================================
   CLOSE BUTTON POSITION
========================================================= */

function positionCloseButton() {

    if (!closeButton) {
        return;
    }


    const margin =
        window.innerWidth <= 800
            ? 16
            : 43;


    closeButton.style.top =
        `${margin}px`;


    closeButton.style.right =
        `${margin}px`;

}


/* =========================================================
   PANEL EVENTS
========================================================= */

panels.forEach(
    panel => {

        panel.addEventListener(
            "click",
            () => {

                openPanel(
                    panel
                );

            }
        );

    }
);


/* =========================================================
   BACKDROP CLOSE
========================================================= */

backdrop.addEventListener(
    "click",
    closeActivePanel
);


/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            if (
                lightbox.classList
                    .contains("open")
            ) {

                closeLightbox();

                return;
            }


            closeActivePanel();

        }

    }
);


/* =========================================================
   WINDOW RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        positionCloseButton();

    }
);


/* =========================================================
   LIGHTBOX
========================================================= */

const lightbox =
    document.getElementById(
        "lightbox"
    );


const lightboxImage =
    document.getElementById(
        "lightboxImage"
    );


const lightboxClose =
    document.getElementById(
        "lightboxClose"
    );


function bindGalleryItems() {

    document
        .querySelectorAll(
            ".expansion .gallery-item"
        )
        .forEach(
            item => {

                if (
                    item.dataset.bound
                ) {
                    return;
                }


                item.dataset.bound =
                    "true";


                item.addEventListener(
                    "click",
                    () => {

                        lightboxImage.src =
                            item.dataset.image;


                        lightbox.classList.add(
                            "open"
                        );

                    }
                );

            }
        );

}


function closeLightbox() {

    lightbox.classList.remove(
        "open"
    );


    lightboxImage.src =
        "";

}


lightboxClose.addEventListener(
    "click",
    closeLightbox
);


lightbox.addEventListener(
    "click",
    event => {

        if (
            event.target === lightbox
        ) {

            closeLightbox();

        }

    }
);

</script>

</body>
</html>
