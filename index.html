<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>
    John Paolo Ramirez | Environmental · Geospatial · Data
</title>

<meta
    name="description"
    content="Portfolio of John Paolo Ramirez — environmental, geospatial and data analyst working with GIS, remote sensing, Google Earth Engine, Python, R, environmental assessment and scientific research."
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
>

<style>

/* =========================================================
   COLOR SYSTEM
========================================================= */

:root {

    --bg: #02353C;
    --bg2: #064149;

    --panel: #0A474D;
    --panel2: #0B5156;
    --panel3: #0B5A5D;

    --text: #F7FFFD;

    --muted: #C0DBD7;
    --muted2: #88B2AD;

    --mint: #C1F6ED;

    --green: #2EAF7D;
    --green2: #449342;
    --greenBright: #59E18D;

    --aqua: #3FD0C9;

    --line: rgba(193,246,237,.17);

    --radius: 29px;
}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
}

body {

    background:

        radial-gradient(
            circle at 3% 3%,
            rgba(63,208,201,.12),
            transparent 31%
        ),

        radial-gradient(
            circle at 97% 94%,
            rgba(46,175,125,.14),
            transparent 34%
        ),

        linear-gradient(
            145deg,
            #02353C,
            #043D43 55%,
            #063E42
        );

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    -webkit-font-smoothing: antialiased;

    text-rendering: optimizeLegibility;
}

button,
a {
    font: inherit;
}

button {
    color: inherit;
}

img {
    display: block;

    max-width: 100%;
}


/* =========================================================
   MAIN APP
========================================================= */

.app {

    width: 100%;

    height: 100svh;

    padding:
        clamp(10px, 1.6vw, 24px);

    display: flex;

    flex-direction: column;

    gap:
        clamp(8px, 1.15vw, 15px);
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar {

    min-height: 38px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;
}

.brand {

    display: flex;

    align-items: center;

    gap: 9px;

    color:
        var(--greenBright);

    font-size: .69rem;

    font-weight: 900;

    letter-spacing: .17em;

    text-transform: uppercase;
}

.hint {

    color:
        var(--muted2);

    font-size: .68rem;
}


/* =========================================================
   DASHBOARD
========================================================= */

.dashboard {

    min-height: 0;

    flex: 1;

    display: grid;

    grid-template-columns:
        repeat(12, minmax(0,1fr));

    grid-template-rows:
        repeat(2, minmax(0,1fr));

    gap:
        clamp(8px,1.2vw,16px);
}


/* =========================================================
   PANEL
========================================================= */

.panel {

    position: relative;

    min-width: 0;

    min-height: 0;

    overflow: hidden;

    padding:
        clamp(18px,2vw,32px);

    border:
        1px solid
        var(--line);

    border-radius:
        var(--radius);

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.025),
            transparent 46%
        ),

        var(--panel);

    color:
        var(--text);

    text-align: left;

    cursor: pointer;

    isolation: isolate;

    box-shadow:
        0 18px 40px
        rgba(0,24,27,.14);

    transition:

        transform .32s
        cubic-bezier(.2,.8,.2,1),

        border-color .3s ease,

        background .3s ease,

        box-shadow .3s ease;
}

.panel:hover {

    transform:
        translateY(-4px);

    background:
        var(--panel2);

    border-color:
        rgba(89,225,141,.30);

    box-shadow:
        0 22px 50px
        rgba(0,20,23,.23);
}

.panel:focus-visible {

    outline:
        2px solid
        var(--greenBright);

    outline-offset:
        3px;
}


/* =========================================================
   PANEL GRID
========================================================= */

.panel-profile {

    grid-column:
        span 7;
}

.panel-projects {

    grid-column:
        span 5;
}

.panel-skills,
.panel-gallery,
.panel-mini {

    grid-column:
        span 4;
}


/* =========================================================
   PANEL COMMON
========================================================= */

.panel-kicker {

    position: relative;

    z-index: 5;

    display:
        inline-flex;

    align-items:
        center;

    gap: 7px;

    color:
        var(--greenBright);

    font-size: .63rem;

    font-weight: 900;

    letter-spacing: .14em;

    text-transform: uppercase;
}

.panel-arrow {

    position: absolute;

    z-index: 15;

    top: 21px;

    right: 22px;

    width: 39px;

    height: 39px;

    border:
        1px solid
        var(--line);

    border-radius:
        50%;

    display: flex;

    align-items: center;

    justify-content: center;

    color:
        var(--mint);

    background:
        rgba(2,53,60,.28);

    transition:
        transform .3s ease,
        background .3s ease;
}

.panel:hover
.panel-arrow {

    transform:
        rotate(45deg);

    background:
        rgba(46,175,125,.18);
}


/* =========================================================
   SHARED TITLES
========================================================= */

.shared-title {

    position: relative;

    z-index: 5;

    margin: 0;

    color:
        var(--text);

    font-weight: 900;

    letter-spacing: -.064em;

    line-height: .91;

    transform-origin:
        top left;
}

.title-line {

    display: block;
}

.shared-title .accent,
.flying-title .accent {

    color:
        var(--greenBright);
}


/* HOME SIZES */

.panel-profile
.shared-title {

    font-size:
        clamp(2.8rem,5.55vw,6.7rem);
}

.panel-projects
.shared-title {

    font-size:
        clamp(2.1rem,3.95vw,4.6rem);
}

.panel-skills
.shared-title {

    font-size:
        clamp(1.35rem,2.4vw,2.8rem);

    line-height: 1;
}

.panel-gallery
.shared-title,
.panel-mini
.shared-title {

    font-size:
        clamp(1.75rem,2.9vw,3.4rem);
}


/* =========================================================
   PROFILE PANEL
========================================================= */

.panel-profile {

    display: flex;

    flex-direction: column;

    justify-content:
        space-between;

    background:

        radial-gradient(
            circle at 82% 16%,
            rgba(63,208,201,.15),
            transparent 40%
        ),

        linear-gradient(
            138deg,
            #09454B,
            #0B4D50
        );
}

.profile-content {

    position: relative;

    z-index: 5;

    max-width: 68%;
}

.profile-copy {

    margin-top: 14px;

    max-width: 680px;

    color:
        var(--muted);

    font-size:
        clamp(.82rem,1.05vw,1rem);

    line-height: 1.55;
}

.bottom-note {

    position: relative;

    z-index: 5;

    color:
        var(--muted2);

    font-size: .66rem;
}


/* =========================================================
   PROFILE MOVING PLANETS
========================================================= */

.planet-system {

    position: absolute;

    right: 1%;

    top: 4%;

    width: 40%;

    height: 91%;

    z-index: 1;

    pointer-events: none;
}

.orbit {

    position: absolute;

    border:
        1px solid
        rgba(193,246,237,.12);

    border-radius: 50%;

    animation:
        orbitSpin linear infinite;
}

.orbit1 {

    width: 285px;

    height: 285px;

    right: 6%;

    top: 3%;

    animation-duration:
        20s;
}

.orbit2 {

    width: 205px;

    height: 205px;

    right: 20%;

    top: 18%;

    animation-duration:
        14s;

    animation-direction:
        reverse;
}

.orbit3 {

    width: 350px;

    height: 180px;

    right: -7%;

    bottom: 2%;

    transform:
        rotate(-21deg);

    animation-duration:
        24s;
}

@keyframes orbitSpin {

    to {

        transform:
            rotate(360deg);
    }
}


.planet {

    position: absolute;

    border-radius: 50%;

    box-shadow:

        inset -24px -25px 45px
        rgba(0,69,62,.25),

        inset 18px 16px 32px
        rgba(255,255,255,.13),

        0 20px 36px
        rgba(0,28,31,.18);

    animation:
        planetFloat
        ease-in-out
        infinite alternate;
}

.planet1 {

    width: 155px;

    height: 155px;

    right: 16%;

    top: 9%;

    background:

        radial-gradient(
            circle at 30% 24%,
            #C1F6ED,
            #65DA9B 43%,
            #2EAF7D 72%,
            #166750
        );

    animation-duration:
        7s;
}

.planet2 {

    width: 108px;

    height: 108px;

    right: 1%;

    top: 50%;

    background:

        radial-gradient(
            circle at 30% 23%,
            #98DEA6,
            #55C685 48%,
            #267F65
        );

    animation-duration:
        6.2s;

    animation-delay:
        -1.8s;
}

.planet3 {

    width: 63px;

    height: 63px;

    right: 45%;

    top: 59%;

    background:

        radial-gradient(
            circle at 34% 26%,
            #C1F6ED,
            #3FD0C9 45%,
            #18766F
        );

    animation-duration:
        5.1s;
}

.planet4 {

    width: 29px;

    height: 29px;

    right: 51%;

    top: 18%;

    background:
        var(--greenBright);

    animation-duration:
        4.2s;

    box-shadow:
        0 0 24px
        rgba(89,225,141,.35);
}

@keyframes planetFloat {

    from {

        transform:
            translate3d(0,-7px,0)
            scale(.98);
    }

    to {

        transform:
            translate3d(10px,11px,0)
            scale(1.04);
    }
}


.particle {

    position: absolute;

    width: 7px;

    height: 7px;

    border-radius: 50%;

    background:
        var(--mint);

    animation:
        particlePulse
        3s ease-in-out
        infinite;
}

.particle1 {

    right: 52%;

    top: 40%;
}

.particle2 {

    right: 5%;

    top: 31%;

    animation-delay:
        -1s;
}

.particle3 {

    right: 33%;

    bottom: 8%;

    animation-delay:
        -2s;
}

@keyframes particlePulse {

    0%,
    100% {

        opacity: .18;

        transform:
            scale(.7);
    }

    50% {

        opacity: .9;

        transform:
            scale(1.4);
    }
}


/* =========================================================
   PROJECT PANEL
========================================================= */

.panel-projects {

    display: flex;

    flex-direction: column;

    justify-content:
        space-between;
}

.project-preview {

    display: grid;

    gap: 7px;
}

.preview-line {

    padding-top: 8px;

    display: flex;

    justify-content:
        space-between;

    gap: 12px;

    border-top:
        1px solid
        var(--line);

    font-size: .67rem;
}

.preview-line strong {

    color:
        var(--text);
}

.preview-line span {

    color:
        var(--muted2);
}


/* =========================================================
   SKILLS
========================================================= */

.panel-skills {

    display: flex;

    flex-direction: column;

    justify-content:
        space-between;
}

.skill-preview {

    display: flex;

    flex-wrap: wrap;

    gap: 6px;
}

.skill-preview span {

    padding:
        6px 9px;

    border:
        1px solid
        var(--line);

    border-radius:
        999px;

    color:
        var(--muted);

    font-size: .61rem;

    font-weight: 720;
}


/* =========================================================
   SELECTED WORK
========================================================= */

.panel-gallery {

    display: flex;

    flex-direction: column;

    justify-content:
        space-between;
}

.thumb-strip {

    height: 38%;

    min-height: 82px;

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 7px;
}

.thumb {

    position: relative;

    overflow: hidden;

    border:
        1px solid
        var(--line);

    border-radius: 11px;

    background:
        #07393E;
}

.thumb img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    transition:
        transform .35s ease;
}

.panel-gallery:hover
.thumb img {

    transform:
        scale(1.06);
}


/* =========================================================
   MINI PROJECTS PANEL
========================================================= */

.panel-mini {

    display: flex;

    flex-direction: column;

    justify-content:
        space-between;
}

.mini-preview {

    display: grid;

    gap: 7px;
}

.mini-preview-row {

    padding-top: 8px;

    display: flex;

    align-items: center;

    justify-content:
        space-between;

    border-top:
        1px solid
        var(--line);

    color:
        var(--muted);

    font-size: .63rem;
}

.mini-preview-row strong {

    color:
        var(--text);
}


/* =========================================================
   OPENING BACKDROP
========================================================= */

.expansion-backdrop {

    position: fixed;

    inset: 0;

    z-index: 4990;

    background:
        rgba(1,29,33,.72);

    backdrop-filter:
        blur(13px);

    -webkit-backdrop-filter:
        blur(13px);

    opacity: 0;

    transition:
        opacity .4s ease;
}

.expansion-backdrop.open {

    opacity: 1;
}


/* =========================================================
   EXPANDING PANEL
========================================================= */

.expansion {

    position: fixed;

    z-index: 5000;

    overflow: hidden;

    border:
        1px solid
        rgba(193,246,237,.18);

    background:

        radial-gradient(
            circle at 85% 0%,
            rgba(46,175,125,.16),
            transparent 34%
        ),

        linear-gradient(
            145deg,
            #064149,
            #07434A
        );

    box-shadow:

        0 40px 110px
        rgba(0,20,24,.58);

    will-change:
        left,
        top,
        width,
        height,
        border-radius;

    transition:

        left .62s
        cubic-bezier(.18,.8,.2,1),

        top .62s
        cubic-bezier(.18,.8,.2,1),

        width .62s
        cubic-bezier(.18,.8,.2,1),

        height .62s
        cubic-bezier(.18,.8,.2,1),

        border-radius .62s
        cubic-bezier(.18,.8,.2,1);
}


/* =========================================================
   BLURRED TITLE BACKGROUND

   This remains fixed while the inner content scrolls
   underneath it.
========================================================= */

.expanded-title-shield {

    position: absolute;

    z-index: 5050;

    top: 0;

    left: 0;

    right: 0;

    height: 124px;

    pointer-events: none;

    opacity: 0;

    background:

        linear-gradient(
            180deg,
            rgba(5,65,72,.96) 0%,
            rgba(5,65,72,.91) 66%,
            rgba(5,65,72,.55) 86%,
            rgba(5,65,72,0) 100%
        );

    backdrop-filter:
        blur(24px)
        saturate(125%);

    -webkit-backdrop-filter:
        blur(24px)
        saturate(125%);

    transition:
        opacity .25s ease .32s;
}

.expansion.content-visible
.expanded-title-shield {

    opacity: 1;
}


/* =========================================================
   FLYING TITLE
========================================================= */

.flying-title {

    position: fixed;

    z-index: 5100;

    margin: 0;

    pointer-events: none;

    color:
        var(--text);

    font-weight: 900;

    line-height: .91;

    letter-spacing: -.064em;

    transform-origin:
        top left;

    will-change:
        left,
        top,
        font-size,
        width;

    transition:

        left .62s
        cubic-bezier(.18,.8,.2,1),

        top .62s
        cubic-bezier(.18,.8,.2,1),

        font-size .62s
        cubic-bezier(.18,.8,.2,1),

        line-height .62s
        cubic-bezier(.18,.8,.2,1),

        width .62s
        cubic-bezier(.18,.8,.2,1);
}

.flying-title.compact
.title-line {

    display: inline;
}


/* punctuation appears only open */

.flying-title[data-key="profile"].compact
.title-line:not(:last-child)::after {

    content: " ";
}

.flying-title[data-key="projects"].compact
.title-line:not(:last-child)::after {

    content: " ";
}

.flying-title[data-key="projects"].compact
.title-line:last-child::after {

    content: ".";
}

.flying-title[data-key="skills"].compact
.title-line::after {

    content: ". ";
}

.flying-title[data-key="gallery"].compact
.title-line::after {

    content: ". ";
}

.flying-title[data-key="mini"].compact
.title-line:not(:last-child)::after {

    content: " ";
}

.flying-title[data-key="mini"].compact
.title-line:last-child::after {

    content: ".";
}


/* =========================================================
   OPEN PANEL CONTENT

   Notice the large top padding.
   Nothing can now sit under the moving title.
========================================================= */

.expanded-content {

    position: absolute;

    inset: 0;

    overflow-y: auto;

    overflow-x: hidden;

    padding:

        145px

        clamp(20px,3.6vw,55px)

        40px;

    opacity: 0;

    transform:
        translateY(18px);

    transition:

        opacity .28s ease .39s,

        transform .4s ease .35s;
}

.expansion.content-visible
.expanded-content {

    opacity: 1;

    transform:
        translateY(0);
}

.expanded-content::-webkit-scrollbar {

    width: 7px;
}

.expanded-content::-webkit-scrollbar-track {

    background: transparent;
}

.expanded-content::-webkit-scrollbar-thumb {

    background:
        rgba(193,246,237,.32);

    border-radius: 10px;
}


/* =========================================================
   OPEN HEADER
========================================================= */

.expanded-header-row {

    position: relative;

    z-index: 2;

    margin-bottom: 28px;
}

.expanded-kicker {

    color:
        var(--greenBright);

    font-size: .72rem;

    font-weight: 900;

    letter-spacing: .14em;

    text-transform: uppercase;
}

.expanded-description {

    max-width: 850px;

    margin-top: 9px;

    color:
        var(--muted);

    font-size:
        clamp(.96rem,1.15vw,1.07rem);

    line-height: 1.7;
}


/* =========================================================
   CLOSE
========================================================= */

.expansion-close {

    position: fixed;

    z-index: 5200;

    width: 48px;

    height: 48px;

    display: flex;

    align-items: center;

    justify-content: center;

    border:
        1px solid
        rgba(193,246,237,.20);

    border-radius: 50%;

    background:
        rgba(2,53,60,.82);

    color: white;

    cursor: pointer;

    backdrop-filter:
        blur(14px);

    opacity: 0;

    transform:
        scale(.8);

    transition:

        opacity .25s ease .39s,

        transform .35s ease .37s,

        background .2s ease;
}

.expansion-close.visible {

    opacity: 1;

    transform:
        scale(1);
}

.expansion-close:hover {

    background:
        var(--green);
}


/* =========================================================
   OPEN PANEL MOVING FORMS
========================================================= */

.expanded-blob {

    position: absolute;

    width: 350px;

    height: 275px;

    right: -90px;

    top: -75px;

    opacity: .14;

    pointer-events: none;

    background:

        radial-gradient(
            circle at 30% 25%,
            #C1F6ED,
            #58DE8A 43%,
            #2EAF7D 69%,
            #176B57
        );

    border-radius:

        55% 45% 60% 40%

        /

        44% 58% 42% 56%;

    animation:
        openBlob
        8s ease-in-out
        infinite alternate;
}

.expanded-blob-small {

    position: absolute;

    width: 82px;

    height: 82px;

    right: 20%;

    top: 96px;

    opacity: .11;

    background:
        var(--aqua);

    border-radius: 50%;

    animation:
        openBlobSmall
        6.2s ease-in-out
        infinite alternate;
}

@keyframes openBlob {

    from {

        transform:
            translate(0,0)
            rotate(-4deg)
            scale(1);
    }

    to {

        transform:
            translate(-32px,25px)
            rotate(6deg)
            scale(1.08);

        border-radius:

            40% 60% 48% 52%

            /

            58% 40% 60% 42%;
    }
}

@keyframes openBlobSmall {

    from {

        transform:
            translate(0,0)
            scale(.9);
    }

    to {

        transform:
            translate(-44px,30px)
            scale(1.15);
    }
}


/* =========================================================
   TAGS
========================================================= */

.tags {

    margin-top: 18px;

    display: flex;

    flex-wrap: wrap;

    gap: 7px;
}

.tags span {

    padding:
        7px 10px;

    border-radius:
        999px;

    background:
        rgba(193,246,237,.08);

    color:
        var(--mint);

    font-size: .69rem;

    font-weight: 730;
}


/* =========================================================
   COVER FLOW WRAPPER
========================================================= */

.flow-section {

    position: relative;

    z-index: 3;
}

.flow-help {

    margin-bottom: 13px;

    color:
        var(--muted2);

    font-size: .74rem;
}


/* =========================================================
   COVER FLOW TRACK
========================================================= */

.cover-flow {

    --card-width:
        min(720px, 65vw);

    display: flex;

    gap: 18px;

    overflow-x: auto;

    overflow-y: hidden;

    padding:

        20px

        calc(
            (100% - var(--card-width)) / 2
        )

        18px;

    scroll-snap-type:
        x mandatory;

    scroll-behavior:
        smooth;

    overscroll-behavior-x:
        contain;

    scrollbar-width:
        none;

    perspective:
        1300px;

    touch-action:
        pan-x;
}

.cover-flow::-webkit-scrollbar {

    display: none;
}


/* =========================================================
   COVER FLOW CARD

   Landscape proportion.
========================================================= */

.flow-card {

    position: relative;

    flex:
        0 0
        var(--card-width);

    min-width: 0;

    min-height: 330px;

    scroll-snap-align:

/* =========================================================
   REFERENCES
========================================================= */

const panels =
    document.querySelectorAll(
        "[data-panel]"
    );


const backdrop =
    document.getElementById(
        "expansionBackdrop"
    );


const lightbox =
    document.getElementById(
        "lightbox"
    );


const lightboxImage =
    document.getElementById(
        "lightboxImage"
    );


const lightboxClose =
    document.getElementById(
        "lightboxClose"
    );


let activePanel =
    null;


let expansion =
    null;


let flyingTitle =
    null;


let closeButton =
    null;


/* =========================================================
   EXPANDED TITLE SIZE
========================================================= */

function getExpandedTitleSize(
    key,
    originalSize
) {

    const mobile =
        window.innerWidth <= 800;


    if (mobile) {


        if (key === "profile") {

            return Math.min(
                Math.max(
                    originalSize * .73,
                    31
                ),
                38
            );
        }


        if (key === "projects") {

            return Math.min(
                Math.max(
                    originalSize * .58,
                    25
                ),
                32
            );
        }


        if (key === "skills") {

            return Math.min(
                Math.max(
                    originalSize * .76,
                    20
                ),
                27
            );
        }


        if (
            key === "gallery"
            ||
            key === "mini"
        ) {

            return Math.min(
                Math.max(
                    originalSize * .70,
                    23
                ),
                30
            );
        }

    }


    else {


        if (key === "profile") {

            return Math.min(
                Math.max(
                    originalSize * .65,
                    48
                ),
                62
            );
        }


        if (key === "projects") {

            return Math.min(
                Math.max(
                    originalSize * .53,
                    36
                ),
                48
            );
        }


        if (key === "skills") {

            return Math.min(
                Math.max(
                    originalSize * .72,
                    31
                ),
                40
            );
        }


        if (
            key === "gallery"
            ||
            key === "mini"
        ) {

            return Math.min(
                Math.max(
                    originalSize * .68,
                    32
                ),
                42
            );
        }

    }


    return 32;
}


/* =========================================================
   OPEN PANEL
========================================================= */

function openPanel(panel) {


    if (activePanel) {
        return;
    }


    activePanel =
        panel;


    const key =
        panel.dataset.panel;


    const panelRect =
        panel.getBoundingClientRect();


    const originalTitle =
        panel.querySelector(
            "[data-title]"
        );


    const titleRect =
        originalTitle
        .getBoundingClientRect();


    const titleStyle =
        getComputedStyle(
            originalTitle
        );


    const panelStyle =
        getComputedStyle(
            panel
        );


    const originalFontSize =
        parseFloat(
            titleStyle.fontSize
        );


    /* -----------------------------------------------------
       BACKDROP
    ----------------------------------------------------- */

    backdrop.hidden =
        false;


    requestAnimationFrame(
        () => {

            backdrop.classList.add(
                "open"
            );

        }
    );


    /* -----------------------------------------------------
       EXPANDING BOX
    ----------------------------------------------------- */

    expansion =
        document.createElement(
            "div"
        );


    expansion.className =
        "expansion";


    expansion.style.left =
        `${panelRect.left}px`;


    expansion.style.top =
        `${panelRect.top}px`;


    expansion.style.width =
        `${panelRect.width}px`;


    expansion.style.height =
        `${panelRect.height}px`;


    expansion.style.borderRadius =
        panelStyle.borderRadius;


    expansion.innerHTML =
        `

        <div class="expanded-blob"></div>

        <div class="expanded-blob-small"></div>

        <div class="expanded-title-shield"></div>


        <div class="expanded-content">


            <div class="expanded-header-row">


                <div>


                    <div class="expanded-kicker">

                        ${content[key].kicker}

                    </div>


                    <div class="expanded-description">

                        ${content[key].description}

                    </div>


                </div>


            </div>


            ${content[key].html}


        </div>

        `;


    document.body.appendChild(
        expansion
    );


    /* -----------------------------------------------------
       FLYING TITLE
    ----------------------------------------------------- */

    flyingTitle =
        document.createElement(
            originalTitle.tagName
        );


    flyingTitle.className =
        "flying-title";


    flyingTitle.dataset.key =
        key;


    flyingTitle.innerHTML =
        originalTitle.innerHTML;


    flyingTitle.style.left =
        `${titleRect.left}px`;


    flyingTitle.style.top =
        `${titleRect.top}px`;


    flyingTitle.style.width =
        `${titleRect.width}px`;


    flyingTitle.style.fontSize =
        titleStyle.fontSize;


    flyingTitle.style.lineHeight =
        titleStyle.lineHeight;


    document.body.appendChild(
        flyingTitle
    );


    originalTitle.style.opacity =
        "0";


    panel.style.opacity =
        "0";


    /* -----------------------------------------------------
       FINAL BOX
    ----------------------------------------------------- */

    const margin =
        window.innerWidth <= 800
            ? 6
            : 22;


    const finalLeft =
        margin;


    const finalTop =
        margin;


    const finalWidth =
        window.innerWidth
        - margin * 2;


    const finalHeight =
        window.innerHeight
        - margin * 2;


    const finalTitleLeft =
        finalLeft
        + (
            window.innerWidth <= 800
                ? 18
                : 52
        );


    const finalTitleTop =
        finalTop
        + (
            window.innerWidth <= 800
                ? 21
                : 27
        );


    const finalTitleSize =
        getExpandedTitleSize(
            key,
            originalFontSize
        );


    const finalTitleWidth =
        Math.min(
            finalWidth * .78,
            1100
        );


    requestAnimationFrame(
        () => {


            expansion.style.left =
                `${finalLeft}px`;


            expansion.style.top =
                `${finalTop}px`;


            expansion.style.width =
                `${finalWidth}px`;


            expansion.style.height =
                `${finalHeight}px`;


            expansion.style.borderRadius =
                window.innerWidth <= 800
                    ? "23px"
                    : "38px";


            flyingTitle.style.left =
                `${finalTitleLeft}px`;


            flyingTitle.style.top =
                `${finalTitleTop}px`;


            flyingTitle.style.fontSize =
                `${finalTitleSize}px`;


            flyingTitle.style.lineHeight =
                "1.04";


            flyingTitle.style.width =
                `${finalTitleWidth}px`;


            flyingTitle.classList.add(
                "compact"
            );


        }
    );


    /* -----------------------------------------------------
       CLOSE
    ----------------------------------------------------- */

    closeButton =
        document.createElement(
            "button"
        );


    closeButton.className =
        "expansion-close";


    closeButton.innerHTML =
        `
        <i class="fa-solid fa-xmark"></i>
        `;


    document.body.appendChild(
        closeButton
    );


    positionCloseButton();


    closeButton.addEventListener(
        "click",
        closeActivePanel
    );


    /* -----------------------------------------------------
       SHOW CONTENT
    ----------------------------------------------------- */

    setTimeout(
        () => {


            if (!expansion) {
                return;
            }


            expansion.classList.add(
                "content-visible"
            );


            closeButton.classList.add(
                "visible"
            );


            initialiseCoverFlows();


            bindGalleryItems();


        },

        430
    );

}


/* =========================================================
   CLOSE PANEL
========================================================= */

function closeActivePanel() {


    if (
        !activePanel
        ||
        !expansion
        ||
        !flyingTitle
    ) {

        return;
    }


    const panel =
        activePanel;


    const originalTitle =
        panel.querySelector(
            "[data-title]"
        );


    panel.style.opacity =
        "1";


    originalTitle.style.opacity =
        "0";


    const panelDestination =
        panel.getBoundingClientRect();


    const titleDestination =
        originalTitle
        .getBoundingClientRect();


    const titleStyle =
        getComputedStyle(
            originalTitle
        );


    expansion.classList.remove(
        "content-visible"
    );


    if (closeButton) {

        closeButton.classList.remove(
            "visible"
        );

    }


    backdrop.classList.remove(
        "open"
    );


    flyingTitle.classList.remove(
        "compact"
    );


    /* BOX GOES HOME */

    expansion.style.left =
        `${panelDestination.left}px`;


    expansion.style.top =
        `${panelDestination.top}px`;


    expansion.style.width =
        `${panelDestination.width}px`;


    expansion.style.height =
        `${panelDestination.height}px`;


    expansion.style.borderRadius =
        getComputedStyle(panel)
        .borderRadius;


    /* TITLE GOES HOME */

    flyingTitle.style.left =
        `${titleDestination.left}px`;


    flyingTitle.style.top =
        `${titleDestination.top}px`;


    flyingTitle.style.width =
        `${titleDestination.width}px`;


    flyingTitle.style.fontSize =
        titleStyle.fontSize;


    flyingTitle.style.lineHeight =
        titleStyle.lineHeight;


    setTimeout(
        () => {


            originalTitle.style.opacity =
                "";


            expansion.remove();


            flyingTitle.remove();


            if (closeButton) {

                closeButton.remove();

            }


            backdrop.hidden =
                true;


            expansion =
                null;


            flyingTitle =
                null;


            closeButton =
                null;


            activePanel =
                null;


        },

        640
    );

}


/* =========================================================
   CLOSE POSITION
========================================================= */

function positionCloseButton() {


    if (!closeButton) {
        return;
    }


    const margin =
        window.innerWidth <= 800
            ? 15
            : 39;


    closeButton.style.top =
        `${margin}px`;


    closeButton.style.right =
        `${margin}px`;

}


/* =========================================================
   PANEL EVENTS
========================================================= */

panels.forEach(
    panel => {


        panel.addEventListener(
            "click",
            () => {

                openPanel(
                    panel
                );

            }
        );


    }
);


/* =========================================================
   BACKDROP
========================================================= */

backdrop.addEventListener(
    "click",
    closeActivePanel
);


/* =========================================================
   COVER FLOW
========================================================= */

function initialiseCoverFlows() {


    if (!expansion) {
        return;
    }


    expansion
        .querySelectorAll(
            "[data-cover-flow]"
        )
        .forEach(
            track => {


                const cards =
                    Array.from(
                        track.querySelectorAll(
                            ".flow-card"
                        )
                    );


                if (!cards.length) {
                    return;
                }


                const dotsContainer =
                    expansion.querySelector(
                        `[data-dots-for="${track.id}"]`
                    );


                let dots = [];


                /* -----------------------------------------
                   BUILD DOTS
                ----------------------------------------- */

                if (dotsContainer) {


                    dotsContainer.innerHTML =
                        "";


                    cards.forEach(
                        (card,index) => {


                            const dot =
                                document.createElement(
                                    "button"
                                );


                            dot.className =
                                "flow-dot";


                            dot.type =
                                "button";


                            dot.setAttribute(
                                "aria-label",
                                `Go to card ${index + 1}`
                            );


                            dot.addEventListener(
                                "click",
                                event => {


                                    event.stopPropagation();


                                    card.scrollIntoView({

                                        behavior:
                                            "smooth",

                                        inline:
                                            "center",

                                        block:
                                            "nearest"

                                    });


                                }
                            );


                            dotsContainer.appendChild(
                                dot
                            );


                            dots.push(
                                dot
                            );


                        }
                    );


                }


                let ticking =
                    false;


                /* -----------------------------------------
                   COVER FLOW CALCULATION
                ----------------------------------------- */

                function updateFlow() {


                    const trackRect =
                        track.getBoundingClientRect();


                    const trackCenter =
                        trackRect.left
                        +
                        trackRect.width / 2;


                    let closestIndex =
                        0;


                    let closestDistance =
                        Infinity;


                    cards.forEach(
                        (card,index) => {


                            const rect =
                                card.getBoundingClientRect();


                            const center =
                                rect.left
                                +
                                rect.width / 2;


                            const distance =
                                center
                                -
                                trackCenter;


                            const normal =
                                distance
                                /
                                rect.width;


                            const abs =
                                Math.min(
                                    Math.abs(normal),
                                    1.8
                                );


                            const scale =
                                1
                                -
                                Math.min(
                                    abs,
                                    1
                                )
                                *
                                .14;


                            const rotate =
                                Math.max(
                                    -18,
                                    Math.min(
                                        18,
                                        normal * -16
                                    )
                                );


                            const translateY =
                                Math.min(
                                    abs * 18,
                                    22
                                );


                            const opacity =
                                Math.max(
                                    .38,
                                    1
                                    -
                                    abs * .48
                                );


                            const blur =
                                Math.min(
                                    abs * .45,
                                    .7
                                );


                            card.style.transform =
                                `
                                perspective(1200px)
                                rotateY(${rotate}deg)
                                translateY(${translateY}px)
                                scale(${scale})
                                `;


                            card.style.opacity =
                                opacity;


                            card.style.filter =
                                `blur(${blur}px)`;


                            card.style.zIndex =
                                `${100 - Math.round(abs * 10)}`;


                            const absoluteDistance =
                                Math.abs(
                                    distance
                                );


                            if (
                                absoluteDistance
                                <
                                closestDistance
                            ) {


                                closestDistance =
                                    absoluteDistance;


                                closestIndex =
                                    index;


                            }


                        }
                    );


                    cards.forEach(
                        (card,index) => {


                            card.classList.toggle(
                                "is-center",
                                index === closestIndex
                            );


                        }
                    );


                    dots.forEach(
                        (dot,index) => {


                            dot.classList.toggle(
                                "active",
                                index === closestIndex
                            );


                        }
                    );


                    ticking =
                        false;


                }


                function requestUpdate() {


                    if (ticking) {
                        return;
                    }


                    ticking =
                        true;


                    requestAnimationFrame(
                        updateFlow
                    );


                }


                track.addEventListener(
                    "scroll",
                    requestUpdate,
                    {
                        passive: true
                    }
                );


                window.addEventListener(
                    "resize",
                    requestUpdate
                );


                /*
                    Ensure first card begins centered.
                */

                requestAnimationFrame(
                    () => {


                        cards[0]
                            .scrollIntoView({

                                behavior:
                                    "auto",

                                inline:
                                    "center",

                                block:
                                    "nearest"

                            });


                        requestUpdate();


                    }
                );


            }
        );

}


/* =========================================================
   GALLERY LIGHTBOX
========================================================= */

function bindGalleryItems() {


    if (!expansion) {
        return;
    }


    expansion
        .querySelectorAll(
            ".gallery-item"
        )
        .forEach(
            item => {


                if (
                    item.dataset.bound
                ) {

                    return;
                }


                item.dataset.bound =
                    "true";


                item.addEventListener(
                    "click",
                    event => {


                        /*
                           Only the centered Cover Flow
                           card opens. Side cards are
                           primarily for navigation.
                        */


                        if (
                            !item.classList.contains(
                                "is-center"
                            )
                        ) {


                            item.scrollIntoView({

                                behavior:
                                    "smooth",

                                inline:
                                    "center",

                                block:
                                    "nearest"

                            });


                            return;
                        }


                        event.stopPropagation();


                        lightboxImage.src =
                            item.dataset.image;


                        lightbox.classList.add(
                            "open"
                        );


                    }
                );


            }
        );

}


/* =========================================================
   LIGHTBOX
========================================================= */

function closeLightbox() {


    lightbox.classList.remove(
        "open"
    );


    lightboxImage.src =
        "";

}


lightboxClose.addEventListener(
    "click",
    closeLightbox
);


lightbox.addEventListener(
    "click",
    event => {


        if (
            event.target
            ===
            lightbox
        ) {


            closeLightbox();


        }


    }
);


/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    event => {


        if (
            event.key
            !==
            "Escape"
        ) {

            return;
        }


        if (
            lightbox.classList
            .contains(
                "open"
            )
        ) {


            closeLightbox();


            return;
        }


        closeActivePanel();


    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    positionCloseButton
);

</script>
