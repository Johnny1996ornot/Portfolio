function initialiseCoverFlows(){
if(!expansion)return;

expansion.querySelectorAll("[data-cover-flow]").forEach(track=>{
const cards=Array.from(track.querySelectorAll(".flow-card"));
if(!cards.length)return;

const dotsContainer=expansion.querySelector(`[data-dots-for="${track.id}"]`);
let dots=[];
let ticking=false;

function centerCard(card,smooth=true){
const target=card.offsetLeft-(track.clientWidth-card.offsetWidth)/2;
track.scrollTo({left:Math.max(0,target),behavior:smooth?"smooth":"auto"});
}

track._centerCard=centerCard;

if(dotsContainer){
dotsContainer.innerHTML="";
cards.forEach((card,index)=>{
const dot=document.createElement("button");
dot.className="flow-dot";
dot.type="button";
dot.setAttribute("aria-label",`Go to card ${index+1}`);
dot.addEventListener("click",event=>{
event.stopPropagation();
centerCard(card,true);
});
dotsContainer.appendChild(dot);
dots.push(dot);
});
}

function updateFlow(){
const viewportCenter=track.scrollLeft+track.clientWidth/2;
let closestIndex=0;
let closestDistance=Infinity;

cards.forEach((card,index)=>{
const center=card.offsetLeft+card.offsetWidth/2;
const distance=Math.abs(center-viewportCenter);
if(distance<closestDistance){
closestDistance=distance;
closestIndex=index;
}
});

cards.forEach((card,index)=>card.classList.toggle("is-center",index===closestIndex));
dots.forEach((dot,index)=>dot.classList.toggle("active",index===closestIndex));
ticking=false;
}

function requestUpdate(){
if(ticking)return;
ticking=true;
requestAnimationFrame(updateFlow);
}

track.addEventListener("scroll",requestUpdate,{passive:true});

cards.forEach(card=>{
card.addEventListener("click",event=>{
if(card.classList.contains("is-center"))return;
event.preventDefault();
event.stopPropagation();
centerCard(card,true);
});
});

requestAnimationFrame(()=>{
centerCard(cards[0],false);
requestAnimationFrame(updateFlow);
});
});
}

function bindGalleryItems(){
if(!expansion)return;

expansion.querySelectorAll(".gallery-item").forEach(item=>{
if(item.dataset.bound)return;
item.dataset.bound="true";

item.addEventListener("click",event=>{
if(!item.classList.contains("is-center")){
const track=item.closest("[data-cover-flow]");
if(track&&typeof track._centerCard==="function")track._centerCard(item,true);
return;
}

event.stopPropagation();
lightboxImage.src=item.dataset.image;
lightbox.classList.add("open");
});
});
}

<div class="case-section-head">
<div>
<div class="case-section-number">Data &amp; Methods</div>
<h2>Satellite observations provide the heat, vegetation and land-cover evidence.</h2>
</div>
<p class="case-section-intro">The analysis is implemented in <strong>Google Earth Engine</strong> and clipped to the Metro Manila study boundary. <strong>Landsat 9 Collection 2 Level-2</strong> provides the land-surface-temperature baseline. <strong>Sentinel-2 Surface Reflectance</strong> provides vegetation information through NDVI, while <strong>Dynamic World</strong> supplies land-cover context such as existing trees, built-up surfaces and water.</p>
</div>

<div class="heat-method-grid">
<article class="heat-method-step"><b>01 · Heat source</b><h3>Landsat 9 surface temperature</h3><p>Landsat 9 imagery describes the spatial pattern of land-surface temperature. Missing pixels are gap-filled to create a continuous 30-m working surface.</p></article>
<article class="heat-method-step"><b>02 · Vegetation source</b><h3>Sentinel-2 vegetation condition</h3><p>Sentinel-2 Surface Reflectance is used to describe existing vegetation through NDVI and related vegetation information.</p></article>
<article class="heat-method-step"><b>03 · Land-cover source</b><h3>Dynamic World land-cover context</h3><p>Dynamic World supplies land-cover context such as trees, built-up land and water to help interpret intervention suitability.</p></article>
<article class="heat-method-step"><b>04 · Spatial modelling</b><h3>Prioritisation and hotspot screening</h3><p>The model combines heat and intervention evidence into a final priority surface and identifies the Top 100 critical hotspot cells.</p></article>
</div>

<div class="heat-case-note">The maps are decision-support outputs, not automatic planting instructions. Final site selection still requires local land-use information, field validation, planting-space checks, utilities and implementation constraints.</div>
</section>

function bindCaseStudyLaunchers(){
if(!expansion)return;

expansion.querySelectorAll("[data-case-study]").forEach(card=>{
if(card.dataset.caseBound==="true")return;
card.dataset.caseBound="true";

const activate=event=>{
if(!card.classList.contains("is-center"))return;
event.preventDefault();
event.stopPropagation();
openCaseStudy(card.dataset.caseStudy);
};

card.addEventListener("click",activate);
card.addEventListener("keydown",event=>{
if(event.key==="Enter"||event.key===" ")activate(event);
});
});
}

function openCaseStudy(key){
if(!expansion||activeCaseStudy||!["conservation-policy","urban-heat"].includes(key))return;

activeCaseStudy=document.createElement("div");
activeCaseStudy.className="case-study-view";
activeCaseStudy.setAttribute("role","document");
activeCaseStudy.dataset.caseStudy=key;
activeCaseStudy.innerHTML=key==="urban-heat"?getUrbanHeatCaseStudyHTML():getConservationCaseStudyHTML();

expansion.appendChild(activeCaseStudy);
expansion.classList.add("case-study-active");
document.body.classList.add("research-case-open");

if(flyingTitle)flyingTitle.classList.add("case-study-hidden");

requestAnimationFrame(()=>activeCaseStudy.classList.add("open"));

const back=activeCaseStudy.querySelector("[data-case-back]");
if(back)back.addEventListener("click",event=>{
event.preventDefault();event.stopPropagation();closeCaseStudy();
});

const caseClose=activeCaseStudy.querySelector("[data-case-close]");
if(caseClose)caseClose.addEventListener("click",event=>{
event.preventDefault();event.stopPropagation();closeActivePanel();
});

hydrateCaseStudyMedia(activeCaseStudy);
bindCaseStudyInteractions(activeCaseStudy);
bindCaseScrollytelling(activeCaseStudy);
activeCaseStudy.scrollTop=0;
}

function closeCaseStudy(){
if(!activeCaseStudy)return;

const view=activeCaseStudy;

if(view._caseStoryCleanup){
view._caseStoryCleanup();
view._caseStoryCleanup=null;
}

if(view._caseStoryObserver){
view._caseStoryObserver.disconnect();
view._caseStoryObserver=null;
}

if(caseStudyObserver){
caseStudyObserver.disconnect();
caseStudyObserver=null;
}

view.classList.remove("open");
expansion?.classList.remove("case-study-active");
document.body.classList.remove("research-case-open");

if(flyingTitle)flyingTitle.classList.remove("case-study-hidden");

setTimeout(()=>{
if(view.isConnected)view.remove();
if(activeCaseStudy===view)activeCaseStudy=null;
closeButton?.classList.add("visible");
positionCloseButton();
},140);
}

function hydrateCaseStudyMedia(view){
const images=Array.from(view.querySelectorAll("img[data-src]"));

const loadImage=img=>{
const source=img.dataset.src;
if(!source)return;
img.src=source;
img.removeAttribute("data-src");
};

if(!("IntersectionObserver" in window)){
images.forEach(loadImage);
return;
}

caseStudyObserver=new IntersectionObserver(entries=>{
entries.forEach(entry=>{
if(!entry.isIntersecting)return;
loadImage(entry.target);
caseStudyObserver?.unobserve(entry.target);
});
},{
root:view,
rootMargin:"260px 0px",
threshold:.01
});

images.forEach(img=>caseStudyObserver.observe(img));
}

function bindCaseScrollytelling(view){
const steps=Array.from(view.querySelectorAll("[data-story-step]"));
const scenes=Array.from(view.querySelectorAll(".case-story-scene[data-scene]"));
const progressDots=Array.from(view.querySelectorAll("[data-story-jump]"));
const progressCount=view.querySelector("[data-story-progress-count]");
const progressCurrent=view.querySelector("[data-story-progress-current]");
const topbar=view.querySelector(".case-study-topbar");

if(!steps.length||!scenes.length)return;

/* =========================================================
   MOBILE
   Instead of hiding figures inside the desktop sticky stage,
   clone each matching scene directly below its explanation.
========================================================= */
if(window.matchMedia("(max-width:800px)").matches){

const scrolly=view.querySelector(".case-scrolly");
const desktopStage=view.querySelector(".case-story-stage");
const sceneByName=new Map(scenes.map(scene=>[scene.dataset.scene,scene]));

steps.forEach(step=>{
if(step.querySelector(":scope > .mobile-story-figure"))return;

const sceneName=step.dataset.sceneTarget;
const sourceScene=sceneByName.get(sceneName);
if(!sourceScene)return;

const figure=document.createElement("div");
figure.className="mobile-story-figure";
figure.dataset.mobileScene=sceneName;

const clone=sourceScene.cloneNode(true);
clone.classList.add("active");
clone.removeAttribute("data-scene");
clone.removeAttribute("aria-hidden");

clone.querySelectorAll("img").forEach(img=>{
const source=img.getAttribute("src")||img.dataset.sceneSrc||img.dataset.src;
if(source)img.src=source;
img.removeAttribute("data-src");
img.removeAttribute("data-scene-src");
img.loading="eager";
img.decoding="async";
});

figure.appendChild(clone);
step.appendChild(figure);
});

if(scrolly)scrolly.classList.add("mobile-inline-story-ready");
if(desktopStage)desktopStage.setAttribute("aria-hidden","true");

progressDots.forEach(dot=>{
dot.addEventListener("click",()=>{
const target=steps.find(step=>step.dataset.sceneTarget===dot.dataset.storyJump);
if(!target)return;

const targetTop=
view.scrollTop+
target.getBoundingClientRect().top-
view.getBoundingClientRect().top-
68;

view.scrollTo({
top:Math.max(0,targetTop),
behavior:"smooth"
});
});
});

/* Important: stop here. Mobile does not need desktop scene switching. */
return;
}

/* =========================================================
   DESKTOP SCROLLYTELLING
========================================================= */

const sceneLabels={
ecology:"01 · Pollinator ecology",
policy:"02 · Policy setup",
tradeoff:"03 · Habitat & connectivity",
targeting:"04 · Same-budget experiment",
participation:"05 · Participation",
spatial:"06 · Spatial allocation",
consensus:"07 · Consensus",
robustness:"08 · Robustness",
"heat-baseline":"01 · Baseline heat",
"heat-gapfill":"02 · Gap-filled LST",
"heat-tree":"03 · Tree priority",
"heat-urgency":"04 · Heat priority",
"heat-scale":"05 · 300 m context",
"heat-final":"06 · Final priority",
"heat-hotspots":"07 · Critical hotspots"
};

let activeSceneName="";
let rafId=0;

const storyImages=Array.from(view.querySelectorAll(".case-story-scene img"));

storyImages.forEach(img=>{
img.loading="eager";
img.decoding="async";

const source=img.getAttribute("src")||img.dataset.sceneSrc||img.dataset.src;
if(!source)return;
if(!img.getAttribute("src"))img.src=source;

const preloader=new Image();
preloader.src=source;
});

const getHeaderOffset=()=>{
const height=topbar?topbar.getBoundingClientRect().height:72;
return height+12;
};

const getReadingLineY=()=>{
const viewRect=view.getBoundingClientRect();
const headerBottom=viewRect.top+getHeaderOffset();
const visibleBottom=Math.min(viewRect.bottom,window.innerHeight);
const usableHeight=Math.max(220,visibleBottom-headerBottom);
return headerBottom+usableHeight*.42;
};

const getActiveStep=()=>{
const readingY=getReadingLineY();

for(const step of steps){
const rect=step.getBoundingClientRect();
if(readingY>=rect.top&&readingY<rect.bottom)return step;
}

let nearest=steps[0];
let nearestDistance=Infinity;

for(const step of steps){
const rect=step.getBoundingClientRect();
const centre=rect.top+rect.height/2;
const distance=Math.abs(centre-readingY);

if(distance<nearestDistance){
nearest=step;
nearestDistance=distance;
}
}

return nearest;
};

const activateScene=sceneName=>{
if(!sceneName||sceneName===activeSceneName)return;

activeSceneName=sceneName;

const activeIndex=Math.max(
0,
steps.findIndex(step=>step.dataset.sceneTarget===sceneName)
);

steps.forEach(step=>{
step.classList.toggle("active",step.dataset.sceneTarget===sceneName);
});

scenes.forEach(scene=>{
const active=scene.dataset.scene===sceneName;
scene.classList.toggle("active",active);
scene.setAttribute("aria-hidden",active?"false":"true");
});

progressDots.forEach(dot=>{
const active=dot.dataset.storyJump===sceneName;
dot.classList.toggle("active",active);

if(active)dot.setAttribute("aria-current","step");
else dot.removeAttribute("aria-current");
});

if(progressCount)progressCount.textContent=`${activeIndex+1} / ${steps.length}`;
if(progressCurrent)progressCurrent.textContent=sceneLabels[sceneName]||`Section ${activeIndex+1}`;
};

const updateFromScroll=()=>{
rafId=0;
const activeStep=getActiveStep();
if(!activeStep)return;
activateScene(activeStep.dataset.sceneTarget);
};

const scheduleUpdate=()=>{
if(rafId)return;
rafId=requestAnimationFrame(updateFromScroll);
};

const getScrollTopForStep=step=>{
const rect=step.getBoundingClientRect();
const currentReadingY=getReadingLineY();
const targetCentre=rect.top+rect.height*.50;

return Math.max(
0,
view.scrollTop+targetCentre-currentReadingY
);
};

progressDots.forEach(dot=>{
dot.addEventListener("click",()=>{
const target=steps.find(step=>step.dataset.sceneTarget===dot.dataset.storyJump);
if(!target)return;

activateScene(target.dataset.sceneTarget);

view.scrollTo({
top:getScrollTopForStep(target),
behavior:"auto"
});

requestAnimationFrame(updateFromScroll);
});
});

view.addEventListener("scroll",scheduleUpdate,{passive:true});
window.addEventListener("resize",scheduleUpdate,{passive:true});

activateScene(steps[0].dataset.sceneTarget);
requestAnimationFrame(updateFromScroll);

view._caseStoryCleanup=()=>{
view.removeEventListener("scroll",scheduleUpdate);
window.removeEventListener("resize",scheduleUpdate);

if(rafId)cancelAnimationFrame(rafId);
};
}

function bindCaseStudyInteractions(view){
const bars=Array.from(view.querySelectorAll(".consensus-bar"));
const mapImage=view.querySelector("#consensusMapImage");
const mapTitle=view.querySelector("#consensusMapTitle");
const mapDescription=view.querySelector("#consensusMapDescription");

bars.forEach(bar=>{
bar.addEventListener("click",()=>{
bars.forEach(item=>{
item.classList.remove("active");
item.setAttribute("aria-pressed","false");
});

bar.classList.add("active");
bar.setAttribute("aria-pressed","true");

if(mapImage){
mapImage.dataset.rawFallbackTried="false";
mapImage.removeAttribute("data-src");
mapImage.src=bar.dataset.map;
}

if(mapTitle)mapTitle.textContent=bar.dataset.title;
if(mapDescription)mapDescription.textContent=bar.dataset.copy;
});
});

view.querySelectorAll("[data-case-lightbox]").forEach(img=>{
img.addEventListener("click",()=>{
const source=img.currentSrc||img.src||img.dataset.src;
if(!source)return;

lightboxImage.src=source;
lightbox.classList.add("open");
});
});
}

function portfolioImageFallback(img){
if(!img||img.dataset.rawFallbackTried==="true")return;

try{
const current=new URL(img.currentSrc||img.src,window.location.href);
const filename=current.pathname.split("/").pop();

if(!filename)return;

img.dataset.rawFallbackTried="true";
img.src=`https://raw.githubusercontent.com/Johnny1996ornot/Portfolio/main/${filename}`;
}catch(error){}
}

function closeLightbox(){
lightbox.classList.remove("open");
lightboxImage.src="";
}

lightboxClose.addEventListener("click",closeLightbox);

lightbox.addEventListener("click",event=>{
if(event.target===lightbox)closeLightbox();
});

document.addEventListener("keydown",event=>{
if(event.key!=="Escape")return;

if(lightbox.classList.contains("open")){
closeLightbox();
return;
}

if(activeCaseStudy){
closeCaseStudy();
return;
}

closeActivePanel();
});

window.addEventListener("resize",positionCloseButton);
</script>
