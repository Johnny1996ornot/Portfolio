                        onerror="portfolioImageFallback(this)"
                        data-case-lightbox
                        alt="Trade-off between habitat and connectivity benefits"
                    >
                    <figcaption class="media-caption">
                        <span class="media-kicker">Figure</span>
                        <strong>Habitat-connectivity trade-off</strong>
                    </figcaption>
                </figure>

            </div>

            <div class="case-grid media-discussion case-figure-wide">

                <figure class="case-media">
                    <img
                        data-src="./04_Figure_Targeting_Advantage_vs_Random.png"
                        onerror="portfolioImageFallback(this)"
                        data-case-lightbox
                        alt="Ecological benefit of spatial targeting compared with random funding"
                    >
                    <figcaption class="media-caption">
                        <span class="media-kicker">Figure</span>
                        <strong>Targeting advantage relative to random allocation</strong>
                    </figcaption>
                </figure>

                <div class="case-discussion">
                    <h3>The trade-off is gradual rather than absolute</h3>
                    <p>
                        Habitat-only targeting produces the largest local habitat advantage over
                        random allocation at 53.0%, while still providing a 51.1% connectivity
                        advantage. As the policy gives more weight to connectivity, the model
                        accepts a gradual reduction in the local habitat gain in exchange for a
                        much stronger connectivity gain. This is why the points form a trade-off
                        rather than showing one strategy that is best at everything.
                    </p>
                    <p>
                        The 50/50 strategy is useful for understanding compromise. It retains
                        97.6% of the maximum habitat response and 96.4% of the maximum
                        connectivity response found among the tested strategies. In other words,
                        it gives up only a small amount of the best possible score for either
                        single objective while preserving strong performance in both.
                    </p>
                    <div class="case-callout">
                        These outputs represent modelled habitat and structural-connectivity
                        responses. They do not directly predict future species richness.
                    </div>
                </div>

            </div>

        </section>


        <section class="case-section" id="case-participation">

            <div class="case-section-head">
                <div class="case-section-number">04 · Management participation</div>
                <h2>Good targeting still depends on who can participate</h2>
                <p class="case-section-intro">
                    A map can identify an ecologically valuable place, but a policy cannot act
                    there unless the relevant land managers can actually participate. This section
                    treats participation as an implementation constraint. The model progressively
                    increases the share of eligible management units that are available and asks
                    how much of the ecological targeting advantage can still be achieved. The
                    animated map helps show the difference between an ecological priority and a
                    priority that is also practically available for funding.
                </p>
            </div>

            <div class="case-grid two">

                <figure class="case-media table-media">
                    <img
                        data-src="./05_Table_Management_Availability.png"
                        onerror="portfolioImageFallback(this)"
                        data-case-lightbox
                        alt="Effect of management availability on targeting performance table"
                    >
                    <figcaption class="media-caption">
                        <span class="media-kicker">Table 3</span>
                        <strong>Management availability and targeting performance</strong>
                    </figcaption>
                </figure>

                <figure class="case-media">
                    <img
                        data-src="./06_Figure_Management_Availability_Effect.png"
                        onerror="portfolioImageFallback(this)"
                        data-case-lightbox
                        alt="Management availability and value of spatial targeting line graph"
                    >
                    <figcaption class="media-caption">
                        <span class="media-kicker">Figure</span>
                        <strong>Targeting advantage rises with management availability</strong>
                    </figcaption>
                </figure>

            </div>

            <div class="case-gif-grid">

                <figure class="case-media">
                    <img
                        data-src="./18_Animated_Management_Availability.gif"
                        onerror="portfolioImageFallback(this)"
                        data-case-lightbox
                        alt="Animated management availability scenario"
                    >
                    <figcaption class="media-caption">
                        <span class="media-kicker">Animated scenario</span>
                        <strong>How participation constraints reshape the funded landscape</strong>
                    </figcaption>
                </figure>

                <div class="case-discussion">
                    <h3>Participation acts as an implementation constraint</h3>
                    <p>
                        At 25% management availability, the summary comparison reports no
                        targeting advantage over random. The reason is intuitive: when only a
                        small fraction of management units can participate, the model has little
                        freedom to choose the places it considers ecologically best. At 50%, 75%
                        and 100% availability, that choice set becomes larger and the ecological
                        value of spatial targeting rises sharply, especially for connectivity.
                    </p>
                    <p>
                        At full management availability, the 50/50 targeting scenario reaches a
                        59.5% habitat advantage and a 101.6% connectivity advantage over random
                        allocation. A value above 100% here means that the improvement relative to
                        the random baseline is slightly more than twice the baseline improvement
                        used for comparison; it does not mean that connectivity itself is "101.6%".
                        The animation makes the mechanism visible: the ecological ranking may stay
                        the same, but funding can only be placed where management capacity exists.
                    </p>
                </div>

            </div>

        </section>


        <section class="case-section" id="case-spatial">

            <div class="case-section-head">
                <div class="case-section-number">05 · Spatial allocation</div>
                <h2>The same budget can be dispersed or concentrated</h2>
                <p class="case-section-intro">
                    The main strategies spend the same annual budget and fund the same total
                    intervention area, but they distribute that intervention very differently.
                    Random allocation spreads funding across many cells. Ecological targeting
                    concentrates the same total area into fewer cells that score more highly for
                    habitat, connectivity or both. This section therefore separates programme
                    size from programme geography: the amount of funding is fixed, while its
                    spatial concentration changes.
                </p>
            </div>

            <div class="case-grid two">

                <figure class="case-media table-media">
                    <img
                        data-src="./07_Table_Spatial_Distribution_of_Reference_Budget.png"
                        onerror="portfolioImageFallback(this)"

                    <figcaption class="media-caption">
                        <span class="media-kicker">Table 4</span>
                        <strong>Spatial distribution of the same reference budget</strong>
                    </figcaption>
                </figure>

                <figure class="case-media">
                    <img
                        data-src="./08_Figure_Funding_Concentration.png"
                        onerror="portfolioImageFallback(this)"
                        data-case-lightbox
                        alt="Spatial concentration of the same conservation budget"
                    >
                    <figcaption class="media-caption">
                        <span class="media-kicker">Figure</span>
                        <strong>Targeted strategies fund fewer, higher-priority cells</strong>
                    </figcaption>
                </figure>

            </div>

            <div class="case-gif-grid">

                <figure class="case-media">
                    <img
                        data-src="./17_Animated_Policy_Allocation.gif"
                        onerror="portfolioImageFallback(this)"
                        data-case-lightbox
                        alt="Animated spatial conservation policy allocation"
                    >
                    <figcaption class="media-caption">
                        <span class="media-kicker">Animated allocation</span>
                        <strong>Funding locations shift as policy weighting changes</strong>
                    </figcaption>
                </figure>

                <div class="case-discussion">
                    <h3>Targeting concentrates rather than enlarges the programme</h3>
                    <p>
                        Random allocation spreads 2,793.77 ha across 390 selected 5-km cells,
                        averaging about 7.16 ha per selected cell. The targeted strategies use
                        exactly the same total intervention area but concentrate it into only
                        119 to 128 cells, with roughly 21.83 to 23.48 ha in each selected cell.
                        A useful analogy is pouring the same amount of water into many shallow
                        cups versus fewer deeper cups: the quantity is unchanged, but the spatial
                        concentration is very different.
                    </p>
                    <p>
                        The animated allocation shows the funded cells shifting as the policy
                        changes its ecological weighting. Habitat-oriented strategies concentrate
                        in one pattern, while connectivity-oriented strategies emphasise another.
                        Because the budget and total intervention area remain fixed, the ecological
                        gains should be interpreted as gains from better spatial targeting under
                        equal resources rather than gains from a larger programme.
                    </p>
                </div>

            </div>

        </section>


        <section class="case-section" id="case-consensus">

            <div class="case-section-head">
                <div class="case-section-number">06 · Interactive consensus priorities</div>
                <h2>Click a bar to see where that level of agreement occurs</h2>
                <p class="case-section-intro">
                    Some cells remain important even when the policy changes the balance between
                    habitat and connectivity. The consensus score counts how many of the five
                    targeted strategies select the same 5-km cell. A 5-of-5 cell is selected
                    under every ecological weighting and is therefore a particularly robust
                    spatial priority. Lower scores identify locations whose importance depends
                    more strongly on the chosen objective. Click the bars below to switch the map
                    and see where each level of agreement occurs.

                            75 cells remain priorities under every tested ecological weighting strategy.

        <section class="case-section" id="case-robustness">

            <div class="case-section-head">
                <div class="case-section-number">07 · Robustness</div>
                <h2>Do the targeting gains survive alternative assumptions?</h2>
                <p class="case-section-intro">
                    A model result is more convincing when it does not disappear after a small
                    change in assumptions. The robustness analysis therefore looks across the
                    tested budget and intervention-effect scenarios and records the lowest
                    advantage each focal strategy achieves over random allocation. This is a
                    conservative test: instead of highlighting the best run, it asks what remains
                    true under the least favourable tested condition.
                </p>
            </div>

            <div class="case-grid media-discussion">

                <figure class="case-media">
                    <img
                        data-src="./16_Figure_Robustness_of_Targeted_Allocation.png"
                        onerror="portfolioImageFallback(this)"
                        data-case-lightbox
                        alt="Robustness of targeted conservation allocation"
                    >
                    <figcaption class="media-caption">
                        <span class="media-kicker">Figure</span>
                        <strong>Worst-case advantage over random allocation</strong>
                    </figcaption>
                </figure>

                <div class="case-discussion">
                    <h3>All three tested focal strategies retain positive advantages</h3>
                    <p>
                        Connectivity-only targeting retains a minimum habitat advantage of 34.3%
                        and a minimum connectivity advantage of 49.2%. The 50/50 strategy retains
                        37.9% and 48.6%, while habitat-only targeting retains 42.1% and 42.3%,
                        respectively. All of these minimum values remain above zero, meaning that
                        each focal targeted strategy still performs better than the random baseline
                        even in its weakest tested scenario.
                    </p>
                    <p>
                        This does not prove that the same numerical advantage would occur under
                        every possible real-world condition. It does show that the observed benefit
                        is not created by only one exact model setting. The preferred strategy still
                        depends on whether policy values local habitat, connectivity or a balance of
                        both, but the general advantage of targeted allocation persists across the
                        scenarios that were tested.
                    </p>
                </div>

            </div>

        </section>


        <section class="case-section">
            <div class="case-conclusion">
                <div class="case-section-number">Takeaway</div>
                <h2>Where funding goes can matter as much as how much funding is available.</h2>
                <p>
                    Across the tested scenarios, the model shows that spatial decisions can change
                    what the same amount of conservation funding achieves. Habitat-focused strategies
                    favour stronger local habitat response, connectivity-focused strategies favour a
                    more connected landscape structure, and mixed strategies preserve much of both.
                    The participation experiment adds an important practical lesson: a mathematically
                    high-priority location is not automatically implementable if the people or
                    management units needed to act there are unavailable. The consensus analysis then
                    highlights places that remain priorities even when ecological goals change, while
                    the robustness analysis checks whether the targeting advantage survives alternative
                    assumptions. These maps are therefore decision-support outputs, not predictions of
                    exactly where future species will occur. They show how ecological goals, limited
                    budgets and implementation constraints can be examined together before real policy
                    decisions are made.
                </p>
            </div>
        </section>

function bindCaseStudyLaunchers() {

    if (!expansion) {
        return;
    }

    expansion
        .querySelectorAll("[data-case-study]")
        .forEach(card => {

            if (card.dataset.caseBound === "true") {
                return;
            }

            card.dataset.caseBound = "true";

            const activate = event => {

                if (!card.classList.contains("is-center")) {
                    return;
                }

                event.preventDefault();
                event.stopPropagation();

                openCaseStudy(
                    card.dataset.caseStudy
                );

            };

            card.addEventListener(
                "click",
                activate
            );

            card.addEventListener(
                "keydown",
                event => {

                    if (
                        event.key === "Enter"
                        || event.key === " "
                    ) {
                        activate(event);
                    }

                }
            );

        });

}


function openCaseStudy(key) {

    if (
        !expansion
        || activeCaseStudy
        || key !== "conservation-policy"
    ) {
        return;
    }

    activeCaseStudy =
        document.createElement("div");

    activeCaseStudy.className =
        "case-study-view";

    activeCaseStudy.setAttribute(
        "role",
        "document"
    );

    activeCaseStudy.innerHTML =
        getConservationCaseStudyHTML();

    expansion.appendChild(
        activeCaseStudy
    );

    expansion.classList.add(
        "case-study-active"
    );

    if (flyingTitle) {
        flyingTitle.classList.add(
            "case-study-hidden"
        );
    }

    requestAnimationFrame(() => {
        activeCaseStudy.classList.add(
            "open"
        );
    });

    const back =
        activeCaseStudy.querySelector(
            "[data-case-back]"
        );

    if (back) {
        back.addEventListener(
            "click",
            closeCaseStudy
        );
    }

    activeCaseStudy
        .querySelectorAll(".case-nav a")
        .forEach(link => {

            link.addEventListener(
                "click",
                event => {

                    const selector =
                        link.getAttribute("href");

                    const target =
                        activeCaseStudy.querySelector(
                            selector
                        );

                    if (!target) {
                        return;
                    }

                    event.preventDefault();

                    target.scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });

                }
            );

        });

    hydrateCaseStudyMedia(
        activeCaseStudy
    );

    bindCaseStudyInteractions(
        activeCaseStudy
    );

    activeCaseStudy.scrollTop = 0;

}


function closeCaseStudy() {

    if (!activeCaseStudy) {
        return;
    }

    const view =
        activeCaseStudy;

    view.classList.remove(
        "open"
    );

    expansion?.classList.remove(
        "case-study-active"
    );

    if (flyingTitle) {
        flyingTitle.classList.remove(
            "case-study-hidden"
        );
    }

    if (caseStudyObserver) {
        caseStudyObserver.disconnect();
        caseStudyObserver = null;
    }

    setTimeout(() => {

        if (view.isConnected) {
            view.remove();
        }

        if (activeCaseStudy === view) {
            activeCaseStudy = null;
        }

    }, 380);

}


function hydrateCaseStudyMedia(view) {

    const images =
        Array.from(
            view.querySelectorAll(
                "img[data-src]"
            )
        );

    const loadImage = img => {

        const source =
            img.dataset.src;

        if (!source) {
            return;
        }

        img.src = source;
        img.removeAttribute("data-src");

    };

    if (!("IntersectionObserver" in window)) {
        images.forEach(loadImage);
        return;
    }

    caseStudyObserver =
        new IntersectionObserver(
            entries => {

                entries.forEach(entry => {

                    if (!entry.isIntersecting) {
                        return;
                    }

                    loadImage(entry.target);
                    caseStudyObserver?.unobserve(
                        entry.target
                    );

                });

            },
            {
                root: view,
                rootMargin: "700px 0px",
                threshold: 0.01
            }
        );

    images.forEach(img => {
        caseStudyObserver.observe(img);
    });

}


function bindCaseStudyInteractions(view) {

    const bars =
        Array.from(
            view.querySelectorAll(
                ".consensus-bar"
            )
        );

    const mapImage =
        view.querySelector(
            "#consensusMapImage"
        );

    const mapTitle =
        view.querySelector(
            "#consensusMapTitle"
        );

    const mapDescription =
        view.querySelector(
            "#consensusMapDescription"
        );

    bars.forEach(bar => {

        bar.addEventListener(
            "click",
            () => {

                bars.forEach(item => {
                    item.classList.remove("active");
                    item.setAttribute("aria-pressed","false");
                });

                bar.classList.add("active");
                bar.setAttribute("aria-pressed","true");

                if (mapImage) {
                    mapImage.dataset.rawFallbackTried = "false";
                    mapImage.removeAttribute("data-src");
                    mapImage.src = bar.dataset.map;
                }

                if (mapTitle) {
                    mapTitle.textContent =
                        bar.dataset.title;
                }

                if (mapDescription) {
                    mapDescription.textContent =
                        bar.dataset.copy;
                }

            }
        );

    });


    view
        .querySelectorAll("[data-case-lightbox]")
        .forEach(img => {

            img.addEventListener(
                "click",
                () => {

                    const source =
                        img.currentSrc
                        || img.src
                        || img.dataset.src;

                    if (!source) {
                        return;
                    }

                    lightboxImage.src = source;
                    lightbox.classList.add("open");

                }
            );

        });

}


/* =========================================================
   IMAGE FALLBACK
========================================================= */

function portfolioImageFallback(img) {

    if (!img || img.dataset.rawFallbackTried === "true") {
        return;
    }

    try {

        const current =
            new URL(
                img.currentSrc || img.src,
                window.location.href
            );

        const filename =
            current.pathname
                .split("/")
                .pop();

        if (!filename) {
            return;
        }

        img.dataset.rawFallbackTried =
            "true";

        img.src =
            `https://raw.githubusercontent.com/Johnny1996ornot/Portfolio/main/${filename}`;

    }

    catch (error) {
        /* Avoid a retry loop. */
    }

}


/* =========================================================
   LIGHTBOX
========================================================= */

function closeLightbox() {


    lightbox.classList.remove(
        "open"
    );


    lightboxImage.src =
        "";

}


lightboxClose.addEventListener(
    "click",
    closeLightbox
);


lightbox.addEventListener(
    "click",
    event => {


        if (
            event.target
            ===
            lightbox
        ) {


            closeLightbox();


        }


    }
);


/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
    "keydown",
    event => {


        if (
            event.key
            !==
            "Escape"
        ) {

            return;
        }


        if (
            lightbox.classList
            .contains(
                "open"
            )
        ) {


            closeLightbox();


            return;
        }


        if (activeCaseStudy) {

            closeCaseStudy();

            return;
        }


        closeActivePanel();


    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    positionCloseButton
);
