    .case-scene-caption {
        position:
            relative !important;

        width:
            100% !important;

        min-height:
            0 !important;

        padding:
            11px
            13px
            13px !important;
    }


    .mobile-inline-figure
    .case-visual-panel,
    .mobile-inline-figure
    .case-ecology-diagram {
        position:
            relative !important;

        width:
            100% !important;

        height:
            auto !important;

        min-height:
            0 !important;

        max-height:
            none !important;

        overflow:
            visible !important;
    }


    .mobile-inline-figure
    .case-policy-grid,
    .mobile-inline-figure
    .case-ecology-flow-v3 {
        grid-template-columns:
            1fr !important;
    }

}

</style>


<script id="mobile-research-figures-script">

(() => {


    const isMobile =
        () =>
            window.matchMedia(
                "(max-width: 800px)"
            ).matches;


    function buildMobileInlineFigures(
        view
    ) {


        if (
            !isMobile()
            ||
            !view
        ) {
            return;
        }


        const scrolly =
            view.querySelector(
                ".case-scrolly"
            );


        if (
            !scrolly
            ||
            scrolly.dataset.mobileInlineBuilt
            ===
            "true"
        ) {
            return;
        }


        const copy =
            scrolly.querySelector(
                ":scope > .case-story-copy"
            );


        const stage =
            scrolly.querySelector(
                ":scope > .case-story-stage"
            );


        if (
            !copy
            ||
            !stage
        ) {
            return;
        }


        const steps =
            Array.from(
                copy.querySelectorAll(
                    "[data-story-step]"
                )
            );


        const scenes =
            Array.from(
                stage.querySelectorAll(
                    ".case-story-scene[data-scene]"
                )
            );


        if (
            !steps.length
            ||
            !scenes.length
        ) {
            return;
        }


        const sceneMap =
            new Map(
                scenes.map(
                    scene => [
                        scene.dataset.scene,
                        scene
                    ]
                )
            );


        let inserted =
            0;


        steps.forEach(
            step => {


                const sceneName =
                    step.dataset.sceneTarget;


                const sourceScene =
                    sceneMap.get(
                        sceneName
                    );


                if (!sourceScene) {
                    return;
                }


                const existing =
                    step.querySelector(
                        ":scope > .mobile-inline-figure"
                    );


                if (existing) {

                    inserted +=
                        1;

                    return;
                }


                const wrapper =
                    document.createElement(
                        "div"
                    );


                wrapper.className =
                    "mobile-inline-figure";


                const clone =
                    sourceScene.cloneNode(
                        true
                    );


                clone.classList.add(
                    "active"
                );


                clone.removeAttribute(
                    "data-scene"
                );


                clone.removeAttribute(
                    "aria-hidden"
                );


                clone
                .querySelectorAll(
                    "img"
                )
                .forEach(
                    img => {


                        const source =

                            img.getAttribute(
                                "src"
                            )

                            ||

                            img.dataset.src

                            ||

                            img.dataset.sceneSrc;


                        if (source) {

                            img.src =
                                source;
                        }


                        img.removeAttribute(
                            "data-src"
                        );


                        img.removeAttribute(
                            "data-scene-src"
                        );


                        img.loading =
                            "eager";


                        img.decoding =
                            "async";


                        img.addEventListener(

                            "error",

                            () => {


                                if (
                                    typeof portfolioImageFallback
                                    ===
                                    "function"
                                ) {

                                    portfolioImageFallback(
                                        img
                                    );
                                }
                            }
                        );


                        if (
                            img.hasAttribute(
                                "data-case-lightbox"
                            )
                        ) {


                            img.style.cursor =
                                "zoom-in";


                            img.addEventListener(

                                "click",

                                () => {


                                    const imageSource =

                                        img.currentSrc

                                        ||

                                        img.src;


                                    if (!imageSource) {
                                        return;
                                    }


                                    if (
                                        lightboxImage
                                        &&
                                        lightbox
                                    ) {


                                        lightboxImage.src =
                                            imageSource;


                                        lightbox.classList.add(
                                            "open"
                                        );
                                    }
                                }
                            );
                        }
                    }
                );


                wrapper.appendChild(
                    clone
                );


                step.appendChild(
                    wrapper
                );


                inserted +=
                    1;
            }
        );


        if (
            inserted
            ===
            steps.length
        ) {


            scrolly.classList.add(
                "mobile-inline-ready"
            );


            scrolly.dataset.mobileInlineBuilt =
                "true";
        }
    }


    function scan() {


        if (!isMobile()) {
            return;
        }


        document
        .querySelectorAll(
            ".case-study-view"
        )
        .forEach(
            buildMobileInlineFigures
        );
    }


    const observer =
        new MutationObserver(
            () => {


                requestAnimationFrame(
                    scan
                );
            }
        );


    observer.observe(
        document.body,
        {
            childList: true,
            subtree: true
        }
    );


    document.addEventListener(
        "DOMContentLoaded",
        scan
    );


    window.addEventListener(
        "resize",
        scan,
        {
            passive: true
        }
    );


    scan();

})();

</script>
