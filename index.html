<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>
    John Paolo Ramirez | Environmental · Geospatial · Data
</title>

<meta
    name="description"
    content="Portfolio of John Paolo Ramirez — environmental, geospatial and data analyst working with GIS, remote sensing, Google Earth Engine, Python, R, environmental assessment and scientific research."
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
>

<style>

/* =========================================================
   COLOR SYSTEM
========================================================= */

:root {

    --bg: #02353C;
    --bg2: #064149;

    --panel: #0A474D;
    --panel2: #0B5156;
    --panel3: #0B5A5D;

    --text: #F7FFFD;

    --muted: #C0DBD7;
    --muted2: #88B2AD;

    --mint: #C1F6ED;

    --green: #2EAF7D;
    --green2: #449342;
    --greenBright: #59E18D;

    --aqua: #3FD0C9;

    --line: rgba(193,246,237,.17);

    --radius: 29px;
}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
}

body {

    background:

        radial-gradient(
            circle at 3% 3%,
            rgba(63,208,201,.12),
            transparent 31%
        ),

        radial-gradient(
            circle at 97% 94%,
            rgba(46,175,125,.14),
            transparent 34%
        ),

        linear-gradient(
            145deg,
            #02353C,
            #043D43 55%,
            #063E42
        );

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    -webkit-font-smoothing: antialiased;

    text-rendering: optimizeLegibility;
}

button,
a {
    font: inherit;
}

button {
    color: inherit;
}

img {
    display: block;

    max-width: 100%;
}


/* =========================================================
   MAIN APP
========================================================= */

.app {

    width: 100%;

    height: 100svh;

    padding:
        clamp(10px, 1.6vw, 24px);

    display: flex;

    flex-direction: column;

    gap:
        clamp(8px, 1.15vw, 15px);
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar {

    min-height: 38px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;
}

.brand {

    display: flex;

    align-items: center;

    gap: 9px;

    color:
        var(--greenBright);

    font-size: .69rem;

    font-weight: 900;

    letter-spacing: .17em;

    text-transform: uppercase;
}

.hint {

    color:
        var(--muted2);

    font-size: .68rem;
}


/* =========================================================
   DASHBOARD
========================================================= */

.dashboard {

    min-height: 0;

    flex: 1;

    display: grid;

    grid-template-columns:
        repeat(12, minmax(0,1fr));

    grid-template-rows:
        repeat(2, minmax(0,1fr));

    gap:
        clamp(8px,1.2vw,16px);
}


/* =========================================================
   PANEL
========================================================= */

.panel {

    position: relative;

    min-width: 0;

    min-height: 0;

    overflow: hidden;

    padding:
        clamp(18px,2vw,32px);

    border:
        1px solid
        var(--line);

    border-radius:
        var(--radius);

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.025),
            transparent 46%
        ),

        var(--panel);

    color:
        var(--text);

    text-align: left;

    cursor: pointer;

    isolation: isolate;

    box-shadow:
        0 18px 40px
        rgba(0,24,27,.14);

    transition:

        transform .32s
        cubic-bezier(.2,.8,.2,1),

        border-color .3s ease,

        background .3s ease,

        box-shadow .3s ease;
}

.panel:hover {

    transform:
        translateY(-4px);

    background:
        var(--panel2);

    border-color:
        rgba(89,225,141,.30);

    box-shadow:
        0 22px 50px
        rgba(0,20,23,.23);
}

.panel:focus-visible {

    outline:
        2px solid
        var(--greenBright);

    outline-offset:
        3px;
}


/* =========================================================
   PANEL GRID
========================================================= */

.panel-profile {

    grid-column:
        span 7;
}

.panel-projects {

    grid-column:
        span 5;
}

.panel-skills,
.panel-gallery,
.panel-mini {

    grid-column:
        span 4;
}


/* =========================================================
   PANEL COMMON
========================================================= */

.panel-kicker {

    position: relative;

    z-index: 5;

    display:
        inline-flex;

    align-items:
        center;

    gap: 7px;

    color:
        var(--greenBright);

    font-size: .63rem;

    font-weight: 900;

    letter-spacing: .14em;

    text-transform: uppercase;
}

.panel-arrow {

    position: absolute;

    z-index: 15;

    top: 21px;

    right: 22px;

    width: 39px;

    height: 39px;

    border:
        1px solid
        var(--line);

    border-radius:
        50%;

    display: flex;

    align-items: center;

    justify-content: center;

    color:
        var(--mint);

    background:
        rgba(2,53,60,.28);

    transition:
        transform .3s ease,
        background .3s ease;
}

.panel:hover
.panel-arrow {

    transform:
        rotate(45deg);

    background:
        rgba(46,175,125,.18);
}


/* =========================================================
   SHARED TITLES
========================================================= */

.shared-title {

    position: relative;

    z-index: 5;

    margin: 0;

    color:
        var(--text);

    font-weight: 900;

    letter-spacing: -.064em;

    line-height: .91;

    transform-origin:
        top left;
}

.title-line {

    display: block;
}

.shared-title .accent,
.flying-title .accent {

    color:
        var(--greenBright);
}


/* HOME SIZES */

.panel-profile
.shared-title {

    font-size:
        clamp(2.8rem,5.55vw,6.7rem);
}

.panel-projects
.shared-title {

    font-size:
        clamp(2.1rem,3.95vw,4.6rem);
}

.panel-skills
.shared-title {

    font-size:
        clamp(1.35rem,2.4vw,2.8rem);

    line-height: 1;
}

.panel-gallery
.shared-title,
.panel-mini
.shared-title {

    font-size:
        clamp(1.75rem,2.9vw,3.4rem);
}


/* =========================================================
   PROFILE PANEL
========================================================= */

.panel-profile {

    display: flex;

    flex-direction: column;

    justify-content:
        space-between;

    background:

        radial-gradient(
            circle at 82% 16%,
            rgba(63,208,201,.15),
            transparent 40%
        ),

        linear-gradient(
            138deg,
            #09454B,
            #0B4D50
        );
}

.profile-content {

    position: relative;

    z-index: 5;

    max-width: 68%;
}

.profile-copy {

    margin-top: 14px;

    max-width: 680px;

    color:
        var(--muted);

    font-size:
        clamp(.82rem,1.05vw,1rem);

    line-height: 1.55;
}

.bottom-note {

    position: relative;

    z-index: 5;

    color:
        var(--muted2);

    font-size: .66rem;
}


/* =========================================================
   PROFILE MOVING PLANETS
========================================================= */

.planet-system {

    position: absolute;

    right: 1%;

    top: 4%;

    width: 40%;

    height: 91%;

    z-index: 1;

    pointer-events: none;
}

.orbit {

    position: absolute;

    border:
        1px solid
        rgba(193,246,237,.12);

    border-radius: 50%;

    animation:
        orbitSpin linear infinite;
}

.orbit1 {

    width: 285px;

    height: 285px;

    right: 6%;

    top: 3%;

    animation-duration:
        20s;
}

.orbit2 {

    width: 205px;

    height: 205px;

    right: 20%;

    top: 18%;

    animation-duration:
        14s;

    animation-direction:
        reverse;
}

.orbit3 {

    width: 350px;

    height: 180px;

    right: -7%;

    bottom: 2%;

    transform:
        rotate(-21deg);

    animation-duration:
        24s;
}

@keyframes orbitSpin {

    to {

        transform:
            rotate(360deg);
    }
}


.planet {

    position: absolute;

    border-radius: 50%;

    box-shadow:

        inset -24px -25px 45px
        rgba(0,69,62,.25),

        inset 18px 16px 32px
        rgba(255,255,255,.13),

        0 20px 36px
        rgba(0,28,31,.18);

    animation:
        planetFloat
        ease-in-out
        infinite alternate;
}

.planet1 {

    width: 155px;

    height: 155px;

    right: 16%;

    top: 9%;

    background:

        radial-gradient(
            circle at 30% 24%,
            #C1F6ED,
            #65DA9B 43%,
            #2EAF7D 72%,
            #166750
        );

    animation-duration:
        7s;
}

.planet2 {

    width: 108px;

    height: 108px;

    right: 1%;

    top: 50%;

    background:

        radial-gradient(
            circle at 30% 23%,
            #98DEA6,
            #55C685 48%,
            #267F65
        );

    animation-duration:
        6.2s;

    animation-delay:
        -1.8s;
}

.planet3 {

    width: 63px;

    height: 63px;

    right: 45%;

    top: 59%;

    background:

        radial-gradient(
            circle at 34% 26%,
            #C1F6ED,
            #3FD0C9 45%,
            #18766F
        );

    animation-duration:
        5.1s;
}

.planet4 {

    width: 29px;

    height: 29px;

    right: 51%;

    top: 18%;

    background:
        var(--greenBright);

    animation-duration:
        4.2s;

    box-shadow:
        0 0 24px
        rgba(89,225,141,.35);
}

@keyframes planetFloat {

    from {

        transform:
            translate3d(0,-7px,0)
            scale(.98);
    }

    to {

        transform:
            translate3d(10px,11px,0)
            scale(1.04);
    }
}


.particle {

    position: absolute;

    width: 7px;

    height: 7px;

    border-radius: 50%;

    background:
        var(--mint);

    animation:
        particlePulse
        3s ease-in-out
        infinite;
}

.particle1 {

    right: 52%;

    top: 40%;
}

.particle2 {

    right: 5%;

    top: 31%;

    animation-delay:
        -1s;
}

.particle3 {

    right: 33%;

    bottom: 8%;

    animation-delay:
        -2s;
}

@keyframes particlePulse {

    0%,
    100% {

        opacity: .18;

        transform:
            scale(.7);
    }

    50% {

        opacity: .9;

        transform:
            scale(1.4);
    }
}


/* =========================================================
   PROJECT PANEL
========================================================= */

.panel-projects {

    display: flex;

    flex-direction: column;

    justify-content:
        space-between;
}

.project-preview {

    display: grid;

    gap: 7px;
}

.preview-line {

    padding-top: 8px;

    display: flex;

    justify-content:
        space-between;

    gap: 12px;

    border-top:
        1px solid
        var(--line);

    font-size: .67rem;
}

.preview-line strong {

    color:
        var(--text);
}

.preview-line span {

    color:
        var(--muted2);
}


/* =========================================================
   SKILLS
========================================================= */

.panel-skills {

    display: flex;

    flex-direction: column;

    justify-content:
        space-between;
}

.skill-preview {

    display: flex;

    flex-wrap: wrap;

    gap: 6px;
}

.skill-preview span {

    padding:
        6px 9px;

    border:
        1px solid
        var(--line);

    border-radius:
        999px;

    color:
        var(--muted);

    font-size: .61rem;

    font-weight: 720;
}


/* =========================================================
   SELECTED WORK
========================================================= */

.panel-gallery {

    display: flex;

    flex-direction: column;

    justify-content:
        space-between;
}

.thumb-strip {

    height: 38%;

    min-height: 82px;

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 7px;
}

.thumb {

    position: relative;

    overflow: hidden;

    border:
        1px solid
        var(--line);

    border-radius: 11px;

    background:
        #07393E;
}

.thumb img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    transition:
        transform .35s ease;
}

.panel-gallery:hover
.thumb img {

    transform:
        scale(1.06);
}


/* =========================================================
   MINI PROJECTS PANEL
========================================================= */

.panel-mini {

    display: flex;

    flex-direction: column;

    justify-content:
        space-between;
}

.mini-preview {

    display: grid;

    gap: 7px;
}

.mini-preview-row {

    padding-top: 8px;

    display: flex;

    align-items: center;

    justify-content:
        space-between;

    border-top:
        1px solid
        var(--line);

    color:
        var(--muted);

    font-size: .63rem;
}

.mini-preview-row strong {

    color:
        var(--text);
}


/* =========================================================
   OPENING BACKDROP
========================================================= */

.expansion-backdrop {

    position: fixed;

    inset: 0;

    z-index: 4990;

    background:
        rgba(1,29,33,.72);

    backdrop-filter:
        blur(13px);

    -webkit-backdrop-filter:
        blur(13px);

    opacity: 0;

    transition:
        opacity .4s ease;
}

.expansion-backdrop.open {

    opacity: 1;
}


/* =========================================================
   EXPANDING PANEL
========================================================= */

.expansion {

    position: fixed;

    z-index: 5000;

    overflow: hidden;

    border:
        1px solid
        rgba(193,246,237,.18);

    background:

        radial-gradient(
            circle at 85% 0%,
            rgba(46,175,125,.16),
            transparent 34%
        ),

        linear-gradient(
            145deg,
            #064149,
            #07434A
        );

    box-shadow:

        0 40px 110px
        rgba(0,20,24,.58);

    will-change:
        left,
        top,
        width,
        height,
        border-radius;

    transition:

        left .62s
        cubic-bezier(.18,.8,.2,1),

        top .62s
        cubic-bezier(.18,.8,.2,1),

        width .62s
        cubic-bezier(.18,.8,.2,1),

        height .62s
        cubic-bezier(.18,.8,.2,1),

        border-radius .62s
        cubic-bezier(.18,.8,.2,1);
}


/* =========================================================
   BLURRED TITLE BACKGROUND

   This remains fixed while the inner content scrolls
   underneath it.
========================================================= */

.expanded-title-shield {

    position: absolute;

    z-index: 5050;

    top: 0;

    left: 0;

    right: 0;

    height: 124px;

    pointer-events: none;

    opacity: 0;

    background:

        linear-gradient(
            180deg,
            rgba(5,65,72,.96) 0%,
            rgba(5,65,72,.91) 66%,
            rgba(5,65,72,.55) 86%,
            rgba(5,65,72,0) 100%
        );

    backdrop-filter:
        blur(24px)
        saturate(125%);

    -webkit-backdrop-filter:
        blur(24px)
        saturate(125%);

    transition:
        opacity .25s ease .32s;
}

.expansion.content-visible
.expanded-title-shield {

    opacity: 1;
}


/* =========================================================
   FLYING TITLE
========================================================= */

.flying-title {

    position: fixed;

    z-index: 5100;

    margin: 0;

    pointer-events: none;

    color:
        var(--text);

    font-weight: 900;

    line-height: .91;

    letter-spacing: -.064em;

    transform-origin:
        top left;

    will-change:
        left,
        top,
        font-size,
        width;

    transition:

        left .62s
        cubic-bezier(.18,.8,.2,1),

        top .62s
        cubic-bezier(.18,.8,.2,1),

        font-size .62s
        cubic-bezier(.18,.8,.2,1),

        line-height .62s
        cubic-bezier(.18,.8,.2,1),

        width .62s
        cubic-bezier(.18,.8,.2,1);
}

.flying-title.compact
.title-line {

    display: inline;
}


/* punctuation appears only open */

.flying-title[data-key="profile"].compact
.title-line:not(:last-child)::after {

    content: " ";
}

.flying-title[data-key="projects"].compact
.title-line:not(:last-child)::after {

    content: " ";
}

.flying-title[data-key="projects"].compact
.title-line:last-child::after {

    content: ".";
}

.flying-title[data-key="skills"].compact
.title-line::after {

    content: ". ";
}

.flying-title[data-key="gallery"].compact
.title-line::after {

    content: ". ";
}

.flying-title[data-key="mini"].compact
.title-line:not(:last-child)::after {

    content: " ";
}

.flying-title[data-key="mini"].compact
.title-line:last-child::after {

    content: ".";
}


/* =========================================================
   OPEN PANEL CONTENT

   Notice the large top padding.
   Nothing can now sit under the moving title.
========================================================= */

.expanded-content {

    position: absolute;

    inset: 0;

    overflow-y: auto;

    overflow-x: hidden;

    padding:

        145px

        clamp(20px,3.6vw,55px)

        40px;

    opacity: 0;

    transform:
        translateY(18px);

    transition:

        opacity .28s ease .39s,

        transform .4s ease .35s;
}

.expansion.content-visible
.expanded-content {

    opacity: 1;

    transform:
        translateY(0);
}

.expanded-content::-webkit-scrollbar {

    width: 7px;
}

.expanded-content::-webkit-scrollbar-track {

    background: transparent;
}

.expanded-content::-webkit-scrollbar-thumb {

    background:
        rgba(193,246,237,.32);

    border-radius: 10px;
}



/* =========================================================
   CLEAN REVERSE / CLOSE ANIMATION
========================================================= */

.expansion.is-closing .expanded-content {
    opacity: 0;
    transform: translateY(8px);

    transition:
        opacity .15s ease,
        transform .15s ease;

    pointer-events: none;
}

.expansion.is-closing .expanded-title-shield {
    opacity: 0;

    transition:
        opacity .14s ease;
}

.expansion.is-closing .expanded-blob,
.expansion.is-closing .expanded-blob-small {
    opacity: 0;

    transition:
        opacity .14s ease;
}

/*
   Once the content has faded, the returning object is just
   the clean panel shell and the traveling title.
*/
.expansion.geometry-closing .expanded-content,
.expansion.geometry-closing .expanded-title-shield,
.expansion.geometry-closing .expanded-blob,
.expansion.geometry-closing .expanded-blob-small {
    visibility: hidden;
}

/*
   Keep the dashboard destination invisible until the
   animated shell has actually reached it.
*/
.panel.panel-return-target {
    opacity: 0 !important;
    pointer-events: none;
}

/* =========================================================
   OPEN HEADER
========================================================= */

.expanded-header-row {

    position: relative;

    z-index: 2;

    margin-bottom: 28px;
}

.expanded-kicker {

    color:
        var(--greenBright);

    font-size: .72rem;

    font-weight: 900;

    letter-spacing: .14em;

    text-transform: uppercase;
}

.expanded-description {

    max-width: 850px;

    margin-top: 9px;

    color:
        var(--muted);

    font-size:
        clamp(.96rem,1.15vw,1.07rem);

    line-height: 1.7;
}


/* =========================================================
   CLOSE
========================================================= */

.expansion-close {

    position: fixed;

    z-index: 5200;

    width: 48px;

    height: 48px;

    display: flex;

    align-items: center;

    justify-content: center;

    border:
        1px solid
        rgba(193,246,237,.20);

    border-radius: 50%;

    background:
        rgba(2,53,60,.82);

    color: white;

    cursor: pointer;

    backdrop-filter:
        blur(14px);

    opacity: 0;

    transform:
        scale(.8);

    transition:

        opacity .25s ease .39s,

        transform .35s ease .37s,

        background .2s ease;
}

.expansion-close.visible {

    opacity: 1;

    transform:
        scale(1);
}

.expansion-close:hover {

    background:
        var(--green);
}


/* =========================================================
   OPEN PANEL MOVING FORMS
========================================================= */

.expanded-blob {

    position: absolute;

    width: 350px;

    height: 275px;

    right: -90px;

    top: -75px;

    opacity: .14;

    pointer-events: none;

    background:

        radial-gradient(
            circle at 30% 25%,
            #C1F6ED,
            #58DE8A 43%,
            #2EAF7D 69%,
            #176B57
        );

    border-radius:

        55% 45% 60% 40%

        /

        44% 58% 42% 56%;

    animation:
        openBlob
        8s ease-in-out
        infinite alternate;
}

.expanded-blob-small {

    position: absolute;

    width: 82px;

    height: 82px;

    right: 20%;

    top: 96px;

    opacity: .11;

    background:
        var(--aqua);

    border-radius: 50%;

    animation:
        openBlobSmall
        6.2s ease-in-out
        infinite alternate;
}

@keyframes openBlob {

    from {

        transform:
            translate(0,0)
            rotate(-4deg)
            scale(1);
    }

    to {

        transform:
            translate(-32px,25px)
            rotate(6deg)
            scale(1.08);

        border-radius:

            40% 60% 48% 52%

            /

            58% 40% 60% 42%;
    }
}

@keyframes openBlobSmall {

    from {

        transform:
            translate(0,0)
            scale(.9);
    }

    to {

        transform:
            translate(-44px,30px)
            scale(1.15);
    }
}


/* =========================================================
   TAGS
========================================================= */

.tags {

    margin-top: 18px;

    display: flex;

    flex-wrap: wrap;

    gap: 7px;
}

.tags span {

    padding:
        7px 10px;

    border-radius:
        999px;

    background:
        rgba(193,246,237,.08);

    color:
        var(--mint);

    font-size: .69rem;

    font-weight: 730;
}



/* =========================================================
   COVER FLOW WRAPPER
========================================================= */

.flow-section {
    position: relative;
    z-index: 3;
}

.flow-help {
    margin-bottom: 10px;
    color: var(--muted2);
    font-size: .78rem;
    text-align: center;
}


/* =========================================================
   COVER FLOW TRACK
   Portrait / UNO-card proportions.
========================================================= */

.cover-flow {
    --card-width: clamp(300px, 27vw, 360px);

    display: flex;
    align-items: center;
    gap: clamp(12px, 1.5vw, 20px);

    overflow-x: auto;
    overflow-y: visible;

    padding:
        22px
        calc((100% - var(--card-width)) / 2)
        20px;

    scroll-snap-type: x mandatory;
    scroll-padding-inline:
        calc((100% - var(--card-width)) / 2);

    scroll-behavior: smooth;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;

    perspective: 1450px;
    touch-action: pan-x;

    /*
       Prevent the carousel from nudging the surrounding
       expanded panel while it is being scrolled.
    */
    contain: layout style;
}

.cover-flow::-webkit-scrollbar {
    display: none;
}


/* =========================================================
   COVER FLOW CARD
   Vertical 2:3 gaming / UNO-card shape.
========================================================= */

.flow-card {
    position: relative;

    flex: 0 0 var(--card-width);
    width: var(--card-width);
    aspect-ratio: 2 / 3;

    min-width: 0;

    scroll-snap-align: center;
    scroll-snap-stop: always;

    overflow: hidden;

    padding: clamp(24px, 2vw, 31px);

    display: flex;
    flex-direction: column;

    border:
        1px solid
        rgba(193,246,237,.18);

    border-radius: 28px;

    background:
        radial-gradient(
            circle at 85% 8%,
            rgba(89,225,141,.08),
            transparent 36%
        ),
        linear-gradient(
            145deg,
            rgba(193,246,237,.05),
            rgba(46,175,125,.025)
        ),
        rgba(10,76,81,.96);

    box-shadow:
        0 20px 45px
        rgba(0,25,28,.20);

    transform-style: preserve-3d;
    transform-origin: center center;

    opacity: .58;

    /*
       Transform intentionally has NO CSS transition.
       It follows the finger / scroll position frame by frame.
       This removes the previous left-shift-then-correct motion.
    */
    transition:
        opacity .10s linear,
        filter .10s linear,
        border-color .20s ease,
        box-shadow .20s ease;

    will-change:
        transform,
        opacity,
        filter;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

.flow-card.is-center {
    border-color:
        rgba(89,225,141,.48);

    box-shadow:
        0 30px 72px
        rgba(0,24,27,.32),
        0 0 0 1px
        rgba(89,225,141,.07);
}

.card-label {
    color: var(--greenBright);

    font-size: .79rem;
    font-weight: 900;

    letter-spacing: .095em;
    line-height: 1.35;

    text-transform: uppercase;
}

.flow-card h3 {
    margin: 22px 0 0;

    font-size:
        clamp(1.65rem, 2.15vw, 2.05rem);

    line-height: 1.12;

    letter-spacing: -.035em;
}

.flow-card p {
    margin: 16px 0 0;

    color: var(--muted);

    font-size:
        clamp(1rem, 1.08vw, 1.10rem);

    line-height: 1.62;
}

.flow-card .tags {
    margin-top: auto;
    padding-top: 22px;
}

.tags {
    gap: 7px;
}

.tags span {
    font-size: .73rem;
}


/* =========================================================
   SKILL FLOW CARD
========================================================= */

.skill-heading {

    align-items: center;
    gap: 14px;
}

.card-icon {

========================================================= */

========================================================= */

    .expansion-projects .left-rail-scene,
    .expansion-skills .left-rail-scene {

        width: 100%;
        height:

        left: 9%;
        right: 9%;
        bottom: 7px;

        height: 1px;

        background:
            linear-gradient(
                90deg,
                transparent,
                rgba(193,246,237,.28),
                transparent
            );

    /* =======================
       RESEARCH / TYPING SCENE
    ======================= */

    .research-scene {
        opacity: .94;
    }

    .research-scene svg {
        width: 100%;
        height: 100%;

        overflow: visible;
    }

    .research-scene .scene-white {
        stroke: rgba(250,255,254,.95);
        fill: none;

        stroke-width: 13;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .research-scene .scene-soft {
        stroke: rgba(193,246,237,.24);
        fill: none;

        stroke-width: 4;
        stroke-linecap: round;
    }

    .research-scene .person-head {
        fill: rgba(250,255,254,.97);
    }

    .research-scene .desk-line {
        stroke: rgba(250,255,254,.72);
        stroke-width: 8;
        stroke-linecap: round;
    }

    .research-scene .laptop-body {
        fill: rgba(89,225,141,.14);
        stroke: rgba(250,255,254,.88);
        stroke-width: 5;
    }

    .research-scene .laptop-screen-glow {
        fill: rgba(89,225,141,.32);

        animation:
            laptopGlow 1.8s ease-in-out infinite alternate;
    }

    .research-scene .typing-left,
    .research-scene .typing-right {
        transform-box: fill-box;
        transform-origin: 0% 50%;
    }

    .research-scene .typing-left {
        animation:
            typingLeft .38s ease-in-out infinite alternate;
    }

    .research-scene .typing-right {
        animation:
            typingRight .42s ease-in-out infinite alternate-reverse;
    }

    .research-scene .screen-dot {
        fill: var(--greenBright);

        animation:
            codeBlink 1.25s steps(2,end) infinite;
    }

    .research-scene .code-line {
        stroke: rgba(193,246,237,.68);
        stroke-width: 4;
        stroke-linecap: round;
    }

    @keyframes typingLeft {
        from {
            transform: rotate(-4deg) translateY(0);
        }

        to {
            transform: rotate(4deg) translateY(4px);
        }
    }

    @keyframes typingRight {
        from {
            transform: rotate(3deg) translateY(3px);
        }

        to {
            transform: rotate(-5deg) translateY(0);
        }
    }

    @keyframes laptopGlow {
        from {
            opacity: .35;
        }

        to {
            opacity: .78;
        }
    }

    @keyframes codeBlink {
        50% {
            opacity: .18;
        }
    }


    /* =======================
       SKILLS / FOREST SCENE
    ======================= */

    .forest-scene {
        isolation: isolate;
    }

    .forest-haze {
        position: absolute;
        inset: 18% 0 0 0;

        background:
            linear-gradient(
                180deg,
                rgba(63,208,201,.00),
                rgba(63,208,201,.045) 60%,
                rgba(89,225,141,.07)
            );

        border-radius: 44% 44% 0 0;
    }

    .forest-track {
        position: absolute;
        left: 0;
        bottom: 9px;

        width: 100%;
        height: 84%;

        animation:
            forestPass 11s linear infinite;

        will-change: transform;
    }

    .forest-track.track-two {
        left: 100%;
    }

    .forest-tree {
        --tree-scale: 1;

        position: absolute;
        bottom: 11px;

        width: 50px;
        height: 145px;

        transform:
            scale(var(--tree-scale));

        transform-origin:
            bottom center;

        opacity: .70;
    }

    .forest-tree::before {
        content: "";

        position: absolute;
        left: 20px;
        bottom: 0;

        width: 10px;
        height: 83px;

        border-radius: 999px;

        background:
            rgba(238,255,250,.69);
    }

    .forest-tree::after {
        content: "";

        position: absolute;
        left: -5px;
        top: 0;

        width: 60px;
        height: 78px;

        border-radius:
            52% 48% 55% 45%
            /
            44% 56% 44% 56%;

        background:
            radial-gradient(
                circle at 36% 30%,
                rgba(193,246,237,.82),
                rgba(89,225,141,.55) 48%,
                rgba(46,175,125,.28) 100%
            );
    }

    .forest-tree.t1 {
        left: 2%;
        --tree-scale: .72;
        opacity: .43;
    }

    .forest-tree.t2 {
        left: 19%;
        --tree-scale: 1.04;
    }

    .forest-tree.t3 {
        left: 43%;
        --tree-scale: .82;
        opacity: .52;
    }

    .forest-tree.t4 {
        left: 68%;
        --tree-scale: 1.18;
    }

    .forest-tree.t5 {
        left: 91%;
        --tree-scale: .67;
        opacity: .42;
    }

    .walker-svg {
        position: absolute;
        z-index: 7;

        left: 50%;
        bottom: 14px;

        width: 114px;
        height: 175px;

        transform:
            translateX(-50%);

        overflow: visible;

        animation:
            walkerBob .48s ease-in-out infinite alternate;
    }

    .walker-svg .walker-head {
        fill: rgba(250,255,254,.98);
    }

    .walker-svg .walker-line {
        stroke: rgba(250,255,254,.97);
        fill: none;

        stroke-width: 14;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .walker-svg .walker-arm-left,
    .walker-svg .walker-arm-right,
    .walker-svg .walker-leg-left,
    .walker-svg .walker-leg-right {
        transform-box: fill-box;
        transform-origin: 50% 0%;
    }

    .walker-svg .walker-arm-left,
    .walker-svg .walker-leg-right {
        animation:
            limbForward .72s ease-in-out infinite alternate;
    }

    .walker-svg .walker-arm-right,
    .walker-svg .walker-leg-left {
        animation:
            limbBackward .72s ease-in-out infinite alternate;
    }

    .walker-shadow {
        position: absolute;
        z-index: 6;

        left: 50%;
        bottom: 12px;

        width: 98px;
        height: 13px;

        border-radius: 50%;

        background:
            rgba(0,27,30,.26);

        filter: blur(5px);

        transform:
            translateX(-50%);

        animation:
            shadowPulse .48s ease-in-out infinite alternate;
    }

    @keyframes forestPass {
        from {
            transform: translateX(0);
        }

        to {
            transform: translateX(-100%);
        }
    }

    @keyframes walkerBob {
        from {
            transform:
                translateX(-50%)
                translateY(0);
        }

        to {
            transform:
                translateX(-50%)
                translateY(-5px);
        }
    }

    @keyframes limbForward {
        from {
            transform: rotate(-22deg);
        }

        to {
            transform: rotate(26deg);
        }
    }

    @keyframes limbBackward {
        from {
            transform: rotate(25deg);
        }

        to {
            transform: rotate(-24deg);
        }
    }

    @keyframes shadowPulse {
        from {
            transform:
                translateX(-50%)
                scaleX(.84);

            opacity: .24;
        }

        to {
            transform:
                translateX(-50%)
                scaleX(1.05);

            opacity: .42;
        }
    }

}

            #06484E 46%,
            #043B42 100%
        );

    opacity: 0;
    transform: translate3d(4%,0,0);
    pointer-events: none;

/* =========================================================
   FINAL POLISH — NATURAL CASE-STUDY MEDIA, SOFT COVER-FLOW
   FADE, AND SCATTERING PROFILE PLANETS
========================================================= */

/* -------------------------
   Case-study media
------------------------- */

.case-grid.two {
    align-items: start !important;
}

.case-media {
    margin: 0 !important;
    height: auto !important;
    min-height: 0 !important;
    align-self: start !important;
}

.case-media img {
    display: block !important;
    height: auto !important;
}

/*
   Tables are documentary elements, not tall visual cards.
   Let them occupy only their real image/caption height.
*/
.case-media.table-media {
    overflow: visible !important;

    border: 0 !important;
    border-radius: 0 !important;

    background: transparent !important;

    box-shadow: none !important;
}

.case-media.table-media img {
    width: 100% !important;

    border:
        1px solid
        rgba(193,246,237,.12);

    border-radius:
        22px;

    background: white;

    box-shadow:
        0 18px 42px
        rgba(0,24,28,.14);
}

.case-media.table-media .media-caption {
    margin-top: 10px;

    padding:
        14px 17px 16px;

    border:
        1px solid
        rgba(193,246,237,.10);

    border-radius:
        16px;

    background:
        rgba(4,61,67,.76);

    backdrop-filter:
        blur(10px);

    -webkit-backdrop-filter:
        blur(10px);
}


/* -------------------------
   Seamless desktop fade
------------------------- */

@media (min-width: 801px) {

    /*
       The title rail no longer ends in a visible vertical line.
       It dissolves into the carousel stage instead.
    */
    .expanded-header-row {
        overflow: visible !important;
    }

    .expanded-header-row > div {
        position: relative !important;
        z-index: 3 !important;

        overflow: hidden !important;
    }

    .expanded-header-row::after {
        content: "" !important;

        display: block !important;

        position: absolute;

        z-index: 2;

        top: 0;
        bottom: 0;

        left: 100%;

        width:
            clamp(150px, 12vw, 250px);

        pointer-events: none;

        background:
            linear-gradient(
                90deg,
                rgba(4,64,70,.96) 0%,
                rgba(4,64,70,.82) 24%,
                rgba(4,64,70,.52) 48%,
                rgba(4,64,70,.20) 72%,
                rgba(4,64,70,0) 100%
            );
    }

    /*
       Cards themselves fade as they approach the title rail,
       so they never terminate against a hard clipping edge.
    */
    .cover-flow {
        -webkit-mask-image:
            linear-gradient(
                90deg,
                transparent 0%,
                rgba(0,0,0,.18) 3%,
                rgba(0,0,0,.58) 8%,
                #000 15%,
                #000 100%
            );

        mask-image:
            linear-gradient(
                90deg,
                transparent 0%,
                rgba(0,0,0,.18) 3%,
                rgba(0,0,0,.58) 8%,
                #000 15%,
                #000 100%
            );
    }

}


/* -------------------------
   Expanded profile planets
------------------------- */

.profile-scatter-system {
    position: absolute !important;

    z-index: 2 !important;

    right: 0 !important;
    top: 4% !important;

    width: 42% !important;
    height: 90% !important;

    opacity: .72;

    pointer-events: none;

    transition:
        opacity .35s ease;
}

.profile-scatter-system .orbit,
.profile-scatter-system .planet,
.profile-scatter-system .particle {
    transition:
        translate .82s
        cubic-bezier(.18,.8,.2,1),
        opacity .35s ease;

    will-change:
        translate;
}


/*
   Every piece moves in a different direction.
   `translate` is used instead of `transform`, so the existing
   orbit/float/pulse animations keep running at the same time.
*/

.profile-scatter-system.scattered .orbit1 {
    translate: -34vw 8vh;
}

.profile-scatter-system.scattered .orbit2 {
    translate: -49vw 23vh;
}

.profile-scatter-system.scattered .orbit3 {

}

.profile-scatter-system.scattered .particle2 {

}

.profile-scatter-system.scattered .particle3 {

/* =========================================================
   FINAL SEAMLESS DESKTOP BLEND + FAST REVERSE ANIMATION
========================================================= */

@media (min-width: 801px) {

    /*
       The carousel is no longer physically forced to begin after
       the entire title rail. It can extend farther left behind the
       title zone, which recovers the unused space visible in the
       screenshots.
    */
    .expansion:not(.case-study-active) .expanded-content {
        position: relative !important;

        display: grid !important;

        grid-template-columns:

/* =========================================================

========================================================= */

function getExpandedTitleSize(
    key,
    originalSize
) {

    const mobile =
        window.innerWidth <= 800;


    if (mobile) {


        if (key === "profile") {

            return Math.min(
                Math.max(
                    originalSize * .73,
                    31
                ),
                38
            );
        }


        if (key === "projects") {

            return Math.min(
                Math.max(
                    originalSize * .58,
                    25
                ),
                32
            );
        }


        if (key === "skills") {

            return Math.min(
                Math.max(
                    originalSize * .76,
                    20
                ),
                27
            );
        }


        if (
            key === "gallery"
            ||
            key === "mini"
        ) {

            return Math.min(
                Math.max(
                    originalSize * .70,
                    23
                ),
                30
            );
        }

    }


    else {


        /*
           Desktop titles are intentionally oversized.
           The left side is now a true editorial title rail.
        */

        if (key === "profile") {

            return Math.min(
                Math.max(
                    originalSize * 1.02,
                    100
                ),
                126
            );
        }


        if (key === "projects") {

            return Math.min(
                Math.max(
                    originalSize * 1.22,
                    96
                ),
                116
            );
        }


        if (key === "skills") {

            return Math.min(
                Math.max(
                    originalSize * 1.46,
                    72
                ),
                84
            );
        }


        if (key === "gallery") {

            return Math.min(
                Math.max(
                    originalSize * 1.30,
                    86
                ),
                102
            );
        }


        if (key === "mini") {

            return Math.min(
                Math.max(
                    originalSize * 1.08,
                    72
                ),
                84
            );
        }

    }


    return 32;
}

/* =========================================================
   OPEN PANEL
========================================================= */

function openPanel(panel) {

    if (activePanel) {
        return;
    }

    activePanel = panel;

    const key = panel.dataset.panel;
    const originalTitle = panel.querySelector("[data-title]");
    const titleStyle = getComputedStyle(originalTitle);
    const originalFontSize = parseFloat(titleStyle.fontSize);

    /*
       Performance choice:
       the old version animated left/top/width/height from the dashboard tile
       to the full-screen panel. That forces layout and paint on every frame.
       This version opens the full-size panel immediately and animates only
       opacity + transform, which stays on the compositor and is much smoother.
    */
    backdrop.hidden = false;
    requestAnimationFrame(() => backdrop.classList.add("open"));

    const margin = window.innerWidth <= 800 ? 6 : 18;
    const finalLeft = margin;
    const finalTop = margin;
    const finalWidth = window.innerWidth - margin * 2;
    const finalHeight = window.innerHeight - margin * 2;

    expansion = document.createElement("div");
    expansion.className = `expansion expansion-${key} fast-shell`;
    expansion.style.left = `${finalLeft}px`;
    expansion.style.top = `${finalTop}px`;
    expansion.style.width = `${finalWidth}px`;
    expansion.style.height = `${finalHeight}px`;
    expansion.style.borderRadius = window.innerWidth <= 800 ? "23px" : "32px";

    expansion.innerHTML = `
        <div class="expanded-blob"></div>
        <div class="expanded-blob-small"></div>
        ${
            key === "profile"
                ? `<div class="planet-system profile-scatter-system">${panel.querySelector(".planet-system")?.innerHTML || ""}</div>`
                : ""
        }
        <div class="expanded-title-shield"></div>
        <div class="expanded-content">
            <div class="expanded-header-row">
                <div>
                    <div class="expanded-kicker">${content[key].kicker}</div>
                    <div class="expanded-description">${content[key].description}</div>
                    ${getLeftRailScene(key)}
                </div>
            </div>
            ${content[key].html}
        </div>
    `;

    document.body.appendChild(expansion);

    const finalTitleLeft = finalLeft + (window.innerWidth <= 800 ? 18 : Math.max(42, window.innerWidth * .027));
    const finalTitleSize = getExpandedTitleSize(key, originalFontSize);
    const titleLineCount = originalTitle.querySelectorAll(".title-line").length || 1;
    const estimatedTitleHeight = finalTitleSize * 1.04 * titleLineCount;
    const finalTitleTop = window.innerWidth <= 800
        ? finalTop + 21
        : (
            key === "profile"
                ? finalTop + finalHeight * .49 - estimatedTitleHeight / 2
                : finalTop + finalHeight * .42 - estimatedTitleHeight / 2
        );
    const finalTitleWidth = window.innerWidth <= 800
        ? Math.min(finalWidth * .78, 1100)
        : Math.min(finalWidth * .335, 625);

    if (window.innerWidth > 800) {
        const titleToCopyGap = key === "skills" ? 78 : key === "mini" ? 54 : key === "profile" ? 42 : 38;
        const railCopyTop = Math.min(
            finalHeight - 185,
            Math.max(112, (finalTitleTop - finalTop) + estimatedTitleHeight + titleToCopyGap)
        );
        expansion.style.setProperty("--rail-copy-top", `${railCopyTop}px`);
    }

    flyingTitle = document.createElement(originalTitle.tagName);
    flyingTitle.className = "flying-title fast-title compact";
    flyingTitle.dataset.key = key;
    flyingTitle.innerHTML = originalTitle.innerHTML;
    flyingTitle.style.left = `${finalTitleLeft}px`;
    flyingTitle.style.top = `${finalTitleTop}px`;
    flyingTitle.style.width = `${finalTitleWidth}px`;
    flyingTitle.style.fontSize = `${finalTitleSize}px`;
    flyingTitle.style.lineHeight = "1.04";
    document.body.appendChild(flyingTitle);

    originalTitle.style.opacity = "0";
    panel.style.opacity = "0";

    closeButton = document.createElement("button");
    closeButton.className = "expansion-close";
    closeButton.type = "button";
    closeButton.setAttribute("aria-label", "Close expanded section");
    closeButton.setAttribute("title", "Close section");
    closeButton.innerHTML = `<i class="fa-solid fa-xmark" aria-hidden="true"></i>`;
    document.body.appendChild(closeButton);
    positionCloseButton();
    closeButton.addEventListener("click", event => {
        event.preventDefault();
        event.stopPropagation();
        closeActivePanel();
    });

    requestAnimationFrame(() => {
        expansion?.classList.add("fast-visible");
        flyingTitle?.classList.add("fast-visible");
    });

    setTimeout(() => {
        if (!expansion) {
            return;
        }
        expansion.classList.add("content-visible");
        closeButton?.classList.add("visible");
        initialiseCoverFlows();
        bindGalleryItems();
        bindCaseStudyLaunchers();
    }, 120);
}


/* =========================================================
   CLOSE PANEL
========================================================= */

function closeActivePanel() {

    if (!activePanel || !expansion) {
        return;
    }

    const panel = activePanel;
    const originalTitle = panel.querySelector("[data-title]");
    const view = activeCaseStudy;

    /*
       Clean up the research story first if it is open.
       The previous version referenced an undefined variable named `view`
       here, which threw a ReferenceError every time the X button was clicked.
       That single error prevented ALL expanded-panel X buttons from closing.
    */
    if (view) {

        if (view._caseStoryCleanup) {
            view._caseStoryCleanup();
            view._caseStoryCleanup = null;
        }

        if (view._caseStoryObserver) {
            view._caseStoryObserver.disconnect();
            view._caseStoryObserver = null;
        }

        view.classList.remove("open");
        view.remove();
        activeCaseStudy = null;
    }

    if (caseStudyObserver) {
        caseStudyObserver.disconnect();
        caseStudyObserver = null;
    }

    document.body.classList.remove("research-case-open");

    expansion.classList.remove("case-study-active");
    expansion.classList.add("fast-closing");

    if (flyingTitle) {
        flyingTitle.classList.remove("case-study-hidden");
        flyingTitle.classList.add("fast-closing");
    }

    closeButton?.classList.remove("visible");
    backdrop.classList.remove("open");

    const finishClose = () => {

        panel.style.opacity = "";

        if (originalTitle) {
            originalTitle.style.opacity = "";
        }

        expansion?.remove();
        flyingTitle?.remove();
        closeButton?.remove();

        backdrop.hidden = true;

        expansion = null;
        flyingTitle = null;
        closeButton = null;
        activePanel = null;
        activeCaseStudy = null;
    };

    setTimeout(finishClose, 190);
}

/* =========================================================
   COVER FLOW
========================================================= */

function initialiseCoverFlows() {

    if (!expansion) {
        return;
    }

    expansion.querySelectorAll("[data-cover-flow]").forEach(track => {

        const cards = Array.from(track.querySelectorAll(".flow-card"));
        if (!cards.length) {
            return;
        }

        const dotsContainer = expansion.querySelector(`[data-dots-for="${track.id}"]`);
        let dots = [];
        let ticking = false;

        function centerCard(card, smooth = true) {
            const target = card.offsetLeft - (track.clientWidth - card.offsetWidth) / 2;
            track.scrollTo({
                left: Math.max(0, target),
                behavior: smooth ? "smooth" : "auto"
            });
        }

        track._centerCard = centerCard;

        if (dotsContainer) {
            dotsContainer.innerHTML = "";
            cards.forEach((card, index) => {
                const dot = document.createElement("button");
                dot.className = "flow-dot";
                dot.type = "button";
                dot.setAttribute("aria-label", `Go to card ${index + 1}`);
                dot.addEventListener("click", event => {
                    event.stopPropagation();
                    centerCard(card, true);
                });
                dotsContainer.appendChild(dot);
                dots.push(dot);
            });
        }

        /*
           Deliberately lightweight: during scrolling we only identify the
           nearest card and toggle one class. The previous version recalculated
           rotateY, blur, translate, opacity and z-index for every card on every
           animation frame, which was the main source of carousel micro-lag.
        */
        function updateFlow() {
            const viewportCenter = track.scrollLeft + track.clientWidth / 2;
            let closestIndex = 0;
            let closestDistance = Infinity;

            cards.forEach((card, index) => {
                const center = card.offsetLeft + card.offsetWidth / 2;
                const distance = Math.abs(center - viewportCenter);
                if (distance < closestDistance) {
                    closestDistance = distance;
                    closestIndex = index;
                }
            });

            cards.forEach((card, index) => {
                card.classList.toggle("is-center", index === closestIndex);
            });

            dots.forEach((dot, index) => {
                dot.classList.toggle("active", index === closestIndex);
            });

            ticking = false;
        }

        function requestUpdate() {
            if (ticking) {
                return;
            }
            ticking = true;
            requestAnimationFrame(updateFlow);
        }

        track.addEventListener("scroll", requestUpdate, { passive: true });

        cards.forEach(card => {
            card.addEventListener("click", event => {
                if (card.classList.contains("is-center")) {
                    return;
                }
                event.preventDefault();
                event.stopPropagation();
                centerCard(card, true);
            });
        });

        requestAnimationFrame(() => {
            centerCard(cards[0], false);
            requestAnimationFrame(updateFlow);
        });
    });
}


/* =========================================================
   GALLERY LIGHTBOX
========================================================= */

function bindGalleryItems() {


    if (!expansion) {
        return;
    }


    expansion
        .querySelectorAll(
            ".gallery-item"
        )
        .forEach(
            item => {


                if (
                    item.dataset.bound
                ) {

                    return;
                }


                item.dataset.bound =
                    "true";


                item.addEventListener(
                    "click",
                    event => {


                        /*
                           Only the centered Cover Flow
                           card opens. Side cards are
                           primarily for navigation.
                        */


                        if (
                            !item.classList.contains(
                                "is-center"
                            )
                        ) {

                            const track =
                                item.closest(
                                    "[data-cover-flow]"
                                );


                            if (
                                track
                                &&
                                typeof track._centerCard
                                === "function"
                            ) {

                                track._centerCard(
                                    item,
                                    true
                                );

                            }


                            return;
                        }


                        event.stopPropagation();


                        lightboxImage.src =
                            item.dataset.image;


                        lightbox.classList.add(
                            "open"
                        );


                    }
                );


            }
        );

}

                        local habitat quality from continuity across the landscape.

                    <div class="case-formula">Species–cell habitat match &rarr; local response; suitable neighbouring cells &rarr; structural connectivity</div>
                </article>

function bindCaseStudyLaunchers() {

    if (!expansion) {
        return;
    }

    expansion
        .querySelectorAll("[data-case-study]")
        .forEach(card => {

            if (card.dataset.caseBound === "true") {
                return;
            }

            card.dataset.caseBound = "true";

            const activate = event => {

                if (!card.classList.contains("is-center")) {
                    return;
                }

                event.preventDefault();
                event.stopPropagation();

                openCaseStudy(
                    card.dataset.caseStudy
                );

            };

            card.addEventListener(
                "click",
                activate
            );

            card.addEventListener(
                "keydown",
                event => {

                    if (
                        event.key === "Enter"
                        || event.key === " "
                    ) {
                        activate(event);
                    }

                }
            );

        });

}


function openCaseStudy(key) {

    if (
        !expansion
        || activeCaseStudy
        || ![
            "conservation-policy",
            "urban-heat"
        ].includes(key)
    ) {
        return;
    }

    activeCaseStudy =
        document.createElement("div");

    activeCaseStudy.className =
        "case-study-view";

    activeCaseStudy.setAttribute(
        "role",
        "document"
    );

    activeCaseStudy.dataset.caseStudy =
        key;

    activeCaseStudy.innerHTML =
        key === "urban-heat"
            ? getUrbanHeatCaseStudyHTML()
            : getConservationCaseStudyHTML();

    expansion.appendChild(
        activeCaseStudy
    );

    expansion.classList.add(
        "case-study-active"
    );

    document.body.classList.add("research-case-open");

    if (flyingTitle) {
        flyingTitle.classList.add(
            "case-study-hidden"
        );
    }

    requestAnimationFrame(() => {
        activeCaseStudy.classList.add(
            "open"
        );
    });

    const back =
        activeCaseStudy.querySelector(
            "[data-case-back]"
        );

    if (back) {
        back.addEventListener(
            "click",
            event => {
                event.preventDefault();
                event.stopPropagation();
                closeCaseStudy();
            }
        );
    }

    const caseClose =
        activeCaseStudy.querySelector(
            "[data-case-close]"
        );

    if (caseClose) {
        caseClose.addEventListener(
            "click",
            event => {
                event.preventDefault();
                event.stopPropagation();

                /*
                   The X exits the complete expanded section and returns to
                   the main portfolio. The Back button above returns only to
                   Mini Projects, so the two controls have distinct jobs.
                */
                closeActivePanel();
            }
        );
    }

    activeCaseStudy
        .querySelectorAll(".case-nav a")
        .forEach(link => {

            link.addEventListener(
                "click",
                event => {

                    const selector =
                        link.getAttribute("href");

                    const target =
                        activeCaseStudy.querySelector(
                            selector
                        );

                    if (!target) {
                        return;
                    }

                    event.preventDefault();

                    target.scrollIntoView({
                        behavior: "smooth",
                        block: "start"
                    });

                }
            );

        });

    hydrateCaseStudyMedia(
        activeCaseStudy
    );

    bindCaseStudyInteractions(
        activeCaseStudy
    );

    bindCaseScrollytelling(
        activeCaseStudy
    );

    activeCaseStudy.scrollTop = 0;

}


function closeCaseStudy() {

    if (!activeCaseStudy) {
        return;
    }

    const view = activeCaseStudy;

    if (view._caseStoryCleanup) {
        view._caseStoryCleanup();
        view._caseStoryCleanup = null;
    }

    if (view._caseStoryObserver) {
        view._caseStoryObserver.disconnect();
        view._caseStoryObserver = null;
    }

    if (caseStudyObserver) {
        caseStudyObserver.disconnect();
        caseStudyObserver = null;
    }

    view.classList.remove("open");

    expansion?.classList.remove("case-study-active");
    document.body.classList.remove("research-case-open");

    if (flyingTitle) {
        flyingTitle.classList.remove("case-study-hidden");
    }

    setTimeout(() => {

        if (view.isConnected) {
            view.remove();
        }

        if (activeCaseStudy === view) {
            activeCaseStudy = null;
        }

        /* Restore the normal panel X after returning to Mini Projects. */
        closeButton?.classList.add("visible");
        positionCloseButton();

    }, 140);
}



function hydrateCaseStudyMedia(view) {

    const images =
        Array.from(
            view.querySelectorAll(
                "img[data-src]"
            )
        );

    const loadImage = img => {

        const source =
            img.dataset.src;

        if (!source) {
            return;
        }

        img.src = source;
        img.removeAttribute("data-src");

    };

    if (!("IntersectionObserver" in window)) {
        images.forEach(loadImage);
        return;
    }

    caseStudyObserver =
        new IntersectionObserver(
            entries => {

                entries.forEach(entry => {

                    if (!entry.isIntersecting) {
                        return;
                    }

                    loadImage(entry.target);
                    caseStudyObserver?.unobserve(
                        entry.target
                    );

                });

            },
            {
                root: view,
                rootMargin: "260px 0px",
                threshold: 0.01
            }
        );

    images.forEach(img => {
        caseStudyObserver.observe(img);
    });

}




function bindCaseScrollytelling(view) {

    const steps = Array.from(
        view.querySelectorAll("[data-story-step]")
    );

    const scenes = Array.from(
        view.querySelectorAll(".case-story-scene[data-scene]")
    );

    const progressDots = Array.from(
        view.querySelectorAll("[data-story-jump]")
    );

    const progressCount =
        view.querySelector("[data-story-progress-count]");

    const progressCurrent =
        view.querySelector("[data-story-progress-current]");

    const topbar =
        view.querySelector(".case-study-topbar");

    if (!steps.length || !scenes.length) {
        return;
    }


    const sceneLabels = {
        ecology: "01 · Pollinator ecology",
        policy: "02 · Policy setup",
        tradeoff: "03 · Habitat & connectivity",
        targeting: "04 · Same-budget experiment",
        participation: "05 · Participation",
        spatial: "06 · Spatial allocation",
        consensus: "07 · Consensus",
        robustness: "08 · Robustness",

        "heat-baseline": "01 · Baseline heat",
        "heat-gapfill": "02 · Gap-filled LST",
        "heat-tree": "03 · Tree priority",
        "heat-urgency": "04 · Heat priority",
        "heat-scale": "05 · 300 m context",
        "heat-final": "06 · Final priority",
        "heat-hotspots": "07 · Critical hotspots"
    };


    let activeSceneName = "";
    let rafId = 0;


    /* ---------------------------------------------------------
       PRELOAD EVERY STORY VISUAL IMMEDIATELY

       The old version could show the correct section text before a
       heavy PNG/GIF had finished painting.  All story assets are now
       requested as soon as the case study opens.
    --------------------------------------------------------- */

    const storyImages = Array.from(
        view.querySelectorAll(
            ".case-story-scene img"
        )
    );

    storyImages.forEach(img => {

        img.loading = "eager";
        img.decoding = "async";

        const source =
            img.getAttribute("src") ||
            img.dataset.sceneSrc ||
            img.dataset.src;

        if (!source) {
            return;
        }

        /* Ensure the real image element itself starts loading now. */
        if (!img.getAttribute("src")) {
            img.src = source;
        }

        /* Warm the browser cache as well. */
        const preloader = new Image();
        preloader.src = source;

    });


    const getHeaderOffset = () => {

        const height =
            topbar
                ? topbar.getBoundingClientRect().height
                : 72;

        return height + 12;
    };


    /*
       ONE SHARED READING LINE

       The active text, active visual, progress count and progress dot
       are all chosen from the same position in the viewport.

       IMPORTANT:
       We no longer wait for a section kicker to reach the sticky
       header.  That was the cause of the one-card delay: a new card
       could already dominate the screen while the previous visual
       remained active.

       The reading line sits about 42% down the usable story viewport.
       Whichever text card occupies that line owns the visual.
    */

    const getReadingLineY = () => {

        const viewRect =
            view.getBoundingClientRect();

        const headerBottom =
            viewRect.top + getHeaderOffset();

        const visibleBottom =
            Math.min(
                viewRect.bottom,
                window.innerHeight
            );

        const usableHeight =
            Math.max(
                220,
                visibleBottom - headerBottom
            );

        return (
            headerBottom +
            usableHeight * 0.42
        );
    };


    const getActiveStep = () => {

        const readingY =
            getReadingLineY();

        /*
           First preference:
           choose the section actually crossing the reading line.
        */

        for (const step of steps) {

            const rect =
                step.getBoundingClientRect();

            if (
                readingY >= rect.top &&
                readingY < rect.bottom
            ) {
                return step;
            }
        }


        /*
           Fallback:
           during very fast scrolls the reading line can momentarily fall
           between sections. Choose the nearest section centre instead of
           keeping the previous scene.
        */

        let nearest =
            steps[0];

        let nearestDistance =
            Infinity;

        for (const step of steps) {

            const rect =
                step.getBoundingClientRect();

            const centre =
                rect.top + rect.height / 2;

            const distance =
                Math.abs(
                    centre - readingY
                );

            if (distance < nearestDistance) {
                nearest = step;
                nearestDistance = distance;
            }
        }

        return nearest;
    };


    const activateScene = sceneName => {

        if (
            !sceneName ||
            sceneName === activeSceneName
        ) {
            return;
        }

        activeSceneName =
            sceneName;

        const activeIndex =
            Math.max(
                0,
                steps.findIndex(
                    step =>
                        step.dataset.sceneTarget ===
                        sceneName
                )
            );


        /*
           Text, visual and dot state are committed together in the same
           JavaScript turn. There is no delayed scene transition.
        */

        steps.forEach(step => {

            step.classList.toggle(
                "active",
                step.dataset.sceneTarget ===
                    sceneName
            );

        });


        scenes.forEach(scene => {

            const active =
                scene.dataset.scene ===
                sceneName;

            scene.classList.toggle(
                "active",
                active
            );

            scene.setAttribute(
                "aria-hidden",
                active ? "false" : "true"
            );

        });


        progressDots.forEach(dot => {

            const active =
                dot.dataset.storyJump ===
                sceneName;

            dot.classList.toggle(
                "active",
                active
            );

            if (active) {
                dot.setAttribute(
                    "aria-current",
                    "step"
                );
            } else {
                dot.removeAttribute(
                    "aria-current"
                );
            }

        });


        if (progressCount) {

            progressCount.textContent =
                `${activeIndex + 1} / ${steps.length}`;

        }


        if (progressCurrent) {

            progressCurrent.textContent =
                sceneLabels[sceneName] ||
                `Section ${activeIndex + 1}`;

        }

    };


    const updateFromScroll = () => {

        rafId = 0;

        const activeStep =
            getActiveStep();

        if (!activeStep) {
            return;
        }

        activateScene(
            activeStep.dataset.sceneTarget
        );

    };


    const scheduleUpdate = () => {

        /*
           requestAnimationFrame keeps scrolling smooth while still updating
           once per painted frame.  The previous multi-second mismatch was not
           caused by rAF; it came from using the wrong trigger position.
        */

        if (rafId) {
            return;
        }

        rafId =
            requestAnimationFrame(
                updateFromScroll
            );

    };


    const getScrollTopForStep = step => {

        const viewRect =
            view.getBoundingClientRect();

        const rect =
            step.getBoundingClientRect();

        const currentReadingY =
            getReadingLineY();

        const targetCentre =
            rect.top +
            rect.height * 0.50;

        return Math.max(
            0,
            view.scrollTop +
            targetCentre -
            currentReadingY
        );
    };


    progressDots.forEach(dot => {

        dot.addEventListener(
            "click",
            () => {

                const target =
                    steps.find(
                        step =>
                            step.dataset.sceneTarget ===
                            dot.dataset.storyJump
                    );

                if (!target) {
                    return;
                }


                /*
                   Change all UI state BEFORE scrolling so the user never sees
                   the wrong picture after clicking a progress dot.
                */

                activateScene(
                    target.dataset.sceneTarget
                );


                view.scrollTo({
                    top:
                        getScrollTopForStep(
                            target
                        ),
                    behavior: "auto"
                });


                requestAnimationFrame(
                    updateFromScroll
                );

            }
        );

    });


    /*
       Update on scroll and resize only.  Eight text cards are cheap to measure,
       and the right visual no longer cross-fades, so this stays responsive.
    */

    view.addEventListener(
        "scroll",
        scheduleUpdate,
        { passive: true }
    );

    window.addEventListener(
        "resize",
        scheduleUpdate,
        { passive: true }
    );


    /*
       Set the first scene immediately, then verify against the actual viewport.
    */

    activateScene(
        steps[0].dataset.sceneTarget
    );

    requestAnimationFrame(
        updateFromScroll
    );


    view._caseStoryCleanup = () => {

        view.removeEventListener(
            "scroll",
            scheduleUpdate
        );

        window.removeEventListener(
            "resize",
            scheduleUpdate
        );

        if (rafId) {
            cancelAnimationFrame(
                rafId
            );
        }

    };

}


function bindCaseStudyInteractions(view) {

    const bars =
        Array.from(
            view.querySelectorAll(
                ".consensus-bar"
            )
        );

    const mapImage =
        view.querySelector(
            "#consensusMapImage"
        );

    const mapTitle =
        view.querySelector(
            "#consensusMapTitle"
        );

    const mapDescription =
        view.querySelector(
            "#consensusMapDescription"
        );


    const heatButtons =
        Array.from(
            view.querySelectorAll(
                ".heat-map-button[data-heat-map]"
            )
        );

    const heatMapImage =
        view.querySelector(
            "#heatMapImage"
        );

    const heatMapTitle =
        view.querySelector(
            "#heatMapTitle"
        );

    const heatMapDescription =
        view.querySelector(
            "#heatMapDescription"
        );


    heatButtons.forEach(button => {

        button.addEventListener(
            "click",
            () => {

                heatButtons.forEach(item => {
                    item.classList.remove("active");
                    item.setAttribute(
                        "aria-pressed",
                        "false"
                    );
                });

                button.classList.add("active");
                button.setAttribute(
                    "aria-pressed",
                    "true"
                );

                if (heatMapImage) {
                    heatMapImage.dataset.rawFallbackTried =
                        "false";

                    heatMapImage.src =
                        button.dataset.heatMap;
                }

                if (heatMapTitle) {
                    heatMapTitle.textContent =
                        button.dataset.heatTitle || "";
                }

                if (heatMapDescription) {
                    heatMapDescription.textContent =
                        button.dataset.heatCopy || "";
                }

            }
        );

    });


    bars.forEach(bar => {

        bar.addEventListener(
            "click",
            () => {

                bars.forEach(item => {
                    item.classList.remove("active");
                    item.setAttribute("aria-pressed","false");
                });

                bar.classList.add("active");
                bar.setAttribute("aria-pressed","true");

                if (mapImage) {
                    mapImage.dataset.rawFallbackTried = "false";
                    mapImage.removeAttribute("data-src");
                    mapImage.src = bar.dataset.map;
                }

                if (mapTitle) {
                    mapTitle.textContent =
                        bar.dataset.title;
                }

                if (mapDescription) {
                    mapDescription.textContent =
                        bar.dataset.copy;
                }

            }
        );

    });


    view
        .querySelectorAll("[data-case-lightbox]")
        .forEach(img => {

            img.addEventListener(
                "click",
                () => {

                    const source =
                        img.currentSrc
                        || img.src
                        || img.dataset.src;

                    if (!source) {
                        return;
                    }

                    lightboxImage.src = source;
                    lightbox.classList.add("open");

                }
            );

        });

}

function portfolioImageFallback(img) {

    if (!img || img.dataset.rawFallbackTried === "true") {
        return;
    }

    try {

        const current =
            new URL(
                img.currentSrc || img.src,
                window.location.href
            );

        const filename =
            current.pathname
                .split("/")
                .pop();

        if (!filename) {
            return;
        }

        img.dataset.rawFallbackTried =
            "true";

        img.src =
            `https://raw.githubusercontent.com/Johnny1996ornot/Portfolio/main/${filename}`;

    }

    catch (error) {
        /* Avoid a retry loop. */
    }

}

            )
        ) {


            closeLightbox();


            return;
        }


        if (activeCaseStudy) {

            closeCaseStudy();

            return;
        }


        closeActivePanel();


    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    positionCloseButton
);

</script>
