<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>
    John Paolo Ramirez | Environmental · Geospatial · Data
</title>

<meta
    name="description"
    content="Portfolio of John Paolo Ramirez — environmental, geospatial and data analyst working with GIS, remote sensing, Google Earth Engine, Python, R, environmental assessment and scientific research."
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
>

<style>

/* =========================================================
   COLOR SYSTEM
========================================================= */

:root {

    --bg: #02353C;
    --bg2: #064149;

    --panel: #0A474D;
    --panel2: #0B5156;
    --panel3: #0B5A5D;

    --text: #F7FFFD;

    --muted: #C0DBD7;
    --muted2: #88B2AD;

    --mint: #C1F6ED;

    --green: #2EAF7D;
    --green2: #449342;
    --greenBright: #59E18D;

    --aqua: #3FD0C9;

    --line: rgba(193,246,237,.17);

    --radius: 29px;
}


/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;
}

body {

    background:

        radial-gradient(
            circle at 3% 3%,
            rgba(63,208,201,.12),
            transparent 31%
        ),

        radial-gradient(
            circle at 97% 94%,
            rgba(46,175,125,.14),
            transparent 34%
        ),

        linear-gradient(
            145deg,
            #02353C,
            #043D43 55%,
            #063E42
        );

    color: var(--text);

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    -webkit-font-smoothing: antialiased;

    text-rendering: optimizeLegibility;
}

button,
a {
    font: inherit;
}

button {
    color: inherit;
}

img {
    display: block;

    max-width: 100%;
}


/* =========================================================
   MAIN APP
========================================================= */

.app {

    width: 100%;

    height: 100svh;

    padding:
        clamp(10px, 1.6vw, 24px);

    display: flex;

    flex-direction: column;

    gap:
        clamp(8px, 1.15vw, 15px);
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar {

    min-height: 38px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;
}

.brand {

    display: flex;

    align-items: center;

    gap: 9px;

    color:
        var(--greenBright);

    font-size: .69rem;

    font-weight: 900;

    letter-spacing: .17em;

    text-transform: uppercase;
}

.hint {

    color:
        var(--muted2);

    font-size: .68rem;
}


/* =========================================================
   DASHBOARD
========================================================= */

.dashboard {

    min-height: 0;

    flex: 1;

    display: grid;

    grid-template-columns:
        repeat(12, minmax(0,1fr));

    grid-template-rows:
        repeat(2, minmax(0,1fr));

    gap:
        clamp(8px,1.2vw,16px);
}


/* =========================================================
   PANEL
========================================================= */

.panel {

    position: relative;

    min-width: 0;

    min-height: 0;

    overflow: hidden;

    padding:
        clamp(18px,2vw,32px);

    border:
        1px solid
        var(--line);

    border-radius:
        var(--radius);

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.025),
            transparent 46%
        ),

        var(--panel);

    color:
        var(--text);

    text-align: left;

    cursor: pointer;

    isolation: isolate;

    box-shadow:
        0 18px 40px
        rgba(0,24,27,.14);

    transition:

        transform .32s
        cubic-bezier(.2,.8,.2,1),

        border-color .3s ease,

        background .3s ease,

        box-shadow .3s ease;
}

.panel:hover {

    transform:
        translateY(-4px);

    background:
        var(--panel2);

    border-color:
        rgba(89,225,141,.30);

    box-shadow:
        0 22px 50px
        rgba(0,20,23,.23);
}

.panel:focus-visible {

    outline:
        2px solid
        var(--greenBright);

    outline-offset:
        3px;
}


/* =========================================================
   PANEL GRID
========================================================= */

.panel-profile {

    grid-column:
        span 7;
}

.panel-projects {

    grid-column:
        span 5;
}

.panel-skills,
.panel-gallery,
.panel-mini {

    grid-column:
        span 4;
}


/* =========================================================
   PANEL COMMON
========================================================= */

.panel-kicker {

    position: relative;

    z-index: 5;

    display:
        inline-flex;

    align-items:
        center;

    gap: 7px;

    color:
        var(--greenBright);

    font-size: .63rem;

    font-weight: 900;

    letter-spacing: .14em;

    text-transform: uppercase;
}

.panel-arrow {

    position: absolute;

    z-index: 15;

    top: 21px;

    right: 22px;

    width: 39px;

    height: 39px;

    border:
        1px solid
        var(--line);

    border-radius:
        50%;

    display: flex;

    align-items: center;

    justify-content: center;

    color:
        var(--mint);

    background:
        rgba(2,53,60,.28);

    transition:
        transform .3s ease,
        background .3s ease;
}

.panel:hover
.panel-arrow {

    transform:
        rotate(45deg);

    background:
        rgba(46,175,125,.18);
}


/* =========================================================
   SHARED TITLES
========================================================= */

.shared-title {

    position: relative;

    z-index: 5;

    margin: 0;

    color:
        var(--text);

    font-weight: 900;

    letter-spacing: -.064em;

    line-height: .91;

    transform-origin:
        top left;
}

.title-line {

    display: block;
}

.shared-title .accent,
.flying-title .accent {

    color:
        var(--greenBright);
}


/* HOME SIZES */

.panel-profile
.shared-title {

    font-size:
        clamp(2.8rem,5.55vw,6.7rem);
}

.panel-projects
.shared-title {

    font-size:
        clamp(2.1rem,3.95vw,4.6rem);
}

.panel-skills
.shared-title {

    font-size:
        clamp(1.35rem,2.4vw,2.8rem);

    line-height: 1;
}

.panel-gallery
.shared-title,
.panel-mini
.shared-title {

    font-size:
        clamp(1.75rem,2.9vw,3.4rem);
}


/* =========================================================
   PROFILE PANEL
========================================================= */

.panel-profile {

    display: flex;

    flex-direction: column;

    justify-content:
        space-between;

    background:

        radial-gradient(
            circle at 82% 16%,
            rgba(63,208,201,.15),
            transparent 40%
        ),

        linear-gradient(
            138deg,
            #09454B,
            #0B4D50
        );
}

.profile-content {

    position: relative;

    z-index: 5;

    max-width: 68%;
}

.profile-copy {

    margin-top: 14px;

    max-width: 680px;

    color:
        var(--muted);

    font-size:
        clamp(.82rem,1.05vw,1rem);

    line-height: 1.55;
}

.bottom-note {

    position: relative;

    z-index: 5;

    color:
        var(--muted2);

    font-size: .66rem;
}


/* =========================================================
   PROFILE MOVING PLANETS
========================================================= */

.planet-system {

    position: absolute;

    right: 1%;

    top: 4%;

    width: 40%;

    height: 91%;

    z-index: 1;

    pointer-events: none;
}

.orbit {

    position: absolute;

    border:
        1px solid
        rgba(193,246,237,.12);

    border-radius: 50%;

    animation:
        orbitSpin linear infinite;
}

.orbit1 {

    width: 285px;

    height: 285px;

    right: 6%;

    top: 3%;

    animation-duration:
        20s;
}

.orbit2 {

    width: 205px;

    height: 205px;

    right: 20%;

    top: 18%;

    animation-duration:
        14s;

    animation-direction:
        reverse;
}

.orbit3 {

    width: 350px;

    height: 180px;

    right: -7%;

    bottom: 2%;

    transform:
        rotate(-21deg);

    animation-duration:
        24s;
}

@keyframes orbitSpin {

    to {

        transform:
            rotate(360deg);
    }
}


.planet {

    position: absolute;

    border-radius: 50%;

    box-shadow:

        inset -24px -25px 45px
        rgba(0,69,62,.25),

        inset 18px 16px 32px
        rgba(255,255,255,.13),

        0 20px 36px
        rgba(0,28,31,.18);

    animation:
        planetFloat
        ease-in-out
        infinite alternate;
}

.planet1 {

    width: 155px;

    height: 155px;

    right: 16%;

    top: 9%;

    background:

        radial-gradient(
            circle at 30% 24%,
            #C1F6ED,
            #65DA9B 43%,
            #2EAF7D 72%,
            #166750
        );

    animation-duration:
        7s;
}

.planet2 {

    width: 108px;

    height: 108px;

    right: 1%;

    top: 50%;

    background:

        radial-gradient(
            circle at 30% 23%,
            #98DEA6,
            #55C685 48%,
            #267F65
        );

    animation-duration:
        6.2s;

    animation-delay:
        -1.8s;
}

.planet3 {

    width: 63px;

    height: 63px;

    right: 45%;

    top: 59%;

    background:

        radial-gradient(
            circle at 34% 26%,
            #C1F6ED,
            #3FD0C9 45%,
            #18766F
        );

    animation-duration:
        5.1s;
}

.planet4 {

    width: 29px;

    height: 29px;

    right: 51%;

    top: 18%;

    background:
        var(--greenBright);

    animation-duration:
        4.2s;

    box-shadow:
        0 0 24px
        rgba(89,225,141,.35);
}

@keyframes planetFloat {

    from {

        transform:
            translate3d(0,-7px,0)
            scale(.98);
    }

    to {

        transform:
            translate3d(10px,11px,0)
            scale(1.04);
    }
}


.particle {

    position: absolute;

    width: 7px;

    height: 7px;

    border-radius: 50%;

    background:
        var(--mint);

    animation:
        particlePulse
        3s ease-in-out
        infinite;
}

.particle1 {

    right: 52%;

    top: 40%;
}

.particle2 {

    right: 5%;

    top: 31%;

    animation-delay:
        -1s;
}

.particle3 {

    right: 33%;

    bottom: 8%;

    animation-delay:
        -2s;
}

@keyframes particlePulse {

    0%,
    100% {

        opacity: .18;

        transform:
            scale(.7);
    }

    50% {

        opacity: .9;

        transform:
            scale(1.4);
    }
}


/* =========================================================
   PROJECT PANEL
========================================================= */

.panel-projects {

    display: flex;

    flex-direction: column;

    justify-content:
        space-between;
}

.project-preview {

    display: grid;

    gap: 7px;
}

.preview-line {

    padding-top: 8px;

    display: flex;

    justify-content:
        space-between;

    gap: 12px;

    border-top:
        1px solid
        var(--line);

    font-size: .67rem;
}

.preview-line strong {

    color:
        var(--text);
}

.preview-line span {

    color:
        var(--muted2);
}


/* =========================================================
   SKILLS
========================================================= */

.panel-skills {

    display: flex;

    flex-direction: column;

    justify-content:
        space-between;
}

.skill-preview {

    display: flex;

    flex-wrap: wrap;

    gap: 6px;
}

.skill-preview span {

    padding:
        6px 9px;

    border:
        1px solid
        var(--line);

    border-radius:
        999px;

    color:
        var(--muted);

    font-size: .61rem;

    font-weight: 720;
}


/* =========================================================
   SELECTED WORK
========================================================= */

.panel-gallery {

    display: flex;

    flex-direction: column;

    justify-content:
        space-between;
}

.thumb-strip {

    height: 38%;

    min-height: 82px;

    display: grid;

    grid-template-columns:
        repeat(3,1fr);

    gap: 7px;
}

.thumb {

    position: relative;

    overflow: hidden;

    border:
        1px solid
        var(--line);

    border-radius: 11px;

    background:
        #07393E;
}

.thumb img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    transition:
        transform .35s ease;
}

.panel-gallery:hover
.thumb img {

    transform:
        scale(1.06);
}


/* =========================================================
   MINI PROJECTS PANEL
========================================================= */

.panel-mini {

    display: flex;

    flex-direction: column;

    justify-content:
        space-between;
}

.mini-preview {

    display: grid;

    gap: 7px;
}

.mini-preview-row {

    padding-top: 8px;

    display: flex;

    align-items: center;

    justify-content:
        space-between;

    border-top:
        1px solid
        var(--line);

    color:
        var(--muted);

    font-size: .63rem;
}

.mini-preview-row strong {

    color:
        var(--text);
}


/* =========================================================
   OPENING BACKDROP
========================================================= */

.expansion-backdrop {

    position: fixed;

    inset: 0;

    z-index: 4990;

    background:
        rgba(1,29,33,.72);

    backdrop-filter:
        blur(13px);

    -webkit-backdrop-filter:
        blur(13px);

    opacity: 0;

    transition:
        opacity .4s ease;
}

.expansion-backdrop.open {

    opacity: 1;
}


/* =========================================================
   EXPANDING PANEL
========================================================= */

.expansion {

    position: fixed;

    z-index: 5000;

    overflow: hidden;

    border:
        1px solid
        rgba(193,246,237,.18);

    background:

        radial-gradient(
            circle at 85% 0%,
            rgba(46,175,125,.16),
            transparent 34%
        ),

        linear-gradient(
            145deg,
            #064149,
            #07434A
        );

    box-shadow:

        0 40px 110px
        rgba(0,20,24,.58);

    will-change:
        left,
        top,
        width,
        height,
        border-radius;

    transition:

        left .62s
        cubic-bezier(.18,.8,.2,1),

        top .62s
        cubic-bezier(.18,.8,.2,1),

        width .62s
        cubic-bezier(.18,.8,.2,1),

        height .62s
        cubic-bezier(.18,.8,.2,1),

        border-radius .62s
        cubic-bezier(.18,.8,.2,1);
}


/* =========================================================
   BLURRED TITLE BACKGROUND

   This remains fixed while the inner content scrolls
   underneath it.
========================================================= */

.expanded-title-shield {

    position: absolute;

    z-index: 5050;

    top: 0;

    left: 0;

    right: 0;

    height: 124px;

    pointer-events: none;

    opacity: 0;

    background:

        linear-gradient(
            180deg,
            rgba(5,65,72,.96) 0%,
            rgba(5,65,72,.91) 66%,
            rgba(5,65,72,.55) 86%,
            rgba(5,65,72,0) 100%
        );

    backdrop-filter:
        blur(24px)
        saturate(125%);

    -webkit-backdrop-filter:
        blur(24px)
        saturate(125%);

    transition:
        opacity .25s ease .32s;
}

.expansion.content-visible
.expanded-title-shield {

    opacity: 1;
}


/* =========================================================
   FLYING TITLE
========================================================= */

.flying-title {

    position: fixed;

    z-index: 5100;

    margin: 0;

    pointer-events: none;

    color:
        var(--text);

    font-weight: 900;

    line-height: .91;

    letter-spacing: -.064em;

    transform-origin:
        top left;

    will-change:
        left,
        top,
        font-size,
        width;

    transition:

        left .62s
        cubic-bezier(.18,.8,.2,1),

        top .62s
        cubic-bezier(.18,.8,.2,1),

        font-size .62s
        cubic-bezier(.18,.8,.2,1),

        line-height .62s
        cubic-bezier(.18,.8,.2,1),

        width .62s
        cubic-bezier(.18,.8,.2,1);
}

.flying-title.compact
.title-line {

    display: inline;
}


/* punctuation appears only open */

.flying-title[data-key="profile"].compact
.title-line:not(:last-child)::after {

    content: " ";
}

.flying-title[data-key="projects"].compact
.title-line:not(:last-child)::after {

    content: " ";
}

.flying-title[data-key="projects"].compact
.title-line:last-child::after {

    content: ".";
}

.flying-title[data-key="skills"].compact
.title-line::after {

    content: ". ";
}

.flying-title[data-key="gallery"].compact
.title-line::after {

    content: ". ";
}

.flying-title[data-key="mini"].compact
.title-line:not(:last-child)::after {

    content: " ";
}

.flying-title[data-key="mini"].compact
.title-line:last-child::after {

    content: ".";
}


/* =========================================================
   OPEN PANEL CONTENT

   Notice the large top padding.
   Nothing can now sit under the moving title.
========================================================= */

.expanded-content {

    position: absolute;

    inset: 0;

    overflow-y: auto;

    overflow-x: hidden;

    padding:

        145px

        clamp(20px,3.6vw,55px)

        40px;

    opacity: 0;

    transform:
        translateY(18px);

    transition:

        opacity .28s ease .39s,

        transform .4s ease .35s;
}

.expansion.content-visible
.expanded-content {

    opacity: 1;

    transform:
        translateY(0);
}

.expanded-content::-webkit-scrollbar {

    width: 7px;
}

.expanded-content::-webkit-scrollbar-track {

    background: transparent;
}

.expanded-content::-webkit-scrollbar-thumb {

    background:
        rgba(193,246,237,.32);

    border-radius: 10px;
}



/* =========================================================
   CLEAN REVERSE / CLOSE ANIMATION
========================================================= */

.expansion.is-closing .expanded-content {
    opacity: 0;
    transform: translateY(8px);

    transition:
        opacity .15s ease,
        transform .15s ease;

    pointer-events: none;
}

.expansion.is-closing .expanded-title-shield {
    opacity: 0;

    transition:
        opacity .14s ease;
}

.expansion.is-closing .expanded-blob,
.expansion.is-closing .expanded-blob-small {
    opacity: 0;

    transition:
        opacity .14s ease;
}

/*
   Once the content has faded, the returning object is just
   the clean panel shell and the traveling title.
*/
.expansion.geometry-closing .expanded-content,
.expansion.geometry-closing .expanded-title-shield,
.expansion.geometry-closing .expanded-blob,
.expansion.geometry-closing .expanded-blob-small {
    visibility: hidden;
}

/*
   Keep the dashboard destination invisible until the
   animated shell has actually reached it.
*/
.panel.panel-return-target {
    opacity: 0 !important;
    pointer-events: none;
}

/* =========================================================
   OPEN HEADER
========================================================= */

.expanded-header-row {

    position: relative;

    z-index: 2;

    margin-bottom: 28px;
}

.expanded-kicker {

    color:
        var(--greenBright);

    font-size: .72rem;

    font-weight: 900;

    letter-spacing: .14em;

    text-transform: uppercase;
}

.expanded-description {

    max-width: 850px;

    margin-top: 9px;

    color:
        var(--muted);

    font-size:
        clamp(.96rem,1.15vw,1.07rem);

    line-height: 1.7;
}


/* =========================================================
   CLOSE
========================================================= */

.expansion-close {

    position: fixed;

    z-index: 5200;

    width: 48px;

    height: 48px;

    display: flex;

    align-items: center;

    justify-content: center;

    border:
        1px solid
        rgba(193,246,237,.20);

    border-radius: 50%;

    background:
        rgba(2,53,60,.82);

    color: white;

    cursor: pointer;

    backdrop-filter:
        blur(14px);

    opacity: 0;

    transform:
        scale(.8);

    transition:

        opacity .25s ease .39s,

        transform .35s ease .37s,

        background .2s ease;
}

.expansion-close.visible {

    opacity: 1;

    transform:
        scale(1);
}

.expansion-close:hover {

    background:
        var(--green);
}


/* =========================================================
   OPEN PANEL MOVING FORMS
========================================================= */

.expanded-blob {

    position: absolute;

    width: 350px;

    height: 275px;

    right: -90px;

    top: -75px;

    opacity: .14;

    pointer-events: none;

    background:

        radial-gradient(
            circle at 30% 25%,
            #C1F6ED,
            #58DE8A 43%,
            #2EAF7D 69%,
            #176B57
        );

    border-radius:

        55% 45% 60% 40%

        /

        44% 58% 42% 56%;

    animation:
        openBlob
        8s ease-in-out
        infinite alternate;
}

.expanded-blob-small {

    position: absolute;

    width: 82px;

    height: 82px;

    right: 20%;

    top: 96px;

    opacity: .11;

    background:
        var(--aqua);

    border-radius: 50%;

    animation:
        openBlobSmall
        6.2s ease-in-out
        infinite alternate;
}

@keyframes openBlob {

    from {

        transform:
            translate(0,0)
            rotate(-4deg)
            scale(1);
    }

    to {

        transform:
            translate(-32px,25px)
            rotate(6deg)
            scale(1.08);

        border-radius:

            40% 60% 48% 52%

            /

            58% 40% 60% 42%;
    }
}

@keyframes openBlobSmall {

    from {

        transform:
            translate(0,0)
            scale(.9);
    }

    to {

        transform:
            translate(-44px,30px)
            scale(1.15);
    }
}


/* =========================================================
   TAGS
========================================================= */

.tags {

    margin-top: 18px;

    display: flex;

    flex-wrap: wrap;

    gap: 7px;
}

.tags span {

    padding:
        7px 10px;

    border-radius:
        999px;

    background:
        rgba(193,246,237,.08);

    color:
        var(--mint);

    font-size: .69rem;

    font-weight: 730;
}



/* =========================================================
   COVER FLOW WRAPPER
========================================================= */

.flow-section {
    position: relative;
    z-index: 3;
}

.flow-help {
    margin-bottom: 10px;
    color: var(--muted2);
    font-size: .78rem;
    text-align: center;
}


/* =========================================================
   COVER FLOW TRACK
   Portrait / UNO-card proportions.
========================================================= */

.cover-flow {
    --card-width: clamp(300px, 27vw, 360px);

    display: flex;
    align-items: center;
    gap: clamp(12px, 1.5vw, 20px);

    overflow-x: auto;
    overflow-y: visible;

    padding:
        22px
        calc((100% - var(--card-width)) / 2)
        20px;

    scroll-snap-type: x mandatory;
    scroll-padding-inline:
        calc((100% - var(--card-width)) / 2);

    scroll-behavior: smooth;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;

    perspective: 1450px;
    touch-action: pan-x;

    /*
       Prevent the carousel from nudging the surrounding
       expanded panel while it is being scrolled.
    */
    contain: layout style;
}

.cover-flow::-webkit-scrollbar {
    display: none;
}


/* =========================================================
   COVER FLOW CARD
   Vertical 2:3 gaming / UNO-card shape.
========================================================= */

.flow-card {
    position: relative;

    flex: 0 0 var(--card-width);
    width: var(--card-width);
    aspect-ratio: 2 / 3;

    min-width: 0;

    scroll-snap-align: center;
    scroll-snap-stop: always;

    overflow: hidden;

    padding: clamp(24px, 2vw, 31px);

    display: flex;
    flex-direction: column;

    border:
        1px solid
        rgba(193,246,237,.18);

    border-radius: 28px;

    background:
        radial-gradient(
            circle at 85% 8%,
            rgba(89,225,141,.08),
            transparent 36%
        ),
        linear-gradient(
            145deg,
            rgba(193,246,237,.05),
            rgba(46,175,125,.025)
        ),
        rgba(10,76,81,.96);

    box-shadow:
        0 20px 45px
        rgba(0,25,28,.20);

    transform-style: preserve-3d;
    transform-origin: center center;

    opacity: .58;

    /*
       Transform intentionally has NO CSS transition.
       It follows the finger / scroll position frame by frame.
       This removes the previous left-shift-then-correct motion.
    */
    transition:
        opacity .10s linear,
        filter .10s linear,
        border-color .20s ease,
        box-shadow .20s ease;

    will-change:
        transform,
        opacity,
        filter;

    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
}

.flow-card.is-center {
    border-color:
        rgba(89,225,141,.48);

    box-shadow:
        0 30px 72px
        rgba(0,24,27,.32),
        0 0 0 1px
        rgba(89,225,141,.07);
}

.card-label {
    color: var(--greenBright);

    font-size: .79rem;
    font-weight: 900;

    letter-spacing: .095em;
    line-height: 1.35;

    text-transform: uppercase;
}

.flow-card h3 {
    margin: 22px 0 0;

    font-size:
        clamp(1.65rem, 2.15vw, 2.05rem);

    line-height: 1.12;

    letter-spacing: -.035em;
}

.flow-card p {
    margin: 16px 0 0;

    color: var(--muted);

    font-size:
        clamp(1rem, 1.08vw, 1.10rem);

    line-height: 1.62;
}

.flow-card .tags {
    margin-top: auto;
    padding-top: 22px;
}

.tags {
    gap: 7px;
}

.tags span {
    font-size: .73rem;
}


/* =========================================================
   SKILL FLOW CARD
========================================================= */

.skill-heading {

    align-items: center;
    gap: 14px;
}

.card-icon {

========================================================= */

========================================================= */

    .expansion-projects .left-rail-scene,
    .expansion-skills .left-rail-scene {
        display: block;

        position: relative;

        width: 100%;
        height:
            clamp(175px, 23vh, 245px);

        min-height: 175px;

        margin-top: auto;
        padding-top: 24px;

        overflow: hidden;

        border-top:
            1px solid
            rgba(193,246,237,.10);
    }

    .left-rail-scene::after {
        content: "";

        position: absolute;
        left: 9%;
        right: 9%;
        bottom: 7px;

        height: 1px;

        background:
            linear-gradient(
                90deg,
                transparent,
                rgba(193,246,237,.28),
                transparent
            );
    }


    /* =======================
       RESEARCH / TYPING SCENE
    ======================= */

    .research-scene {
        opacity: .94;
    }

    .research-scene svg {
        width: 100%;
        height: 100%;

        overflow: visible;
    }

    .research-scene .scene-white {
        stroke: rgba(250,255,254,.95);
        fill: none;

        stroke-width: 13;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .research-scene .scene-soft {
        stroke: rgba(193,246,237,.24);
        fill: none;

        stroke-width: 4;
        stroke-linecap: round;
    }

    .research-scene .person-head {
        fill: rgba(250,255,254,.97);
    }

    .research-scene .desk-line {
        stroke: rgba(250,255,254,.72);
        stroke-width: 8;
        stroke-linecap: round;
    }

    .research-scene .laptop-body {
        fill: rgba(89,225,141,.14);
        stroke: rgba(250,255,254,.88);
        stroke-width: 5;
    }

    .research-scene .laptop-screen-glow {
        fill: rgba(89,225,141,.32);

        animation:
            laptopGlow 1.8s ease-in-out infinite alternate;
    }

    .research-scene .typing-left,
    .research-scene .typing-right {
        transform-box: fill-box;
        transform-origin: 0% 50%;
    }

    .research-scene .typing-left {
        animation:
            typingLeft .38s ease-in-out infinite alternate;
    }

    .research-scene .typing-right {
        animation:
            typingRight .42s ease-in-out infinite alternate-reverse;
    }

    .research-scene .screen-dot {
        fill: var(--greenBright);

        animation:
            codeBlink 1.25s steps(2,end) infinite;
    }

    .research-scene .code-line {
        stroke: rgba(193,246,237,.68);
        stroke-width: 4;
        stroke-linecap: round;
    }

    @keyframes typingLeft {
        from {
            transform: rotate(-4deg) translateY(0);
        }

        to {
            transform: rotate(4deg) translateY(4px);
        }
    }

    @keyframes typingRight {
        from {
            transform: rotate(3deg) translateY(3px);
        }

        to {
            transform: rotate(-5deg) translateY(0);
        }
    }

    @keyframes laptopGlow {
        from {
            opacity: .35;
        }

        to {
            opacity: .78;
        }
    }

    @keyframes codeBlink {
        50% {
            opacity: .18;
        }
    }


    /* =======================
       SKILLS / FOREST SCENE
    ======================= */

    .forest-scene {
        isolation: isolate;
    }

    .forest-haze {
        position: absolute;
        inset: 18% 0 0 0;

        background:
            linear-gradient(
                180deg,
                rgba(63,208,201,.00),
                rgba(63,208,201,.045) 60%,
                rgba(89,225,141,.07)
            );

        border-radius: 44% 44% 0 0;
    }

    .forest-track {
        position: absolute;
        left: 0;
        bottom: 9px;

        width: 100%;
        height: 84%;

        animation:
            forestPass 11s linear infinite;

        will-change: transform;
    }

    .forest-track.track-two {
        left: 100%;
    }

    .forest-tree {
        --tree-scale: 1;

        position: absolute;
        bottom: 11px;

        width: 50px;
        height: 145px;

        transform:
            scale(var(--tree-scale));

        transform-origin:
            bottom center;

        opacity: .70;
    }

    .forest-tree::before {
        content: "";

        position: absolute;
        left: 20px;
        bottom: 0;

        width: 10px;
        height: 83px;

        border-radius: 999px;

        background:
            rgba(238,255,250,.69);
    }

    .forest-tree::after {
        content: "";

        position: absolute;
        left: -5px;
        top: 0;

        width: 60px;
        height: 78px;

        border-radius:
            52% 48% 55% 45%
            /
            44% 56% 44% 56%;

        background:
            radial-gradient(
                circle at 36% 30%,
                rgba(193,246,237,.82),
                rgba(89,225,141,.55) 48%,
                rgba(46,175,125,.28) 100%
            );
    }

    .forest-tree.t1 {
        left: 2%;
        --tree-scale: .72;
        opacity: .43;
    }

    .forest-tree.t2 {
        left: 19%;
        --tree-scale: 1.04;
    }

    .forest-tree.t3 {
        left: 43%;
        --tree-scale: .82;
        opacity: .52;
    }

    .forest-tree.t4 {
        left: 68%;
        --tree-scale: 1.18;
    }

    .forest-tree.t5 {
        left: 91%;
        --tree-scale: .67;
        opacity: .42;
    }

    .walker-svg {
        position: absolute;
        z-index: 7;

        left: 50%;
        bottom: 14px;

        width: 114px;
        height: 175px;

        transform:
            translateX(-50%);

        overflow: visible;

        animation:
            walkerBob .48s ease-in-out infinite alternate;
    }

    .walker-svg .walker-head {
        fill: rgba(250,255,254,.98);
    }

    .walker-svg .walker-line {
        stroke: rgba(250,255,254,.97);
        fill: none;

        stroke-width: 14;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .walker-svg .walker-arm-left,
    .walker-svg .walker-arm-right,
    .walker-svg .walker-leg-left,
    .walker-svg .walker-leg-right {
        transform-box: fill-box;
        transform-origin: 50% 0%;
    }

    .walker-svg .walker-arm-left,
    .walker-svg .walker-leg-right {
        animation:
            limbForward .72s ease-in-out infinite alternate;
    }

    .walker-svg .walker-arm-right,
    .walker-svg .walker-leg-left {
        animation:
            limbBackward .72s ease-in-out infinite alternate;
    }

    .walker-shadow {
        position: absolute;
        z-index: 6;

        left: 50%;
        bottom: 12px;

        width: 98px;
        height: 13px;

        border-radius: 50%;

        background:
            rgba(0,27,30,.26);

        filter: blur(5px);

        transform:
            translateX(-50%);

        animation:
            shadowPulse .48s ease-in-out infinite alternate;
    }

    @keyframes forestPass {
        from {
            transform: translateX(0);
        }

        to {
            transform: translateX(-100%);
        }
    }

    @keyframes walkerBob {
        from {
            transform:
                translateX(-50%)
                translateY(0);
        }

        to {
            transform:
                translateX(-50%)
                translateY(-5px);
        }
    }

    @keyframes limbForward {
        from {
            transform: rotate(-22deg);
        }

        to {
            transform: rotate(26deg);
        }
    }

    @keyframes limbBackward {
        from {
            transform: rotate(25deg);
        }

        to {
            transform: rotate(-24deg);
        }
    }

    @keyframes shadowPulse {
        from {
            transform:
                translateX(-50%)
                scaleX(.84);

            opacity: .24;
        }

        to {
            transform:
                translateX(-50%)
                scaleX(1.05);

            opacity: .42;
        }
    }

}

/* -------------------------
   Seamless desktop fade
------------------------- */

@media (min-width: 801px) {

    /*
       The title rail no longer ends in a visible vertical line.
       It dissolves into the carousel stage instead.
    */
    .expanded-header-row {
        overflow: visible !important;
    }

    .expanded-header-row > div {
        position: relative !important;
        z-index: 3 !important;

        overflow: hidden !important;
    }

    .expanded-header-row::after {
        content: "" !important;

        display: block !important;

        position: absolute;

        z-index: 2;

        top: 0;
        bottom: 0;

        left: 100%;

        width:
            clamp(150px, 12vw, 250px);

        pointer-events: none;

        background:
            linear-gradient(
                90deg,
                rgba(4,64,70,.96) 0%,
                rgba(4,64,70,.82) 24%,
                rgba(4,64,70,.52) 48%,
                rgba(4,64,70,.20) 72%,
                rgba(4,64,70,0) 100%
            );
    }

    /*
       Cards themselves fade as they approach the title rail,
       so they never terminate against a hard clipping edge.
    */
    .cover-flow {
        -webkit-mask-image:
            linear-gradient(
                90deg,
                transparent 0%,
                rgba(0,0,0,.18) 3%,
                rgba(0,0,0,.58) 8%,
                #000 15%,
                #000 100%
            );

        mask-image:
            linear-gradient(
                90deg,
                transparent 0%,
                rgba(0,0,0,.18) 3%,
                rgba(0,0,0,.58) 8%,
                #000 15%,
                #000 100%
            );
    }

}

/* =========================================================
   FINAL SEAMLESS DESKTOP BLEND + FAST REVERSE ANIMATION
========================================================= */

@media (min-width: 801px) {

    /*
       The carousel is no longer physically forced to begin after
       the entire title rail. It can extend farther left behind the
       title zone, which recovers the unused space visible in the
       screenshots.
    */
    .expansion:not(.case-study-active) .expanded-content {
        position: relative !important;

        display: grid !important;

        grid-template-columns:
            1fr !important;

        grid-template-rows:
            1fr !important;

        overflow: hidden !important;
    }


    /*
       Title/description occupy a narrower overlay rail.
       The visual fade extends beyond it, but the structural rail
       itself no longer blocks nearly half the carousel.
    */
    .expansion:not(.case-study-active) .expanded-header-row {
        grid-column:
            1 !important;

        grid-row:
            1 !important;

        justify-self:
            start;

        width:
            clamp(390px, 31vw, 575px) !important;

        height:
            100%;

        z-index:
            8 !important;

        overflow:
            visible !important;

        padding-left:
            clamp(46px, 3.6vw, 72px) !important;

        padding-right:
            clamp(30px, 2.5vw, 48px) !important;

        background:
            transparent !important;

        pointer-events:
            none;
    }


    .expansion:not(.case-study-active)
    .expanded-header-row > div {
        width:
            100% !important;

        max-width:
            100% !important;

        overflow:
            hidden !important;

        position:
            relative !important;

        z-index:
            3 !important;
    }


    /*
       This is the new transition zone.
       It starts INSIDE the rail instead of on its right edge and
       dissolves gradually over a wide distance. There is no
       vertical "line" for the eye to catch.
    */
    .expansion:not(.case-study-active)
    .expanded-header-row::after {
        content:
            "" !important;

        display:
            block !important;

        position:
            absolute;

        z-index:
            1;

        top:
            0;

        bottom:
            0;

        left:
            0;

        width:
            calc(
                100%
                + clamp(190px, 16vw, 330px)
            );

        pointer-events:
            none;

        background:
            linear-gradient(
                90deg,
                rgba(4,64,70,1) 0%,
                rgba(4,64,70,1) 56%,
                rgba(4,64,70,.96) 63%,
                rgba(4,64,70,.84) 69%,
                rgba(4,64,70,.64) 75%,
                rgba(4,64,70,.42) 81%,
                rgba(4,64,70,.22) 87%,
                rgba(4,64,70,.08) 93%,
                rgba(4,64,70,0) 100%
            );
    }


    /*
       Flow stage fills the popup. Its usable center is nudged right
       just enough to respect the title, but cards may travel behind
       the gradient instead of disappearing at a hard boundary.
    */
    .expansion:not(.case-study-active)
    .flow-section {
        grid-column:
            1 !important;

        grid-row:
            1 !important;

        z-index:
            2 !important;

        width:
            100% !important;

        height:
            100% !important;

        padding-left:
            clamp(270px, 23vw, 430px) !important;

        border-left:
            0 !important;

        box-shadow:
            none !important;
    }


    /*
       Fade the WHOLE carousel progressively on the left.
       This is intentionally long and soft; no 1px boundary.
    */
    .expansion:not(.case-study-active)
    .cover-flow {
        -webkit-mask-image:
            linear-gradient(
                90deg,
                transparent 0%,
                rgba(0,0,0,.04) 5%,
                rgba(0,0,0,.13) 10%,
                rgba(0,0,0,.28) 15%,
                rgba(0,0,0,.48) 20%,
                rgba(0,0,0,.70) 25%,
                rgba(0,0,0,.88) 30%,
                #000 36%,
                #000 100%
            ) !important;

        mask-image:
            linear-gradient(
                90deg,
                transparent 0%,
                rgba(0,0,0,.04) 5%,
                rgba(0,0,0,.13) 10%,
                rgba(0,0,0,.28) 15%,
                rgba(0,0,0,.48) 20%,
                rgba(0,0,0,.70) 25%,
                rgba(0,0,0,.88) 30%,
                #000 36%,
                #000 100%
            ) !important;
    }


    /*
       Contact cards also move left slightly now that the title rail
       is narrower. They remain behind the title gradient.
    */
    .expansion-profile:not(.case-study-active)
    .contact-grid {
        grid-column:
            1 !important;

        grid-row:
            1 !important;

        z-index:
            2 !important;

        width:
            auto !important;

        align-self:
            center !important;

        margin:
            0
            clamp(24px, 2.7vw, 48px)
            0
            clamp(370px, 36vw, 650px) !important;
    }

}


/* =========================================================
   CLOSE: FADE AND GEOMETRY MOVE AT THE SAME TIME
========================================================= */

.expansion.is-closing .expanded-content {
    opacity:
        0 !important;

    transform:
        translateY(3px) scale(.995) !important;

    transition:
        opacity .11s ease-out,
        transform .16s ease-out !important;
}


/*
   Do NOT switch the popup contents to visibility:hidden the instant
   the return starts. That old rule created a perceptible "beat"
   between fade and movement. Overflow on .expansion already clips
   the fading content as the shell contracts.
*/
.expansion.geometry-closing .expanded-content,
.expansion.geometry-closing .expanded-title-shield,
.expansion.geometry-closing .expanded-blob,
.expansion.geometry-closing .expanded-blob-small {
    visibility:
        visible !important;
}


/*
   Decorative elements fade quickly while movement is underway.

    document.querySelectorAll(
        "[data-panel]"
    );

    document.getElementById(
        "expansionBackdrop"
    );


const lightbox =
    document.getElementById(
        "lightbox"
    );

    document.getElementById(
        "lightboxImage"
    );


const lightboxClose =
    document.getElementById(
        "lightboxClose"
    );


let activePanel =
    null;


let expansion =
    null;


let flyingTitle =
    null;


let closeButton =
    null;


let activeCaseStudy =
    null;


let caseStudyObserver =
    null;


/* =========================================================
   EXPANDED TITLE SIZE
========================================================= */

function getExpandedTitleSize(
    key,
    originalSize
) {

    const mobile =
        window.innerWidth <= 800;


    if (mobile) {


        if (key === "profile") {

            return Math.min(
                Math.max(
                    originalSize * .73,
                    31
                ),
                38
            );
        }


        if (key === "projects") {

            return Math.min(
                Math.max(
                    originalSize * .58,
                    25
                ),
                32
            );
        }


        if (key === "skills") {

            return Math.min(
                Math.max(
                    originalSize * .76,
                    20
                ),
                27
            );
        }


        if (
            key === "gallery"
            ||
            key === "mini"
        ) {

            return Math.min(
                Math.max(
                    originalSize * .70,
                    23
                ),
                30
            );
        }

    }


    else {


        /*
           Desktop titles are intentionally oversized.
           The left side is now a true editorial title rail.
        */

        if (key === "profile") {

            return Math.min(
                Math.max(
                    originalSize * 1.02,
                    100
                ),
                126
            );
        }


        if (key === "projects") {

            return Math.min(
                Math.max(
                    originalSize * 1.22,
                    96
                ),
                116
            );
        }


        if (key === "skills") {

            return Math.min(
                Math.max(
                    originalSize * 1.46,
                    72
                ),
                84
            );
        }


        if (
            key === "gallery"
            ||
            key === "mini"
        ) {

            return Math.min(
                Math.max(
                    originalSize * 1.30,
                    86
                ),
                102
            );
        }

    }


    return 32;
}


/* =========================================================
   LEFT-RAIL DECORATIVE SCENES
   Desktop-only through CSS. Kept inline and lightweight.
========================================================= */

function getLeftRailScene(key) {

    /* Decorative rail animations intentionally disabled. */
    return "";
}


/* =========================================================
   OPEN PANEL
========================================================= */

function openPanel(panel) {


    if (activePanel) {
        return;
    }


    activePanel =
        panel;


    const key =
        panel.dataset.panel;


    const panelRect =
        panel.getBoundingClientRect();


    const originalTitle =
        panel.querySelector(
            "[data-title]"
        );


    const titleRect =
        originalTitle
        .getBoundingClientRect();


    const titleStyle =
        getComputedStyle(
            originalTitle
        );


    const panelStyle =
        getComputedStyle(
            panel
        );


    const originalFontSize =
        parseFloat(
            titleStyle.fontSize
        );


    /* -----------------------------------------------------
       BACKDROP
    ----------------------------------------------------- */

    backdrop.hidden =
        false;


    requestAnimationFrame(
        () => {

            backdrop.classList.add(
                "open"
            );

        }
    );


    /* -----------------------------------------------------
       EXPANDING BOX
    ----------------------------------------------------- */

    expansion =
        document.createElement(
            "div"
        );


    expansion.className =
        `expansion expansion-${key}`;


    expansion.style.left =
        `${panelRect.left}px`;


    expansion.style.top =
        `${panelRect.top}px`;


    expansion.style.width =
        `${panelRect.width}px`;


    expansion.style.height =
        `${panelRect.height}px`;


    expansion.style.borderRadius =
        panelStyle.borderRadius;


    expansion.innerHTML =
        `

        <div class="expanded-blob"></div>

        <div class="expanded-blob-small"></div>

        ${
            key === "profile"
                ? `
                  <div class="planet-system profile-scatter-system">
                      ${panel.querySelector(".planet-system")?.innerHTML || ""}
                  </div>
                  `
                : ""
        }

        <div class="expanded-title-shield"></div>


        <div class="expanded-content">


            <div class="expanded-header-row">


                <div>


                    <div class="expanded-kicker">

                        ${content[key].kicker}

                    </div>


                    <div class="expanded-description">

                        ${content[key].description}

                    </div>


                    ${getLeftRailScene(key)}


                </div>


            </div>


            ${content[key].html}


        </div>

        `;


    document.body.appendChild(
        expansion
    );


    /* -----------------------------------------------------
       FLYING TITLE
    ----------------------------------------------------- */

    flyingTitle =
        document.createElement(
            originalTitle.tagName
        );


    flyingTitle.className =
        "flying-title";


    flyingTitle.dataset.key =
        key;


    flyingTitle.innerHTML =
        originalTitle.innerHTML;


    flyingTitle.style.left =
        `${titleRect.left}px`;


    flyingTitle.style.top =
        `${titleRect.top}px`;


    flyingTitle.style.width =
        `${titleRect.width}px`;


    flyingTitle.style.fontSize =
        titleStyle.fontSize;


    flyingTitle.style.lineHeight =
        titleStyle.lineHeight;


    document.body.appendChild(
        flyingTitle
    );


    originalTitle.style.opacity =
        "0";


    panel.style.opacity =
        "0";


    /* -----------------------------------------------------
       FINAL BOX
    ----------------------------------------------------- */

    const margin =
        window.innerWidth <= 800
            ? 6
            : 22;


    const finalLeft =
        margin;


    const finalTop =
        margin;


    const finalWidth =
        window.innerWidth
        - margin * 2;


    const finalHeight =
        window.innerHeight
        - margin * 2;


    const finalTitleLeft =
        finalLeft
        + (
            window.innerWidth <= 800
                ? 18
                : Math.max(42, window.innerWidth * .027)
        );


    const finalTitleSize =
        getExpandedTitleSize(
            key,
            originalFontSize
        );


    const titleLineCount =
        originalTitle.querySelectorAll(
            ".title-line"
        ).length || 1;


    const estimatedTitleHeight =
        finalTitleSize
        * 1.04
        * titleLineCount;


    const finalTitleTop =
        window.innerWidth <= 800
            ? finalTop + 21
            : (
                key === "profile"
                    ? finalTop
                      + finalHeight * .49
                      - estimatedTitleHeight / 2
                    : finalTop
                      + finalHeight * .42
                      - estimatedTitleHeight / 2
              );


    const finalTitleWidth =
        window.innerWidth <= 800
            ? Math.min(
                finalWidth * .78,
                1100
            )
            : Math.min(
                finalWidth * .335,
                625
            );


    /*
       Keep the section label and description directly below the
       large travelling title. This is calculated from the title
       position instead of using a fixed top/bottom offset, so
       short and long headings do not collide with their copy.
    */
    if (window.innerWidth > 800) {

        const railCopyTop =
            Math.min(
                finalHeight - 185,
                Math.max(
                    112,
                    (finalTitleTop - finalTop)
                    + estimatedTitleHeight
                    + 28
                )
            );

        expansion.style.setProperty(
            "--rail-copy-top",
            `${railCopyTop}px`
        );

    }


    requestAnimationFrame(
        () => {


            expansion.style.left =
                `${finalLeft}px`;


            expansion.style.top =
                `${finalTop}px`;


            expansion.style.width =
                `${finalWidth}px`;


            expansion.style.height =
                `${finalHeight}px`;


            expansion.style.borderRadius =
                window.innerWidth <= 800
                    ? "23px"
                    : "38px";


            flyingTitle.style.left =
                `${finalTitleLeft}px`;


            flyingTitle.style.top =
                `${finalTitleTop}px`;


            flyingTitle.style.fontSize =
                `${finalTitleSize}px`;


            flyingTitle.style.lineHeight =
                "1.04";


            flyingTitle.style.width =
                `${finalTitleWidth}px`;


            flyingTitle.classList.add(
                "compact"
            );


        }
    );


    /*
       Profile planets begin as the same clustered system seen
       on the dashboard, then separate across the expanded panel.
       Their original float/orbit animations continue while the
       independent CSS `translate` property moves them apart.
    */
    if (key === "profile") {

        setTimeout(
            () => {

                const scatterSystem =
                    expansion?.querySelector(
                        ".profile-scatter-system"
                    );

                if (scatterSystem) {
                    scatterSystem.classList.add(
                        "scattered"
                    );
                }

            },
            150
        );

    }


    /* -----------------------------------------------------
       CLOSE
    ----------------------------------------------------- */

    closeButton =
        document.createElement(
            "button"
        );


    closeButton.className =
        "expansion-close";


    closeButton.innerHTML =
        `
        <i class="fa-solid fa-xmark"></i>
        `;


    document.body.appendChild(
        closeButton
    );


    positionCloseButton();


    closeButton.addEventListener(
        "click",
        closeActivePanel
    );


    /* -----------------------------------------------------
       SHOW CONTENT
    ----------------------------------------------------- */

    setTimeout(
        () => {


            if (!expansion) {
                return;
            }


            expansion.classList.add(
                "content-visible"
            );


            closeButton.classList.add(
                "visible"
            );


            initialiseCoverFlows();


            bindGalleryItems();


            bindCaseStudyLaunchers();


        },

        430
    );

}


/* =========================================================
   CLOSE PANEL
========================================================= */

function closeActivePanel() {

    if (
        !activePanel
        ||
        !expansion
        ||
        !flyingTitle
    ) {
        return;
    }


    const panel =
        activePanel;


    const originalTitle =
        panel.querySelector(
            "[data-title]"
        );


    /*
       Keep the real dashboard tile in place but invisible until
       the animated shell has physically reached it.
    */
    panel.classList.add(
        "panel-return-target"
    );

    panel.style.opacity =
        "0";

    originalTitle.style.opacity =
        "0";


    /*
       Profile planets collapse at the SAME TIME as the popup
       starts travelling home. No separate half-second pause.
    */
    const scatterSystem =
        expansion.querySelector(
            ".profile-scatter-system"
        );

    if (scatterSystem) {
        scatterSystem.classList.remove(
            "scattered"
        );
    }


    /*
       Fade content immediately.
    */
    expansion.classList.add(
        "is-closing"
    );


    if (closeButton) {
        closeButton.classList.remove(
            "visible"
        );
    }


    backdrop.classList.remove(
        "open"
    );


    let closeFinished =
        false;


    function finishClose() {

        if (closeFinished) {
            return;
        }

        closeFinished =
            true;


        panel.classList.remove(
            "panel-return-target"
        );

        panel.style.opacity =
            "";

        originalTitle.style.opacity =
            "";


        if (expansion) {
            expansion.remove();
        }

        if (flyingTitle) {
            flyingTitle.remove();
        }

        if (closeButton) {
            closeButton.remove();
        }


        backdrop.hidden =
            true;


        expansion =
            null;

        flyingTitle =
            null;

        closeButton =
            null;

        activePanel =
            null;

        activeCaseStudy =
            null;


        if (caseStudyObserver) {
            caseStudyObserver.disconnect();
            caseStudyObserver = null;
        }

    }


    function startReturnAnimation() {

        if (
            !expansion
            ||
            !flyingTitle
            ||
            !activePanel
        ) {
            return;
        }


        const panelDestination =
            panel.getBoundingClientRect();


        const titleDestination =
            originalTitle.getBoundingClientRect();


        const titleStyle =
            getComputedStyle(
                originalTitle
            );


        const panelStyle =
            getComputedStyle(
                panel
            );


        /*
           Return the title to its dashboard line arrangement.
        */
        flyingTitle.classList.remove(
            "compact"
        );


        /*
           Geometry-closing no longer instantly hides the contents;
           they are already fading with .is-closing while the shell
           starts moving. That removes the stop-start feeling.
        */
        expansion.classList.add(
            "geometry-closing"
        );


        /*
           Commit the closing state, then change geometry on the
           next animation frame so the browser has one clean
           interpolation from popup -> dashboard tile.
        */
        void expansion.offsetWidth;


        requestAnimationFrame(
            () => {

                if (!expansion || !flyingTitle) {
                    return;
                }


                expansion.style.left =
                    `${panelDestination.left}px`;

                expansion.style.top =
                    `${panelDestination.top}px`;

                expansion.style.width =
                    `${panelDestination.width}px`;

                expansion.style.height =
                    `${panelDestination.height}px`;

                expansion.style.borderRadius =
                    panelStyle.borderRadius;


                flyingTitle.style.left =
                    `${titleDestination.left}px`;

                flyingTitle.style.top =
                    `${titleDestination.top}px`;

                flyingTitle.style.width =
                    `${titleDestination.width}px`;

                flyingTitle.style.fontSize =
                    titleStyle.fontSize;

                flyingTitle.style.lineHeight =
                    titleStyle.lineHeight;

            }
        );


        /*
           Finish based on the actual CSS transition rather than a
           fixed timeout. This prevents the final-frame hitch.
        */
        const onTransitionEnd =
            event => {

                if (
                    event.target === expansion
                    &&
                    (
                        event.propertyName === "width"
                        ||
                        event.propertyName === "height"
                    )
                ) {

                    expansion.removeEventListener(
                        "transitionend",
                        onTransitionEnd
                    );

                    finishClose();

                }

            };


        expansion.addEventListener(
            "transitionend",
            onTransitionEnd
        );


        /*
           Safety fallback only; normally transitionend wins.
        */
        setTimeout(
            finishClose,
            760
        );

    }


    /*
       A tiny overlap lets the text begin fading before movement,
       but there is no perceptible pause. Profile gets a few extra
       milliseconds so the scattered planets visibly start folding
       inward while the panel begins its return.
    */
    setTimeout(
        startReturnAnimation,
        scatterSystem ? 65 : 24
    );

}

/* =========================================================
   COVER FLOW
========================================================= */

function initialiseCoverFlows() {

    if (!expansion) {
        return;
    }


    expansion
        .querySelectorAll(
            "[data-cover-flow]"
        )
        .forEach(
            track => {

                const cards =
                    Array.from(
                        track.querySelectorAll(
                            ".flow-card"
                        )
                    );


                if (!cards.length) {
                    return;
                }


                const dotsContainer =
                    expansion.querySelector(
                        `[data-dots-for="${track.id}"]`
                    );


                let dots = [];
                let ticking = false;


                /* -----------------------------------------
                   CENTER ONE CARD WITHOUT scrollIntoView()
                ----------------------------------------- */

                function centerCard(
                    card,
                    smooth = true
                ) {

                    const target =
                        card.offsetLeft
                        -
                        (
                            track.clientWidth
                            -
                            card.offsetWidth
                        ) / 2;


                    track.scrollTo({

                        left:
                            Math.max(
                                0,
                                target
                            ),

                        behavior:
                            smooth
                                ? "smooth"
                                : "auto"

                    });

                }


                /*
                   Expose the helper to gallery click handling.
                */
                track._centerCard =
                    centerCard;


                /* -----------------------------------------
                   BUILD DOTS
                ----------------------------------------- */

                if (dotsContainer) {

                    dotsContainer.innerHTML =
                        "";


                    cards.forEach(
                        (card,index) => {

                            const dot =
                                document.createElement(
                                    "button"
                                );


                            dot.className =
                                "flow-dot";


                            dot.type =
                                "button";


                            dot.setAttribute(
                                "aria-label",
                                `Go to card ${index + 1}`
                            );


                            dot.addEventListener(
                                "click",
                                event => {

                                    event.stopPropagation();

                                    centerCard(
                                        card,
                                        true
                                    );

                                }
                            );


                            dotsContainer.appendChild(
                                dot
                            );


                            dots.push(
                                dot
                            );

                        }
                    );

                }


                /* -----------------------------------------
                   COVER FLOW CALCULATION

                   IMPORTANT:
                   offsetLeft / offsetWidth are untransformed
                   layout geometry. This prevents the visual
                   transform from feeding back into the next
                   frame's position calculation.
                ----------------------------------------- */

                function updateFlow() {

                    const viewportCenter =
                        track.scrollLeft
                        +
                        track.clientWidth / 2;


                    let closestIndex =
                        0;


                    let closestDistance =
                        Infinity;


                    cards.forEach(
                        (card,index) => {

                            const cardCenter =
                                card.offsetLeft
                                +
                                card.offsetWidth / 2;


                            const distance =
                                cardCenter
                                -
                                viewportCenter;


                            const normal =
                                distance
                                /
                                card.offsetWidth;


                            const abs =
                                Math.min(
                                    Math.abs(normal),
                                    1.8
                                );


                            const scale =
                                1
                                -
                                Math.min(
                                    abs,
                                    1
                                )
                                * .13;


                            const rotate =
                                Math.max(
                                    -20,
                                    Math.min(
                                        20,
                                        normal * -18
                                    )
                                );


                            const translateY =
                                Math.min(
                                    abs * 16,
                                    20
                                );


                            /*
                               Slight inward shift creates the
                               iTunes / Cover Flow stacking
                               without changing actual layout.
                            */
                            const translateX =
                                Math.max(
                                    -24,
                                    Math.min(
                                        24,
                                        normal * -20
                                    )
                                );


                            const opacity =
                                Math.max(
                                    .40,
                                    1
                                    -
                                    abs * .44
                                );


                            const blur =
                                Math.min(
                                    abs * .30,
                                    .45
                                );


                            card.style.transform =
                                `
                                translate3d(
                                    ${translateX}px,
                                    ${translateY}px,
                                    0
                                )
                                rotateY(${rotate}deg)
                                scale(${scale})
                                `;


                            card.style.opacity =
                                opacity;


                            card.style.filter =
                                `blur(${blur}px)`;


                            card.style.zIndex =
                                `${
                                    100
                                    -
                                    Math.round(
                                        abs * 10
                                    )
                                }`;


                            const absoluteDistance =
                                Math.abs(
                                    distance
                                );


                            if (
                                absoluteDistance
                                <
                                closestDistance
                            ) {

                                closestDistance =
                                    absoluteDistance;

                                closestIndex =
                                    index;

                            }

                        }
                    );


                    cards.forEach(
                        (card,index) => {

                            card.classList.toggle(
                                "is-center",
                                index === closestIndex
                            );

                        }
                    );


                    dots.forEach(
                        (dot,index) => {

                            dot.classList.toggle(
                                "active",
                                index === closestIndex
                            );

                        }
                    );


                    ticking =
                        false;

                }


                function requestUpdate() {

                    if (ticking) {
                        return;
                    }


                    ticking =
                        true;


                    requestAnimationFrame(
                        updateFlow
                    );

                }


                track.addEventListener(
                    "scroll",
                    requestUpdate,
                    {
                        passive: true
                    }
                );


                /*
                   Tapping a side card centers it first.
                   Center-card links still open normally.
                */
                cards.forEach(
                    card => {

                        card.addEventListener(
                            "click",
                            event => {

                                if (
                                    card.classList.contains(
                                        "is-center"
                                    )
                                ) {
                                    return;
                                }


                                event.preventDefault();

                                event.stopPropagation();


                                centerCard(
                                    card,
                                    true
                                );

                            }
                        );

                    }
                );


                /*
                   Start with the first card centered without
                   scrollIntoView(), so no ancestor or popup
                   can jump sideways.
                */
                requestAnimationFrame(
                    () => {

                        centerCard(
                            cards[0],
                            false
                        );


                        requestAnimationFrame(
                            updateFlow
                        );

                    }
                );

            }
        );

}


/* =========================================================
   GALLERY LIGHTBOX
========================================================= */

function bindGalleryItems() {


    if (!expansion) {
        return;
    }


    expansion
        .querySelectorAll(
            ".gallery-item"
        )
        .forEach(
            item => {


                if (
                    item.dataset.bound
                ) {

                    return;
                }


                item.dataset.bound =
                    "true";


                item.addEventListener(
                    "click",
                    event => {


                        /*
                           Only the centered Cover Flow
                           card opens. Side cards are
                           primarily for navigation.
                        */


                        if (
                            !item.classList.contains(
                                "is-center"
                            )
                        ) {

                            const track =
                                item.closest(
                                    "[data-cover-flow]"
                                );


                            if (
                                track
                                &&
                                typeof track._centerCard
                                === "function"
                            ) {

                                track._centerCard(
                                    item,
                                    true
                                );

                            }


                            return;
                        }


                        event.stopPropagation();


                        lightboxImage.src =
                            item.dataset.image;


                        lightbox.classList.add(
                            "open"
                        );


                    }
                );


            }
        );

}
